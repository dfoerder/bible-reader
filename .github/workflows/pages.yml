name: Deploy to GitHub Pages
# Veröffentlicht main unter /bible-reader/ und dev als Vorschau unter /bible-reader/dev/.
on:
  push:
    branches: [main, dev]
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with: { ref: main, path: site }
      - uses: actions/checkout@v4
        with: { ref: dev, path: devsrc }
        continue-on-error: true
      - name: Vorschau aus dev unter /dev/ einbauen
        run: |
          if [ ! -f devsrc/index.html ]; then echo "kein dev-Branch – nur main"; exit 0; fi
          rsync -a --exclude .git --exclude ios --exclude www --exclude node_modules devsrc/ site/dev/
          # eigener Cache, und alte Caches nur unter "dev-" aufräumen (nicht die der echten App)
          sed -i "s/const CACHE_NAME = '/const CACHE_NAME = 'dev-/" site/dev/sw.js
          sed -i "s/keys.filter(k => k !== CACHE_NAME)/keys.filter(k => k.startsWith('dev-') \&\& k !== CACHE_NAME)/" site/dev/sw.js
          grep -q "startsWith('dev-')" site/dev/sw.js || { echo "sw.js-Anpassung fehlgeschlagen"; exit 1; }
          # Datentrennung + DEV-Markierung direkt nach <head> einfügen
          python3 - <<'PY'
          p='site/dev/index.html'; t=open(p,encoding='utf-8').read()
          shim=open('devsrc/.github/dev-shim.html',encoding='utf-8').read()
          i=t.index('<head>')+len('<head>'); open(p,'w',encoding='utf-8').write(t[:i]+'\n'+shim+t[i:])
          PY
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
