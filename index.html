<script>
// Läuft vor dem Babel-Block, hat also kein Zugriff auf INSTANCE dort unten —
// eigener, gleich zu haltender Präfix. Sync-Skript ersetzt beide Stellen synchron.
/* LS-PREFIX-EARLY-START */
var LS_PREFIX='';
/* LS-PREFIX-EARLY-END */
function toggleViewMode(){
  var b=document.body, btn=document.querySelector('.view-toggle');
  if(b.classList.contains('mode-phone')){
    b.classList.replace('mode-phone','mode-desktop');
    btn.textContent='Phone';
    localStorage.setItem(LS_PREFIX+'bible-view-mode','desktop');
  } else {
    b.classList.replace('mode-desktop','mode-phone');
    btn.textContent='Desktop';
    localStorage.setItem(LS_PREFIX+'bible-view-mode','phone');
  }
}
(function(){
  var isPWA=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone;
  var isMobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||('ontouchstart' in window&&window.innerWidth<600);
  if(isPWA||isMobile){
    document.body.classList.replace('mode-phone','mode-desktop');
    document.querySelector('.view-toggle').style.display='none';
  } else {
    var m=localStorage.getItem(LS_PREFIX+'bible-view-mode');
    if(m==='desktop'){
      document.body.classList.replace('mode-phone','mode-desktop');
      document.querySelector('.view-toggle').textContent='Phone';
    }
  }
})();
</script>

  return items.map(it=>{const o=it.opt[glossLang]||it.opt[fb];return {en:it.word,de:o[0],wrong:o.slice(1),level:it.level};});
}

function scoreLevelTest(answers, test){
  const byLevel={A1:0,A2:0,B1:0,B2:0,C1:0,C2:0};
  const maxByLevel={A1:0,A2:0,B1:0,B2:0,C1:0,C2:0};
  test.forEach((q,i)=>{
    maxByLevel[q.level]++;
    if(answers[i]===q.de)byLevel[q.level]++;
  });
  const pct=lvl=>maxByLevel[lvl]?byLevel[lvl]/maxByLevel[lvl]:0;
  if(pct('A1')<0.5)return 'A1';
  if(pct('A2')<0.5)return 'A1';
  if(pct('B1')<0.5)return 'A2';
  if(pct('B2')<0.5)return 'B1';
  if(pct('C1')<0.5)return 'B2';
  if(pct('C2')<0.5)return 'C1';
  return 'C2';
}

function LevelTest({onComplete, test}){
  const [current,setCurrent]=useState(0);
  const [answers,setAnswers]=useState([]);
  const [shuffled]=useState(()=>test.map(q=>{
    const opts=[q.de,...q.wrong];
    for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]]}
    return opts;
  }));
  const [selected,setSelected]=useState(null);
  const [correct,setCorrect]=useState(null);
  const [done,setDone]=useState(false);
  const [result,setResult]=useState(null);

  const q=test[current];
  const opts=shuffled[current];

  const pick=useCallback(ans=>{
    if(selected!==null)return;
    setSelected(ans);
    setCorrect(ans===q.de);
    const newAnswers=[...answers,ans];
    setAnswers(newAnswers);
    setTimeout(()=>{
      if(current<test.length-1){
        setCurrent(current+1);setSelected(null);setCorrect(null);
      } else {
        const level=scoreLevelTest(newAnswers, test);
        setResult(level);setDone(true);
      }
    },800);
  },[current,answers,q,selected]);

  if(done){
    const total=answers.filter((a,i)=>a===test[i].de).length;
    const byLevel={};
    test.forEach((q,i)=>{
      if(!byLevel[q.level])byLevel[q.level]={correct:0,total:0};

    return(<div>

            {lvl:'A1',desc:{de:'Elementarste Grundlagen',en:'Most basic fundamentals'}},

            {lvl:'B1',desc:{de:'Selbstständige Alltagsbewältigung',en:'Independent everyday use'}},
            {lvl:'B2',desc:{de:'Flüssige, detaillierte Kommunikation',en:'Fluent, detailed communication'}},
            {lvl:'C1',desc:{de:'Flexible, effektive Sprachverwendung',en:'Flexible, effective language use'}},
            {lvl:'C2',desc:{de:'Beherrschung auf Expertenniveau',en:'Expert-level mastery'}}

            <div key={lvl} style={{fontFamily:sans}}>
              <div style={{display:'flex',alignItems:'center',gap:8,fontSize:14}}>
                <span style={{fontWeight:700,color:lvl===result?'var(--t-primary)':'var(--t-title)',width:28}}>{lvl}</span>
                <div style={{flex:1,background:'var(--t-border)',borderRadius:4,height:8,overflow:'hidden'}}>

              </div>

            </div>);
          })}

          {t('levelChangeHint')}

        <button onClick={()=>onComplete(result)} style={S.startBtn}>{t('next')}</button>
      </div>
    </div>);
  }

  return(<div>
    <header style={S.header}>
      <h1 style={{...S.title,margin:0}}>{t('levelTest')}</h1>

let CLOZE_EXERCISES={A1:[],A2:[],B1:[],B2:[],C1:[],C2:[]};

let VOCAB_POOL={A1:[],A2:[],B1:[],B2:[],C1:[],C2:[]};

const SUBSTEPS=['A1.1','A1.2','A1.3','A2.1','A2.2','A2.3','B1.1','B1.2','B1.3','B2.1','B2.2','B2.3','C1.1','C1.2','C1.3','C2.1','C2.2','C2.3'];
function levelToStep(lvl){const i=SUBSTEPS.findIndex(s=>s.startsWith(lvl));return i>=0?i:6;}
function stepToLevel(step){return SUBSTEPS[step].split('.')[0];}
function stepLabel(step){return SUBSTEPS[step]||'B1.1';}
let FREQ_POOL=[];
// Wichtige Eigennamen (Personen/Orte), die in Übungen VORKOMMEN dürfen. Alle
// übrigen großgeschriebenen Lemmata (Genealogie-/Nebennamen) werden gefiltert.
// Leer = kein Filter (Editionen ohne Eigennamen-Annotation, z.B. eng-web).
let KEEP_NAMES=new Set();
let DE_POS={},EN_POS={};
function buildFreqPool(){
  FREQ_POOL=Object.values(VOCAB_POOL).flat().sort((a,b)=>(b.occ||0)-(a.occ||0));
  const n=FREQ_POOL.length;const steps=SUBSTEPS.length;
  FREQ_POOL.forEach((w,i)=>{w.freqStep=Math.min(Math.floor(i/(n/steps)),steps-1)});
  FREQ_STEP_OF=new Map(FREQ_POOL.map(w=>[w.en,w.freqStep]));
  DE_POS={};EN_POS={};
  FREQ_POOL.forEach(w=>{if(w.pos){if(w.de&&!(w.de in DE_POS))DE_POS[w.de]=w.pos;if(w.en)EN_POS[w.en]=w.pos;}});
}
// Worttyp eines (annotierten) Wortes bestimmen: erst Lemma/EN, dann DE-Übersetzung
function posOf(w){return (w.pos)||(w.lemma&&EN_POS[w.lemma])||(w.word&&EN_POS[w.word])||(w.de&&DE_POS[w.de])||null;}
// Zwei falsche DE-Optionen, bevorzugt mit gleichem Worttyp wie das Zielwort; bei zu wenigen mit beliebigen auffüllen
function posWrongDe(target,dePool){
  const cand=dePool.filter(d=>d!==target.de);
  const tPos=posOf(target);
  if(!tPos)return shuffleArr(cand).slice(0,2);
  const same=cand.filter(d=>DE_POS[d]===tPos);
  const ranked=same.length>=2?same:[...same,...cand.filter(d=>DE_POS[d]!==tPos)];
  return shuffleArr(ranked).slice(0,2);
}
// Lückentext-Distraktoren: deForm-Pool gruppiert nach Wortart|Form (Numerus/Tempus)
let CLOZE_BY_PF={};
let CLOZE_MAP=new Map(); // Lemma → Cloze-Übung (Kontext-Modus)
let WORD_BY_EN=new Map(); // en → Wort-Objekt (für Übungsart-Wechsel während der Einheit)
let WORD_STEP=new Map(); // Lemma → Sublevel-Stufe 0–17 (aus words.json level+sub)
let FREQ_STEP_OF=new Map(); // en → Häufigkeitsstufe 0–17 (freqStep)
// Level-Info für die Übungsanzeige (Einstellung „Level in Übungen"): CEFR-Sublevel
// (A1.1…C2.3) + Häufigkeitsstufe (1…18). null, wenn das Wort in keiner Skala liegt.
function exLevelInfo(en){
  const cs=WORD_STEP.get(en),fs=FREQ_STEP_OF.get(en);
  if(cs==null&&fs==null)return null;
  return {cefr:cs!=null?SUBSTEPS[cs]:'—',freq:fs!=null?fs+1:'—'};
}
// Level-Zeile in Übungen (nur wenn Einstellung „Stufen in Übungen" aktiv)
function ExLevelTag({en}){
  if(LS.get('bible-show-ex-level')!==true)return null;
  const li=exLevelInfo(en);
  if(!li)return null;
  return <p style={{fontSize:11,color:'var(--t-muted2)',fontFamily:sans,textAlign:'center',margin:'6px 0 0'}}>{t('exLevelBoth').replace('{c}',li.cefr).replace('{f}',li.freq)}</p>;
}
function formWrong(target){
  const key=(target.pos||'')+'|'+(target.form||'base');
  const same=(CLOZE_BY_PF[key]||[]).filter(d=>d!==target.de);
  if(same.length>=2)return shuffleArr(same).slice(0,2);
  // Fallback: gleiche Wortart, beliebige Form
  const pfx=(target.pos||'')+'|';
  const samePos=Object.keys(CLOZE_BY_PF).filter(k=>k.startsWith(pfx)).flatMap(k=>CLOZE_BY_PF[k]).filter(d=>d!==target.de&&!same.includes(d));
  let r=[...same,...shuffleArr(samePos)];
  if(r.length>=2)return r.slice(0,2);
  // letzter Fallback: beliebige Form
  const any=Object.values(CLOZE_BY_PF).flat().filter(d=>d!==target.de&&!r.includes(d));
  return [...r,...shuffleArr(any)].slice(0,2);
}
// Form-Kategorie (sg/pl/inf/pres/past/part/base) eines Kapitel-Vorkommens aus engl. Wortform + Lemma ableiten
function clozeFormOf(lemma,form,pos){
  if(!pos||!form||!lemma)return 'base';
  const f=form.toLowerCase().replace(/[^a-z]/g,''),l=lemma.toLowerCase();
  if(pos==='noun'){
    if(f!==l&&(f===l+'s'||f===l+'es'||(l.endsWith('y')&&f===l.slice(0,-1)+'ies')||(f.endsWith('s')&&!l.endsWith('s')&&f.length>l.length)))return 'pl';
    return 'sg';
  }
  if(pos==='verb'){
    if(f.endsWith('ing'))return 'part';
    if(f===l)return 'inf';
    if(f===l+'s'||f===l+'es')return 'pres';
    return 'past';
  }
  return 'base';
}
// Spaced Repetition (siehe projekt-training-konzept.md): Tage bis zur nächsten
// Fälligkeit je Familiarity-Stufe. fam=3 wird nur als seltene Stichprobe wiederholt.
// Wiederholt werden nur aktiv gelernte Wörter (learned>0, waren also einmal fam=0) —
// direkt als bekannt markierte Wörter (✓ bei „Wörter anschauen") brauchen keine Festigung.
const REVIEW_WAIT_DAYS={1:2,2:7,3:60};
function reviewDue(d,now){
  if(!d||d.familiarity<1||d.familiarity>3)return false;
  if(!((d.learned||0)>0))return false;
  if(!d.lasttrained)return true;
  return now-new Date(d.lasttrained).getTime()>=REVIEW_WAIT_DAYS[d.familiarity]*DAY_EFF;
}
function vocabForStep(step,focus){
  if(focus==='freq'){
    const words=FREQ_POOL.filter(w=>w.freqStep<=step);
    return {words,allDe:FREQ_POOL.map(w=>w.de)};
  }
  const lvl=stepToLevel(step);const sub=1+(step%3);const pool=VOCAB_POOL[lvl]||[];return {words:pool.filter(w=>w.sub<=sub),allDe:pool.map(w=>w.de)};
}
function maxStepFor(){for(let s=SUBSTEPS.length-1;s>=0;s--){if((VOCAB_POOL[stepToLevel(s)]||[]).length>0)return s;}return 0;}

// Knopf "Weitere Beispiele": zeigt nach falscher Antwort weitere Beispielverse zum Lemma.
// Index liefert nur Referenzen; der Verstext wird on-the-fly aus den Bibeltext-Dateien geholt.
// Übungs-Schriftgröße: eigene Einstellung, Default = Bibeltext-Größe
function exFontSize(){return parseInt(LS.get('bible-font-size-ex'))||parseInt(LS.get('bible-font-size'))||18;}

// ── Reine Trainings-Bausteine (von Training/App UND der Lerner-Simulation genutzt) ──
// Levelanpassung nach First-Pass-Quote (5-stufig)
const levelDelta=pct=>pct>=1?2:pct>0.8?1:pct>=0.7?0:pct>=0.4?-1:-2;
// Mindestzahl gewerteter Wörter für eine Levelanpassung: kurz vor Stufen-Erschöpfung
// bestehen Einheiten fast nur aus Wiederholungen/Beimischungen — auf 1–3 gewerteten
// Wörtern wäre die Quote reines Rauschen (1 Fehler = Absturz). Darunter: Level halten.
const MIN_LEVEL_ADJ_WORDS=5;
// Familiarity-Übergang inkl. Intervall-Guard (Erhöhen nur nach Ablauf der Stufen-Frist,
// Erniedrigen immer erlaubt); liefert den neuen Wortdaten-Eintrag
function applyTrainWord(e,newFam,now){
  e=e||{familiarity:-1,lasttrained:null,numberoftrainings:0,learned:0,forgotten:0};
  const oldFam=e.familiarity;
  const lt=e.lasttrained?new Date(e.lasttrained).getTime():null;
  const waitDays=oldFam>=1?(REVIEW_WAIT_DAYS[oldFam]||60):1;
  const canIncrease=!lt||(now-lt>=waitDays*DAY_EFF);
  const effectiveFam=newFam>oldFam&&!canIncrease?oldFam:newFam;
  return {familiarity:effectiveFam,lasttrained:new Date(now).toISOString(),
    numberoftrainings:(e.numberoftrainings||0)+1,
    learned:(e.learned||0)+(oldFam===0&&effectiveFam>0?1:0),
    forgotten:(e.forgotten||0)+(oldFam>0&&effectiveFam===0?1:0)};
}
// Review-Phase (nach C2.3): CEFR-Sublevels in Nützlichkeits-Reihenfolge — Zickzack-Spirale
// um B2.2 (nützlichste Wörter zuerst): B2.2, B2.3, B2.1, C1.1, B1.3, C1.2, … bis A1.1.
const REVIEW_ORDER=(()=>{const c=10;/*B2.2*/const o=[c];for(let d=1;d<SUBSTEPS.length;d++){if(c+d<SUBSTEPS.length)o.push(c+d);if(c-d>=0)o.push(c-d);}return o;})();
// Anzahl heute noch offener Wörter eines CEFR-Sublevels: neue (fam=-1) + fällige unbekannte
// (fam=0, letzte Übung >Frist). Heute schon geübte fam=0-Wörter zählen NICHT — sie können
// per Intervall-Guard heute ohnehin nicht auf fam≥1 steigen (sonst Endlosschleife).
function reviewCount(wd,s,now){now=now||Date.now();const sub=1+(s%3);return (VOCAB_POOL[stepToLevel(s)]||[]).filter(w=>{if(w.sub!==sub)return false;const d=wd[w.en];const f=d?d.familiarity:-1;if(f>=1)return false;if(f===-1)return true;const lt=d&&d.lasttrained?new Date(d.lasttrained).getTime():0;return now-lt>=DAY_EFF;}).length;}
// Nächste Review-Stufe: aktuelle Stufe zuerst zu Ende, dann nächste in der Nützlichkeits-
// Reihenfolge mit ungeübten Wörtern. cur=aktuelle Review-Stufe oder null (Ersteintritt).
function reviewNextStep(wd,cur){
  if(cur!=null){const c=reviewCount(wd,cur);if(c>0)return{step:cur,count:c};}
  const startIdx=cur==null?0:REVIEW_ORDER.indexOf(cur)+1;
  for(let i=startIdx;i<REVIEW_ORDER.length;i++){const s=REVIEW_ORDER[i];const c=reviewCount(wd,s);if(c>0)return{step:s,count:c};}
  return{step:-1,count:0};
}
// Gemeinsame Wortauswahl für Quiz- und Kontext-Modus (Slots A–E, projekt-training-konzept.md):
// A Wiederholungen (bis 4, Überfälligste zuerst, max. 1 fam=3-Stichprobe), B Unbekannte
// (bis 3, Vergessene zuerst), C 1 tieferes ungeübtes Wort, D 1 Wort aus Step+1, E neue
// Wörter des aktuellen Levels; Auffüllen bei Knappheit aus A, dann B, dann C/D.
// clozeOnly filtert auf Wörter mit Kontextübung (CLOZE_MAP); der Level-Aufstieg misst
// sich immer am vollen Pool. wd = Wortdaten, now = Zeitpunkt (virtuelle Uhr möglich).
// reviewMode: step ist ein CEFR-Sublevel (SUBSTEPS-Index), Wörter aus VOCAB_POOL nach sub.
function selectUnitPure(wd,step,focus,clozeOnly,allLevels,reviewMode,now){
  const {words:stepWords,allDe}=vocabForStep(step,focus);
  const fam=w=>{const d=wd[w.en];return d?d.familiarity:-1;};
  const lt=w=>{const d=wd[w.en];return d&&d.lasttrained?new Date(d.lasttrained).getTime():0;};
  const fgt=w=>{const d=wd[w.en];return d&&d.forgotten?d.forgotten:0;};
  const ok=w=>!clozeOnly||CLOZE_MAP.has(w.en);
  let unknown24h,lowerUnexercised,currentUnexercised,dueReviews=[],nextStepNew=[];
  let fullTrainable=0;
  // Slot A — fällige Wiederholungen (fam=1/2 nach Intervall, Überfälligste zuerst; +1 fam=3-Stichprobe)
  const computeDue=()=>{
    const due12=FREQ_POOL.filter(w=>{const d=wd[w.en];return ok(w)&&d&&d.familiarity>=1&&d.familiarity<=2&&reviewDue(d,now);})
      .sort((a,b)=>{const da=wd[a.en],db=wd[b.en];
        const dueA=(da.lasttrained?new Date(da.lasttrained).getTime():0)+REVIEW_WAIT_DAYS[da.familiarity]*DAY_EFF;
        const dueB=(db.lasttrained?new Date(db.lasttrained).getTime():0)+REVIEW_WAIT_DAYS[db.familiarity]*DAY_EFF;
        return dueA-dueB;});
    const due3=shuffleArr(FREQ_POOL.filter(w=>{const d=wd[w.en];return ok(w)&&d&&d.familiarity===3&&reviewDue(d,now);}));
    return [...due12,...due3.slice(0,1)];
  };
  if(reviewMode){
    // step = CEFR-Sublevel: heute offene Wörter dieses Sublevels (Nützlichkeits-Reihenfolge) —
    // neue (fam=-1) + fällige unbekannte (fam=0, letzte Übung >Frist). Heute schon geübte
    // fam=0-Wörter bleiben draußen (Intervall-Guard verhindert heute fam≥1 → sonst Endlosschleife);
    // fällige Wiederholungen laufen wie im normalen Training mit (kein Vergessen in der langen Review)
    const sub=1+(step%3);
    currentUnexercised=shuffleArr((VOCAB_POOL[stepToLevel(step)]||[]).filter(w=>{const f=fam(w);return w.sub===sub&&ok(w)&&(f===-1||(f===0&&now-lt(w)>=DAY_EFF));}));
    unknown24h=[];lowerUnexercised=[];dueReviews=computeDue();
  } else if(allLevels){
    currentUnexercised=shuffleArr(FREQ_POOL.filter(w=>fam(w)===-1&&ok(w)));
    unknown24h=shuffleArr(stepWords.filter(w=>fam(w)===0&&now-lt(w)>=DAY_EFF&&ok(w)));
    lowerUnexercised=[];
  } else {
    let curUnknown,curNew;
    if(focus==='freq'){
      curUnknown=stepWords.filter(w=>w.freqStep===step&&fam(w)===0&&now-lt(w)>=DAY_EFF);
      curNew=stepWords.filter(w=>w.freqStep===step&&fam(w)===-1);
      unknown24h=shuffleArr(stepWords.filter(w=>fam(w)===0&&now-lt(w)>=DAY_EFF&&ok(w)));
      lowerUnexercised=shuffleArr(FREQ_POOL.filter(w=>w.freqStep<step&&fam(w)===-1&&ok(w)));
      currentUnexercised=shuffleArr(curNew.filter(ok));
      if(step<SUBSTEPS.length-1)nextStepNew=shuffleArr(FREQ_POOL.filter(w=>w.freqStep===step+1&&fam(w)===-1&&ok(w)));
    } else {
      const lvl=stepToLevel(step);const li=LEVELS.indexOf(lvl);
      const lowerFam0=LEVELS.slice(0,li).flatMap(l=>(VOCAB_POOL[l]||[]).filter(w=>fam(w)===0&&now-lt(w)>=DAY_EFF&&ok(w)));
      curUnknown=stepWords.filter(w=>fam(w)===0&&now-lt(w)>=DAY_EFF);
      curNew=stepWords.filter(w=>fam(w)===-1);
      unknown24h=shuffleArr([...curUnknown.filter(ok),...lowerFam0]);
      lowerUnexercised=shuffleArr(LEVELS.slice(0,li).flatMap(l=>(VOCAB_POOL[l]||[]).filter(w=>fam(w)===-1&&ok(w))));
      currentUnexercised=shuffleArr(curNew.filter(ok));
      if(step<SUBSTEPS.length-1){const s1=step+1;const lvl1=stepToLevel(s1);const sub1=1+(s1%3);
        nextStepNew=shuffleArr((VOCAB_POOL[lvl1]||[]).filter(w=>w.sub===sub1&&fam(w)===-1&&ok(w)));}
    }
    // AP-T3: aktueller Step vollständig geübt → automatischer Aufstieg mit Gratulation.
    // Wiederholungen laufen level-unabhängig weiter; Step 17 → freqComplete-Flow.
    if(curUnknown.length===0&&curNew.length===0&&step<SUBSTEPS.length-1)return{status:'levelup'};
    fullTrainable=curUnknown.length+curNew.length;
    unknown24h.sort((a,b)=>(fgt(b)>0?1:0)-(fgt(a)>0?1:0));
    dueReviews=computeDue();
  }
  if(unknown24h.length===0&&currentUnexercised.length===0&&dueReviews.length===0){
    if(clozeOnly&&fullTrainable>0)return{status:'clozegap',missing:fullTrainable};
    if(focus==='freq'||reviewMode||step===SUBSTEPS.length-1){
      const allDone=FREQ_POOL.every(w=>{const d=wd[w.en];return d&&d.familiarity>=1;});
      return{status:allDone?'alldone':'complete'};
    }
    return{status:'nowords'};
  }
  const unit=[];let ai=0,bi=0,ci=0,di=0,ei=0;
  for(let i=0;i<4&&ai<dueReviews.length;i++)unit.push(dueReviews[ai++]);
  for(let i=0;i<3&&bi<unknown24h.length;i++)unit.push(unknown24h[bi++]);
  if(ci<lowerUnexercised.length)unit.push(lowerUnexercised[ci++]);
  if(di<nextStepNew.length)unit.push(nextStepNew[di++]);
  while(unit.length<15&&ei<currentUnexercised.length)unit.push(currentUnexercised[ei++]);
  while(unit.length<15&&ai<dueReviews.length)unit.push(dueReviews[ai++]);
  while(unit.length<15&&bi<unknown24h.length)unit.push(unknown24h[bi++]);
  while(unit.length<15&&ci<lowerUnexercised.length)unit.push(lowerUnexercised[ci++]);
  while(unit.length<15&&di<nextStepNew.length)unit.push(nextStepNew[di++]);
  if(unit.length===0)return{status:'nowords'};
  // Von der Levelanpassung ausgenommen: Wiederholungen (A), tiefere (C), Step+1 (D)
  const excludeKeys=new Set([...lowerUnexercised,...dueReviews,...nextStepNew].map(w=>w.en));
  const extraDe=[...lowerUnexercised,...dueReviews,...nextStepNew].map(w=>w.de);
  return{status:'ok',unit:shuffleArr(unit),excludeKeys,extraDe,allDe};
}

// ── Lerner-Simulation (Entwickler-Werkzeug) ──
// Spielt N Einheiten des allgemeinen Trainings gegen die ECHTEN Bausteine durch
// (selectUnitPure, applyTrainWord, levelDelta) — auf einer Kopie der Wortdaten mit
// virtueller Uhr. Der echte Lernstand bleibt unberührt. Der Retry-Durchgang ist
// zustandsneutral (richtig → keine Änderung, falsch → fam bleibt 0) und wird übersprungen.
// Antwortmodell p(richtig): Wiederholung fam=1 85% / fam≥2 90% · Schwachpunkt fam=0 65% ·
// neue Wörter nach Abstand zur wahren Stufe: ≤−3 97% · −2/−1 92% · 0 68% · +1 55% · +2 40% · ≥+3 25%
function simAnswerProb(w,d,trueStep){
  if(d&&d.familiarity>=1)return d.familiarity>=2?0.9:0.85;
  if(d&&d.familiarity===0)return 0.65;
  const ws=WORD_STEP.get(w.en);const diff=(ws!=null?ws:trueStep)-trueStep;
  return diff<=-3?0.97:diff<0?0.92:diff===0?0.68:diff===1?0.55:diff===2?0.4:0.25;
}
function runLearnerSim(cfg){
  let seed=(cfg.seed||42)%2147483647;if(seed<=0)seed+=2147483646;
  const rng=()=>{seed=Math.imul(48271,seed)%2147483647;return (seed&2147483647)/2147483648;};
  let wd={};let step=cfg.startStep;let now=Date.now();const start=now;
  const perDay=cfg.unitsPerDay||3;const gap=DAY_EFF/perDay;
  const lines=[];const events=[];
  let ups=0,downs=0,holds=0,exhaustUps=0,reviewsDone=0;
  for(let u=1;u<=cfg.units;u++){
    const day=((now-start)/DAY_EFF).toFixed(1);
    // Erschöpfungs-Aufstiege verbrauchen keine Einheit (der Nutzer startet sofort neu)
    let guard=0,res=selectUnitPure(wd,step,'level',false,false,false,now);
    while(res.status==='levelup'&&guard++<SUBSTEPS.length){
      exhaustUps++;events.push(`Tag ${day}: ${SUBSTEPS[step]} erschöpft → automatischer Aufstieg auf ${SUBSTEPS[step+1]}`);
      step++;res=selectUnitPure(wd,step,'level',false,false,false,now);
    }
    if(res.status!=='ok'){events.push(`Tag ${day}: Ende nach ${u-1} Einheiten (${res.status})`);break;}
    let cc=0,ct=0,rev=0;
    res.unit.forEach(w=>{
      const d=wd[w.en];
      if(d&&d.familiarity>=1)rev++;
      const okAns=rng()<simAnswerProb(w,d,cfg.trueStep);
      if(!res.excludeKeys.has(w.en)){ct++;if(okAns)cc++;}
      const cf=d?d.familiarity:-1;
      wd[w.en]=applyTrainWord(d,okAns?(cf>=1?Math.min(3,cf+1):1):0,now);
    });
    reviewsDone+=rev;
    if(ct>=MIN_LEVEL_ADJ_WORDS){
      const pct=cc/ct;
      const ns=Math.max(0,Math.min(SUBSTEPS.length-1,step+levelDelta(pct)));
      const mark=ns-step>1?'⇈':ns>step?'↑':step-ns>1?'⇊':ns<step?'↓':'=';
      if(ns>step)ups++;else if(ns<step)downs++;else holds++;
      lines.push(`#${String(u).padStart(3)} Tag ${String(day).padStart(5)}  ${SUBSTEPS[step].padEnd(5)} ${String(Math.round(100*pct)).padStart(3)}% ${mark}${rev?`  (${rev} Wdh.)`:''}`);
      step=ns;
    } else {
      lines.push(`#${String(u).padStart(3)} Tag ${String(day).padStart(5)}  ${SUBSTEPS[step].padEnd(5)} — keine Anpassung (${ct} gewertet, ${rev} Wdh.)`);
      holds++;
    }
    now+=gap;
  }
  const vals=Object.values(wd);
  const famC={};vals.forEach(v=>{famC[v.familiarity]=(famC[v.familiarity]||0)+1;});
  const summary=[
    `Lerner: wahres Niveau ${SUBSTEPS[cfg.trueStep]} · Start ${SUBSTEPS[cfg.startStep]} · ${cfg.units} Einheiten (${perDay}/Tag)`,
    `Endstufe: ${SUBSTEPS[step]}   ↑${ups} ↓${downs} =${holds}   Erschöpfungs-Aufstiege: ${exhaustUps}`,
    `Wiederholungen absolviert: ${reviewsDone} · Wörter berührt: ${vals.length}`,
    `fam am Ende — unbekannt ${famC[0]||0} · gelernt ${famC[1]||0} · gefestigt ${famC[2]||0} · sicher ${famC[3]||0}`,
    `aktiv gelernt (learned>0): ${vals.filter(v=>(v.learned||0)>0).length} · Vergessens-Ereignisse: ${vals.reduce((s,v)=>s+(v.forgotten||0),0)}`
  ];
  return [...summary,'',...events,'',...lines].join('\n');
}

function Training({userLevel,userStep,setUserStep,onBack,books,openChapter,wordData,trainWord,onShowProgress}){
  const [mode,setMode]=useState(null);
  const [exType,setExType]=useState(null);
  const [selectedLevel,setSelectedLevel]=useState(userLevel);
  const [trainFocus,setTrainFocus]=useState(()=>LS.get('bible-train-focus')||'level');
  const changeFocus=f=>{setTrainFocus(f);LS.set('bible-train-focus',f);};
  const [trainStep,setTrainStep]=useState(()=>{const s=LS.get('bible-train-step');return s!=null?s:levelToStep(userLevel)+2;});
  const saveStep=s=>{setTrainStep(s);LS.set('bible-train-step',s);};
  const [freqStep,setFreqStep]=useState(()=>{const s=LS.get('bible-freq-step');return s!=null?s:0;});
  const saveFreqStep=s=>{setFreqStep(s);LS.set('bible-freq-step',s);};
  const activeStep=trainFocus==='freq'?freqStep:trainStep;
  const [exercises,setExercises]=useState([]);
  const [current,setCurrent]=useState(0);
  const [selected,setSelected]=useState(null);
  const [score,setScore]=useState(0);
  const [done,setDone]=useState(false);
  const [shuffledOpts,setShuffledOpts]=useState([]);
  const [lastStart,setLastStart]=useState(null);
  const wrongRef=useRef([]);
  const totalRef=useRef(0);
  const retryRef=useRef(false);
  const lowerLevelCorrectRef=useRef(0);
  const lowerLevelFirstPassCorrectRef=useRef(null);
  const lowerLevelTotalRef=useRef(0);
  // Review-Phase persistent: aktuelles CEFR-Sublevel in localStorage, damit die Review
  // „Beenden"+Neustart und App-Neustart überlebt. null/entfernt = nicht in der Review.
  const freqReviewStepRef=useRef(LS.get('bible-review-step'));
  const setReviewStep=v=>{freqReviewStepRef.current=v;if(v==null)LS.remove('bible-review-step');else LS.set('bible-review-step',v);};
  const reviewModeRef=useRef(false);
  const [retryPending,setRetryPending]=useState(null);
  const [firstPassScore,setFirstPassScore]=useState(null);
  const clozeUnitsRef=useRef(null);
  const [clozeUnitDone,setClozeUnitDone]=useState(false);
  const vocabUnitsRef=useRef(null);
  const [vocabUnitDone,setVocabUnitDone]=useState(false);
  const [levelUpStep,setLevelUpStep]=useState(null);
  const [exMode,setExMode]=useState(()=>LS.get('bible-ex-mode')||'quiz');
  const changeExMode=m=>{setExMode(m);LS.set('bible-ex-mode',m);};
  const [clozeGapCount,setClozeGapCount]=useState(0);

  const shuffle=arr=>{const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

  const clozeForStep=useCallback((step,focus)=>{
    const allCloze=Object.values(CLOZE_EXERCISES).flat();
    if(focus==='freq'){
      const stepLemmas=new Set(FREQ_POOL.filter(w=>w.freqStep<=step).map(w=>w.en));
      const pool=allCloze.filter(e=>stepLemmas.has(e.lemma));
      const higherLemmas=new Set(FREQ_POOL.filter(w=>w.freqStep>step).map(w=>w.en));
      const higherPool=allCloze.filter(e=>higherLemmas.has(e.lemma));
      return {pool,higherPool};
    }
    const lvl=stepToLevel(step);const sub=1+(step%3);
    const stepWords=VOCAB_POOL[lvl]||[];
    const stepLemmas=new Set(stepWords.filter(w=>w.sub<=sub).map(w=>w.en));
    const pool=allCloze.filter(e=>stepLemmas.has(e.lemma));
    const higherLemmas=new Set(LEVELS.filter(l=>LEVELS.indexOf(l)>LEVELS.indexOf(lvl)).flatMap(l=>(VOCAB_POOL[l]||[])).map(w=>w.en));
    const higherPool=allCloze.filter(e=>higherLemmas.has(e.lemma));
    return {pool,higherPool};
  },[]);
  const DAY_MS=DAY_EFF;

  // „Noch zu üben"-Zähler für eine Stufe (identisch für Home-Screen UND Ergebnis-Screen):
  // fresh = neue (fam=-1) + fällige unbekannte (fam=0, >Frist) Wörter; due = fällige
  // Wiederholungen (Slot A, fam=1/2 + max. 1 fam=3-Stichprobe, level-unabhängig).
  const computeCounts=useCallback((step,focus)=>{
    const now=Date.now();const DMS=DAY_EFF;
    const countFresh=(words,keyFn)=>words.filter(w=>{const d=wordData[keyFn(w)];if(!d)return true;return d.familiarity<=0&&(d.familiarity===-1||now-new Date(d.lasttrained).getTime()>=DMS)}).length;
    const {words:stepWords}=vocabForStep(step,focus);
    const lowerFresh=focus==='freq'?0:(()=>{const lvl=stepToLevel(step);const li=LEVELS.indexOf(lvl);return LEVELS.slice(0,li).flatMap(l=>(VOCAB_POOL[l]||[])).filter(w=>{const d=wordData[w.en];return d&&d.familiarity===0&&d.lasttrained&&now-new Date(d.lasttrained).getTime()>=DMS;}).length;})();
    const fresh=focus==='freq'
      ?FREQ_POOL.filter(w=>{const d=wordData[w.en];const f=d?d.familiarity:-1;if(w.freqStep===step&&f===-1)return true;if(w.freqStep<=step&&f===0&&d?.lasttrained&&now-new Date(d.lasttrained).getTime()>=DMS)return true;return false;}).length
      :countFresh(stepWords,w=>w.en)+lowerFresh;
    const {pool:clozeStepPool}=clozeForStep(step,focus);
    const lowerClozeFresh=focus==='freq'?0:(()=>{const lvl=stepToLevel(step);const li=LEVELS.indexOf(lvl);return LEVELS.slice(0,li).flatMap(l=>(CLOZE_EXERCISES[l]||[])).filter(w=>{const d=wordData[w.lemma||w.answer];return d&&d.familiarity===0&&d.lasttrained&&now-new Date(d.lasttrained).getTime()>=DMS;}).length;})();
    const clozeFresh=focus==='freq'
      ?(()=>{const fsMap=new Map(FREQ_POOL.map(w=>[w.en,w.freqStep]));return Object.values(CLOZE_EXERCISES).flat().filter(e=>{const d=wordData[e.lemma];const f=d?d.familiarity:-1;const fs=fsMap.get(e.lemma);if(fs===undefined)return false;if(fs===step&&f===-1)return true;if(fs<=step&&f===0&&d?.lasttrained&&now-new Date(d.lasttrained).getTime()>=DMS)return true;return false;}).length})()
      :countFresh(clozeStepPool,w=>w.lemma||w.answer)+lowerClozeFresh;
    const countDue=(items,keyFn)=>{let d12=0,d3=false;items.forEach(it=>{const d=wordData[keyFn(it)];if(!d)return;if(d.familiarity>=1&&d.familiarity<=2&&reviewDue(d,now))d12++;else if(d.familiarity===3&&reviewDue(d,now))d3=true;});return d12+(d3?1:0);};
    const dueCount=countDue(FREQ_POOL,w=>w.en);
    const clozeDueCount=countDue(Object.values(CLOZE_EXERCISES).flat(),w=>w.lemma||w.answer);
    return {fresh,clozeFresh,dueCount,clozeDueCount};
  },[wordData,clozeForStep]);

  // Wortauswahl Slots A–E: dünner Wrapper um die reine Funktion selectUnitPure
  // (Modulebene, wird auch von der Lerner-Simulation genutzt)
  const selectUnit=useCallback((step,focus,clozeOnly,allLevels,reviewMode)=>
    selectUnitPure(wordData,step,focus,clozeOnly,allLevels,reviewMode,Date.now()),[wordData]);
  // Gemeinsame Behandlung der Auswahl-Ergebnisse ohne Einheit (Aufstieg/Abschluss/leer)
  const applySelectStatus=useCallback((res,step,focus)=>{
    if(res.status==='levelup'){
      const ns=step+1;
      (focus==='freq'?saveFreqStep:saveStep)(ns);
      setUserStep(ns);
      setLevelUpStep(ns);setMode('levelup');return true;
    }
    if(res.status==='complete'||res.status==='alldone'){setMode(res.status==='alldone'?'freqAllDone':'freqComplete');return true;}
    if(res.status==='clozegap'){setClozeGapCount(res.missing);setMode('clozegap');return true;}
    if(res.status!=='ok'){setMode('nowords');return true;}
    return false;
  },[]);

  const startVocab=useCallback((step,focus,allLevels,reviewMode)=>{
    reviewModeRef.current=!!reviewMode;
    const res=selectUnit(step,focus,false,allLevels,reviewMode);
    if(applySelectStatus(res,step,focus))return;
    const picked=res.unit;
    const allDePool=[...new Set([...res.allDe,...res.extraDe])];
    setExercises(picked);
    setShuffledOpts(picked.map(q=>{
      const wrong=posWrongDe(q,allDePool);
      return shuffle([q.de,...wrong]);
    }));
    setCurrent(0);setScore(0);setDone(false);setSelected(null);setExType('vocab');setMode('exercise');setRetryPending(null);setFirstPassScore(null);setVocabUnitDone(false);
    lowerLevelCorrectRef.current=0;lowerLevelFirstPassCorrectRef.current=null;
    lowerLevelTotalRef.current=picked.filter(w=>res.excludeKeys.has(w.en)).length;
    wrongRef.current=[];totalRef.current=picked.length;retryRef.current=false;
    const preFam={};picked.forEach(w=>{const d=wordData[w.en];preFam[w.en]=d?d.familiarity:-1;});
    vocabUnitsRef.current={units:[picked],unitIdx:0,allDePool,globalScore:0,globalTotal:picked.length,preFam,lowerKeys:res.excludeKeys};
    setSelectedLevel(stepToLevel(step));setLastStart('vocab');
  },[selectUnit,applySelectStatus,wordData]);

  // Kontext-Modus: gleiche Wortauswahl, Darstellung als Lückentext (Wort → CLOZE_MAP-Übung)
  const startCloze=useCallback((step,focus)=>{
    reviewModeRef.current=false;
    const res=selectUnit(step,focus,true,false,false);
    if(applySelectStatus(res,step,focus))return;
    const picked=res.unit.map(w=>CLOZE_MAP.get(w.en));
    const preFam={};res.unit.forEach(w=>{const d=wordData[w.en];preFam[w.en]=d?d.familiarity:-1;});
    const allDe=Object.values(CLOZE_EXERCISES).flat().map(e=>e.de);
    setCurrent(0);setScore(0);setDone(false);setSelected(null);setExType('cloze');setMode('exercise');setRetryPending(null);setFirstPassScore(null);
    wrongRef.current=[];totalRef.current=picked.length;retryRef.current=false;
    lowerLevelCorrectRef.current=0;lowerLevelFirstPassCorrectRef.current=null;
    lowerLevelTotalRef.current=picked.filter(e=>res.excludeKeys.has(e.lemma)).length;
    clozeUnitsRef.current={units:[picked],unitIdx:0,allDe,globalScore:0,globalTotal:picked.length,preFam,lowerKeys:res.excludeKeys};
    setExercises(picked);
    setShuffledOpts(picked.map(ex=>{
      const wrong=formWrong(ex);
      return shuffle([ex.de,...wrong]);
    }));
    setSelectedLevel(stepToLevel(step));setLastStart('cloze');
  },[selectUnit,applySelectStatus,wordData]);

  // Review-Einheit im aktuell gewählten Übungsmodus starten, damit die Übungsart über
  // Einheiten-Grenzen hinweg erhalten bleibt. Quiz: normale Vokabel-Einheit (startVocab).
  // Kontext: dieselbe Review-Wortauswahl (NICHT clozeOnly!), als Lückentext dargestellt wo
  // möglich, sonst als Quiz (gemischte Einheit wie im normalen Kontext-Training). Die Auswahl
  // bleibt identisch zur Quiz-Auswahl — sonst zählte reviewCount Wörter, die eine reine
  // Kontext-Einheit nie auswählt → Endlosschleife.
  const startReview=useCallback((step)=>{
    if(exMode!=='cloze'){startVocab(step,trainFocus,false,true);return;}
    reviewModeRef.current=true;
    const res=selectUnit(step,trainFocus,false,false,true);
    if(applySelectStatus(res,step,trainFocus))return;
    const picked=res.unit.map(w=>CLOZE_MAP.get(w.en)||w);
    const allDePool=[...new Set([...res.allDe,...res.extraDe])];
    const preFam={};res.unit.forEach(w=>{const d=wordData[w.en];preFam[w.en]=d?d.familiarity:-1;});
    setExercises(picked);
    setShuffledOpts(picked.map(q=>q.en?shuffle([q.de,...posWrongDe(q,allDePool)]):shuffle([q.de,...formWrong(q)])));
    setCurrent(0);setScore(0);setDone(false);setSelected(null);setExType('cloze');setMode('exercise');setRetryPending(null);setFirstPassScore(null);setClozeUnitDone(false);setVocabUnitDone(false);
    wrongRef.current=[];totalRef.current=picked.length;retryRef.current=false;
    lowerLevelCorrectRef.current=0;lowerLevelFirstPassCorrectRef.current=null;
    lowerLevelTotalRef.current=picked.filter(e=>res.excludeKeys.has(e.lemma||e.en)).length;
    clozeUnitsRef.current={units:[picked],unitIdx:0,allDe:Object.values(CLOZE_EXERCISES).flat().map(e=>e.de),allDePool,globalScore:0,globalTotal:picked.length,preFam,lowerKeys:res.excludeKeys};
    setSelectedLevel(stepToLevel(step));setLastStart('cloze');
  },[exMode,trainFocus,startVocab,selectUnit,applySelectStatus,wordData]);

  // Übungsart-Wechsel mitten in der Einheit (Quiz ↔ Im Kontext): alle Fragen der
  // laufenden Einheit werden in die andere Darstellungsform konvertiert; Wörter ohne
  // Kontextübung bleiben als Quiz-Frage stehen. Score, Fortschritt, Fehlerliste und
  // die Ausnahme-Mengen der Levelanpassung bleiben erhalten.
  const switchExercise=useCallback(target=>{
    if(selected!==null)return;
    const toCloze=target==='cloze';
    changeExMode(target);
    if((exType==='cloze')===toCloze)return;
    const conv=item=>{
      if(toCloze)return item.en?(CLOZE_MAP.get(item.en)||item):item;
      return item.en?item:(WORD_BY_EN.get(item.lemma)||item);
    };
    const newEx=exercises.map(conv);
    const allDePool=vocabUnitsRef.current?.allDePool||[...new Set(Object.values(VOCAB_POOL).flat().map(w=>w.de))];
    const newOpts=newEx.map(q=>q.en?shuffle([q.de,...posWrongDe(q,allDePool)]):shuffle([q.de,...formWrong(q)]));
    setExercises(newEx);setShuffledOpts(newOpts);
    wrongRef.current=wrongRef.current.map(w=>({...w,ex:conv(w.ex)}));
    const src=(exType==='cloze'?clozeUnitsRef:vocabUnitsRef).current||{};
    const preFam=src.preFam||{};
    const lowerKeys=src.lowerKeys||new Set();
    if(toCloze){
      clozeUnitsRef.current={units:[newEx],unitIdx:0,allDe:Object.values(CLOZE_EXERCISES).flat().map(e=>e.de),globalScore:0,globalTotal:newEx.length,preFam,lowerKeys};
      setExType('cloze');setLastStart('cloze');
    } else {
      vocabUnitsRef.current={units:[newEx],unitIdx:0,allDePool,globalScore:0,globalTotal:newEx.length,preFam,lowerKeys};
      setExType('vocab');setLastStart('vocab');
    }
  },[selected,exType,exercises]);

  const startBookCloze=useCallback(bi=>{
    const bookNr=books[bi].nr;
    const pool=Object.values(CLOZE_EXERCISES).flat().filter(e=>e.book===bookNr);
    if(pool.length===0){setMode('noexercises');return}
    const now=Date.now();
    const fam=w=>{const k=w.lemma||w.answer;const d=wordData[k];return d?d.familiarity:-1;};
    const lt=w=>{const k=w.lemma||w.answer;const d=wordData[k];return d&&d.lasttrained?new Date(d.lasttrained).getTime():0;};
    const prio1=pool.filter(w=>fam(w)===0&&now-lt(w)>=DAY_MS);
    const prio2=pool.filter(w=>fam(w)===-1);
    let allWords=[...shuffle(prio1),...shuffle(prio2)];
    if(allWords.length<15)allWords=[...allWords,...shuffle(pool.filter(w=>fam(w)<=0&&!allWords.includes(w)))];
    if(allWords.length===0){setMode('noexercises');return}
    const preFam={};allWords.forEach(w=>{const k=w.lemma||w.answer;preFam[k]=fam(w);});
    const allDe=Object.values(CLOZE_EXERCISES).flat().map(e=>e.de);
    const units=[];for(let i=0;i<allWords.length;i+=15)units.push(allWords.slice(i,i+15));
    const picked=units[0];
    setExercises(picked);
    setShuffledOpts(picked.map(ex=>{
      const wrong=formWrong(ex);
      return shuffle([ex.de,...wrong]);
    }));
    setCurrent(0);setScore(0);setDone(false);setSelected(null);setExType('cloze');setMode('exercise');setRetryPending(null);setFirstPassScore(null);
    wrongRef.current=[];totalRef.current=picked.length;retryRef.current=false;
    lowerLevelCorrectRef.current=0;lowerLevelFirstPassCorrectRef.current=null;lowerLevelTotalRef.current=0;
    clozeUnitsRef.current={units,unitIdx:0,allDe,globalScore:0,globalTotal:allWords.length,preFam};
    setLastStart({type:'book',bi});
  },[books,wordData]);

  const nextClozeUnit=useCallback(()=>{
    const u=clozeUnitsRef.current;if(!u)return;
    const unitScore=firstPassScore!=null?firstPassScore:score;
    const nextIdx=u.unitIdx+1;
    if(nextIdx>=u.units.length)return;
    const picked=u.units[nextIdx];
    clozeUnitsRef.current={...u,unitIdx:nextIdx,globalScore:u.globalScore+unitScore};
    setExercises(picked);
    setShuffledOpts(picked.map(ex=>{
      const wrong=formWrong(ex);
      return shuffle([ex.de,...wrong]);
    }));
    setCurrent(0);setScore(0);setSelected(null);setDone(false);setClozeUnitDone(false);setRetryPending(null);setFirstPassScore(null);
    wrongRef.current=[];totalRef.current=picked.length;retryRef.current=false;
  },[score,firstPassScore]);

  const repeatClozeUnit=useCallback(()=>{
    const u=clozeUnitsRef.current;if(!u)return;
    const picked=shuffle([...u.units[u.unitIdx]]);
    setExercises(picked);
    setShuffledOpts(picked.map(ex=>{
      const wrong=formWrong(ex);
      return shuffle([ex.de,...wrong]);
    }));
    setCurrent(0);setScore(0);setSelected(null);setDone(false);setClozeUnitDone(false);setRetryPending(null);setFirstPassScore(null);
    wrongRef.current=[];totalRef.current=picked.length;retryRef.current=false;
  },[]);

  const nextVocabUnit=useCallback(()=>{
    const u=vocabUnitsRef.current;if(!u)return;
    const unitScore=firstPassScore!=null?firstPassScore:score;
    const nextIdx=u.unitIdx+1;
    if(nextIdx>=u.units.length)return;
    const picked=u.units[nextIdx];
    vocabUnitsRef.current={...u,unitIdx:nextIdx,globalScore:u.globalScore+unitScore};
    setExercises(picked);
    setShuffledOpts(picked.map(q=>{
      const wrong=posWrongDe(q,u.allDePool);
      return shuffle([q.de,...wrong]);
    }));
    const lk=u.lowerKeys||new Set();
    lowerLevelCorrectRef.current=0;lowerLevelFirstPassCorrectRef.current=null;
    lowerLevelTotalRef.current=picked.filter(w=>lk.has(w.en)).length;
    setCurrent(0);setScore(0);setSelected(null);setDone(false);setVocabUnitDone(false);setRetryPending(null);setFirstPassScore(null);
    wrongRef.current=[];totalRef.current=picked.length;retryRef.current=false;
  },[score,firstPassScore]);

  const repeatVocabUnit=useCallback(()=>{
    const u=vocabUnitsRef.current;if(!u)return;
    const picked=shuffle([...u.units[u.unitIdx]]);
    setExercises(picked);
    setShuffledOpts(picked.map(q=>{
      const wrong=posWrongDe(q,u.allDePool);
      return shuffle([q.de,...wrong]);
    }));
    setCurrent(0);setScore(0);setSelected(null);setDone(false);setVocabUnitDone(false);setRetryPending(null);setFirstPassScore(null);
    wrongRef.current=[];totalRef.current=picked.length;retryRef.current=false;
  },[]);

  const guessRef=useRef(false);

  const pick=useCallback((ans,mode)=>{
    if(selected!==null)return;
    const ex=exercises[current];
    const correct=ans===ex.de;
    setSelected(ans);
    if(mode==='guess') guessRef.current=true;
    const wordKey=ex.en||ex.lemma||ex.answer;
    if(correct){
      if(!retryRef.current)setScore(s=>s+1);
      if(!retryRef.current){const uref=exType==='vocab'?vocabUnitsRef:clozeUnitsRef;if(uref.current?.lowerKeys?.has(wordKey))lowerLevelCorrectRef.current++;}
      if(mode==='guess'){
        wrongRef.current=[...wrongRef.current,{ex,optsIdx:current}];
      } else if(mode==='easy'){
        trainWord(wordKey,3);
      } else if(!retryRef.current){
        // Familiarity-Treppe: fällige Wiederholungen steigen eine Stufe (1→2→3),
        // neue/unbekannte Wörter → 1. Die Intervall-Prüfung sitzt zentral in trainWord.
        const d=wordData[wordKey];const cf=d?d.familiarity:-1;
        trainWord(wordKey,cf>=1?Math.min(3,cf+1):1);
      }
      setTimeout(()=>{
        guessRef.current=false;
        if(current<exercises.length-1){setCurrent(c=>c+1);setSelected(null)}
        else if(wrongRef.current.length>0&&!retryRef.current){lowerLevelFirstPassCorrectRef.current=lowerLevelCorrectRef.current;setFirstPassScore(score+1);setRetryPending(wrongRef.current)}
        else if(wrongRef.current.length>0) startRetry();
        else if(exType==='cloze'&&clozeUnitsRef.current&&clozeUnitsRef.current.units.length>1&&clozeUnitsRef.current.unitIdx<clozeUnitsRef.current.units.length-1){setClozeUnitDone(true)}
        else if(exType==='vocab'&&vocabUnitsRef.current&&vocabUnitsRef.current.units.length>1&&vocabUnitsRef.current.unitIdx<vocabUnitsRef.current.units.length-1){setVocabUnitDone(true)}
        else setDone(true);
      },900);
    } else {
      wrongRef.current=[...wrongRef.current,{ex,optsIdx:current}];
      trainWord(wordKey,0);
    }
  },[current,exercises,selected,exType,startRetry,trainWord,wordData]);

  const startRetry=useCallback(()=>{
    const wrong=retryPending||wrongRef.current;
    wrongRef.current=[];
    const retryEx=wrong.map(w=>w.ex);
    setExercises(retryEx);
    // Optionen je nach Item-Form (Quiz-Wort vs. Cloze-Übung) — Einheiten können nach
    // einem Übungsart-Wechsel gemischt sein (Wörter ohne Kontextübung bleiben Quiz)
    const allDeV=Object.values(VOCAB_POOL).flat().map(w=>w.de);
    setShuffledOpts(retryEx.map(q=>q.en
      ?shuffle([q.de,...posWrongDe(q,allDeV)])
      :shuffle([q.de,...formWrong(q)])));
    setCurrent(0);setSelected(null);retryRef.current=true;setRetryPending(null);
  },[exType,selectedLevel,retryPending]);

  const advance=useCallback(()=>{
    if(current<exercises.length-1){setCurrent(c=>c+1);setSelected(null)}
    else if(wrongRef.current.length>0&&!retryRef.current){setFirstPassScore(score);setRetryPending(wrongRef.current)}
    else if(wrongRef.current.length>0) startRetry();
    else if(exType==='cloze'&&clozeUnitsRef.current&&clozeUnitsRef.current.units.length>1&&clozeUnitsRef.current.unitIdx<clozeUnitsRef.current.units.length-1){setClozeUnitDone(true)}
    else if(exType==='vocab'&&vocabUnitsRef.current&&vocabUnitsRef.current.units.length>1&&vocabUnitsRef.current.unitIdx<vocabUnitsRef.current.units.length-1){setVocabUnitDone(true)}
    else setDone(true);
  },[current,exercises,startRetry,score,exType]);

  const stepChangeRef=useRef(null);
  const [reviewPending,setReviewPending]=useState(false);

  // useLayoutEffect: Levelanpassung + reviewPending synchron vor dem Paint setzen,
  // damit der Ergebnis-Screen sofort korrekt rendert (kein Flackern der Level-/Review-Zeile)
  useLayoutEffect(()=>{
    if(!done)return;
    const realScore=firstPassScore!=null?firstPassScore:score;
    const lowerCorrect=lowerLevelFirstPassCorrectRef.current!=null?lowerLevelFirstPassCorrectRef.current:lowerLevelCorrectRef.current;
    const adjTotal=totalRef.current-lowerLevelTotalRef.current;
    const pct=adjTotal>0?(realScore-lowerCorrect)/adjTotal:realScore/totalRef.current;
    const hist=LS.get('bible-training-history')||[];
    hist.push({date:Date.now(),type:exType,level:selectedLevel,step:trainStep,score:realScore,total:totalRef.current,pct:Math.round(pct*100)});
    if(hist.length>200) hist.splice(0,hist.length-200);
    LS.set('bible-training-history',hist);
    if(reviewModeRef.current){
      const allDone=FREQ_POOL.every(w=>{const d=wordData[w.en];return d&&d.familiarity>=1;});
      if(allDone)setReviewStep(null);
      setDone(false);setMode(allDone?'freqAllDone':'freqComplete');return;
    }
    // adjTotal===0: Einheit bestand nur aus Wiederholungen/Beimischungen → keine Levelanpassung
    let reviewPend=false;
    if((exType==='vocab'||exType==='cloze')&&!reviewModeRef.current&&adjTotal>=MIN_LEVEL_ADJ_WORDS){
      const curStep=activeStep;
      const mx=SUBSTEPS.length-1;
      const saveFn=trainFocus==='freq'?saveFreqStep:saveStep;
      const delta=levelDelta(pct);
      const ns=Math.max(0,Math.min(mx,curStep+delta));
      if(curStep===mx&&delta>0){
        // Oberste Stufe (C2.3) + aufstiegswürdige Leistung → Übergang in die Review ("Level 18"):
        // man muss nicht erst ganz C2.3 durchüben. Weiter-Button startet die erste Review-Einheit.
        reviewPend=true;stepChangeRef.current=null;
      } else if(ns!==curStep){
        saveFn(ns);setUserStep(ns);
        stepChangeRef.current=trainFocus==='freq'?(ns+1)+'/'+SUBSTEPS.length:stepLabel(ns);
      } else {
        stepChangeRef.current=null;
      }
    } else {
      stepChangeRef.current=null;
    }
    setReviewPending(reviewPend);
  },[done]);

  if(done){
    const displayScore=firstPassScore!=null?firstPassScore:score;
    const hadRetry=firstPassScore!=null;
    const u=clozeUnitsRef.current;
    const vu=vocabUnitsRef.current;
    const showGlobal=(exType==='cloze'&&u&&u.units.length>1)||(exType==='vocab'&&vu&&vu.units.length>1);
    const globalScore=showGlobal?(exType==='cloze'?u.globalScore:vu.globalScore)+displayScore:null;
    const globalTotal=showGlobal?(exType==='cloze'?u.globalTotal:vu.globalTotal):null;
    const globalUnitIdx=showGlobal?(exType==='cloze'?u.unitIdx:vu.unitIdx):null;
    const globalUnitsLen=showGlobal?(exType==='cloze'?u.units.length:vu.units.length):null;
    // A: gelernt (preFam=0→fam>0) vs. geübt (preFam=-1→fam>0)
    const preFam=u?.preFam||{};
    const learnedCount=Object.entries(preFam).filter(([k,pf])=>pf===0&&(wordData[k]?.familiarity||0)>0).length;
    const practicedCount=Object.entries(preFam).filter(([k,pf])=>pf===-1&&(wordData[k]?.familiarity||0)>0).length;
    const showLP=exType==='cloze'&&(learnedCount>0||practicedCount>0);
    // Noch zu üben auf der (nach evtl. Anpassung) aktuellen Stufe — dieselbe Zählung wie Home-Screen
    const cnt=computeCounts(activeStep,trainFocus);
    const remFresh=exType==='cloze'?cnt.clozeFresh:cnt.fresh;
    const remDue=exType==='cloze'?cnt.clozeDueCount:cnt.dueCount;
    return(<div>
      <header style={S.header}><h1 style={S.title}>{t('result')}</h1></header>
      <div style={{textAlign:'center',padding:'20px 0'}}>
        {showGlobal
          ?<div style={{fontSize:48,fontWeight:700,color:globalScore>=globalTotal*0.85?'var(--t-green)':'var(--t-accent)',fontFamily:sans}}>{globalScore}/{globalTotal}</div>
          :<div style={{fontSize:48,fontWeight:700,color:displayScore>=totalRef.current*0.85?'var(--t-green)':'var(--t-accent)',fontFamily:sans}}>{displayScore}/{totalRef.current}</div>}
        {showGlobal&&<p style={{fontSize:13,color:'var(--t-muted)',fontFamily:sans,margin:'4px 0 0'}}>{t('unitProgress').replace('{c}',globalUnitIdx+1).replace('{t}',globalUnitsLen)}: {displayScore}/{totalRef.current}</p>}
        {hadRetry
          ?<p style={{fontSize:16,color:'var(--t-green)',fontFamily:sans,margin:'12px 0 24px'}}>{t('allErrorsCorrected')}</p>
          :<p style={{fontSize:16,color:'var(--t-text2)',fontFamily:sans,margin:'12px 0 24px'}}>{(showGlobal?globalScore>=globalTotal*0.85:displayScore>=totalRef.current*0.85)?t('wellDone'):t('keepPracticing')}</p>}
        {showLP&&<p style={{fontSize:14,color:'var(--t-muted)',fontFamily:sans,margin:'-12px 0 16px'}}>
          {learnedCount>0&&<span style={{color:'var(--t-green)',marginRight:12}}>✓ {t('learnedN').replace('{n}',learnedCount)}</span>}
          {practicedCount>0&&<span>{t('practicedN').replace('{n}',practicedCount)}</span>}
        </p>}
        {reviewPending
          ?<p style={{fontSize:15,color:'var(--t-green)',fontWeight:600,fontFamily:sans,margin:'0 0 16px',padding:'0 12px'}}>{t('topLevelToReview')}</p>
          :<>
            <p style={{fontSize:14,color:stepChangeRef.current?(displayScore>=totalRef.current*0.85?'var(--t-green)':'var(--t-accent)'):'var(--t-muted)',fontFamily:sans,margin:'0 0 8px'}}>{stepChangeRef.current?t('levelNow').replace('{l}',stepChangeRef.current):t('levelStay').replace('{l}',trainFocus==='freq'?(activeStep+1)+'/'+SUBSTEPS.length:stepLabel(activeStep))}</p>
            <p style={{fontSize:13,color:'var(--t-muted)',fontFamily:sans,margin:'0 0 4px'}}>{remFresh===0?t('stepAllPracticed'):remFresh===1?t('stillToPractice1'):t('stillToPractice').replace('{n}',remFresh)}</p>
            {remDue>0&&<p style={{fontSize:13,color:'var(--t-accent)',fontFamily:sans,margin:'0 0 16px'}}>{remDue===1?t('reviewsDue1'):t('reviewsDue').replace('{n}',remDue)}</p>}
          </>}
        <div style={{marginTop:remDue>0?0:12,display:'flex',gap:12,justifyContent:'center'}}>
          <button onClick={()=>{setMode(null);setDone(false);setReviewPending(false);clozeUnitsRef.current=null;vocabUnitsRef.current=null}} style={S.navBtn}>{t('finish')}</button>
          {lastStart&&<button onClick={()=>{
            setDone(false);stepChangeRef.current=null;clozeUnitsRef.current=null;vocabUnitsRef.current=null;
            if(reviewPending){
              setReviewPending(false);
              const {step}=reviewNextStep(wordData,null);
              if(step>=0){setReviewStep(step);startReview(step);}
              else{const allDone=FREQ_POOL.every(w=>{const d=wordData[w.en];return d&&d.familiarity>=1;});if(allDone)setReviewStep(null);setMode(allDone?'freqAllDone':'freqComplete');}
            }else if(lastStart==='vocab')startVocab(activeStep,trainFocus);else if(lastStart==='cloze')startCloze(activeStep,trainFocus);else if(lastStart.type==='book')startBookCloze(lastStart.bi);
          }} style={S.startBtn}>{t('next')}</button>}
        </div>
      </div>
    </div>);
  }

  if(mode==='exercise'&&exType==='cloze'&&clozeUnitDone){
    const displayScore=firstPassScore!=null?firstPassScore:score;
    const hadRetry=firstPassScore!=null;
    const u=clozeUnitsRef.current;
    return(<div>
      <header style={S.header}><h1 style={S.title}>{t('result')}</h1></header>
      <div style={{textAlign:'center',padding:'20px 0'}}>
        <div style={{fontSize:48,fontWeight:700,color:displayScore>=totalRef.current*0.85?'var(--t-green)':'var(--t-accent)',fontFamily:sans}}>{displayScore}/{totalRef.current}</div>
        {hadRetry
          ?<p style={{fontSize:16,color:'var(--t-green)',fontFamily:sans,margin:'12px 0 24px'}}>{t('allErrorsCorrected')}</p>
          :<p style={{fontSize:16,color:'var(--t-text2)',fontFamily:sans,margin:'12px 0 24px'}}>{displayScore>=totalRef.current*0.85?t('wellDone'):t('keepPracticing')}</p>}
        {u&&<p style={{fontSize:13,color:'var(--t-muted)',fontFamily:sans,margin:'0 0 8px'}}>{t('unitProgress').replace('{c}',u.unitIdx+1).replace('{t}',u.units.length)}</p>}
        {u&&<p style={{fontSize:13,color:'var(--t-muted)',fontFamily:sans,margin:'0 0 16px'}}>{t('totalScore')}: {u.globalScore+displayScore}/{u.units.slice(0,u.unitIdx+1).reduce((s,unit)=>s+unit.length,0)}</p>}
        <div style={{display:'flex',gap:12,justifyContent:'center'}}>
          <button onClick={repeatClozeUnit} style={S.navBtn}>{t('repeat')}</button>
          <button onClick={nextClozeUnit} style={S.startBtn}>{t('next')}</button>
        </div>
        <div style={{marginTop:16}}><button onClick={()=>{setMode(null);setClozeUnitDone(false);clozeUnitsRef.current=null}} style={S.navBtn}>{t('cancel')}</button></div>
      </div>
    </div>);
  }

  if(mode==='exercise'&&exType==='vocab'&&vocabUnitDone){
    const displayScore=firstPassScore!=null?firstPassScore:score;
    const hadRetry=firstPassScore!=null;
    const vu=vocabUnitsRef.current;
    return(<div>
      <header style={S.header}><h1 style={S.title}>{t('result')}</h1></header>
      <div style={{textAlign:'center',padding:'20px 0'}}>
        <div style={{fontSize:48,fontWeight:700,color:displayScore>=totalRef.current*0.85?'var(--t-green)':'var(--t-accent)',fontFamily:sans}}>{displayScore}/{totalRef.current}</div>
        {hadRetry
          ?<p style={{fontSize:16,color:'var(--t-green)',fontFamily:sans,margin:'12px 0 8px'}}>{t('allErrorsCorrected')}</p>
          :<p style={{fontSize:16,color:'var(--t-text2)',fontFamily:sans,margin:'12px 0 8px'}}>{displayScore>=totalRef.current*0.85?t('wellDone'):t('keepPracticing')}</p>}
        {vu&&<p style={{fontSize:13,color:'var(--t-muted)',fontFamily:sans,margin:'0 0 4px'}}>{t('unitProgress').replace('{c}',vu.unitIdx+1).replace('{t}',vu.units.length)}</p>}
        {vu&&<p style={{fontSize:13,color:'var(--t-muted)',fontFamily:sans,margin:'0 0 16px'}}>{t('totalScore')}: {vu.globalScore+displayScore}/{vu.units.slice(0,vu.unitIdx+1).reduce((s,unit)=>s+unit.length,0)}</p>}
        <div style={{display:'flex',gap:12,justifyContent:'center'}}>
          <button onClick={repeatVocabUnit} style={S.navBtn}>{t('repeat')}</button>
          <button onClick={nextVocabUnit} style={S.startBtn}>{t('next')}</button>
        </div>
        <div style={{marginTop:16}}><button onClick={()=>{setMode(null);setVocabUnitDone(false);vocabUnitsRef.current=null}} style={S.navBtn}>{t('cancel')}</button></div>
      </div>
    </div>);
  }

  if(mode==='exercise'&&!retryPending&&exercises[current]&&!exercises[current].en){
    const ex=exercises[current];const opts=shuffledOpts[current];const parts=ex.text.split('___');
    const cu=clozeUnitsRef.current;
    return(<div>
      <header style={S.header}>
        <h1 style={S.title}>{t('cloze')}</h1>
        <p style={{fontSize:14,color:'var(--t-muted)',fontFamily:sans}}>{current+1} / {exercises.length}{cu&&cu.units.length>1?' — '+t('unitProgress').replace('{c}',cu.unitIdx+1).replace('{t}',cu.units.length):''}</p>
        {(lastStart==='vocab'||lastStart==='cloze')&&<div style={{...S.levelBtns,justifyContent:'center',marginTop:6}}>
          <button onClick={()=>switchExercise('quiz')} style={{...S.lvlBtn,...(exType==='vocab'?S.lvlActive:{})}}>{t('exModeQuiz')}</button>
          <button onClick={()=>switchExercise('cloze')} style={{...S.lvlBtn,...(exType==='cloze'?S.lvlActive:{})}}>{t('exModeContext')}</button>
        </div>}
      </header>
      <div style={{background:'var(--t-border)',borderRadius:4,height:6,margin:'0 0 20px',overflow:'hidden'}}>
        <div style={{height:'100%',background:'var(--t-primary)',borderRadius:4,transition:'width 0.3s',width:`${(current/exercises.length)*100}%`}}/>
      </div>
      <div style={{fontFamily:'var(--t-serif)',fontSize:exFontSize(),lineHeight:2,color:'var(--t-title)',textAlign:'center',margin:'16px 0 8px'}}>
        {parts[0]}<span style={{display:'inline-block',padding:'0 4px',background:'var(--t-accent-bg)',borderRadius:4,fontWeight:700,color:'var(--t-accent)'}}>{ex.answer}</span>{parts[1]}
      </div>
      <p style={{fontSize:12,color:'var(--t-muted)',fontFamily:sans,textAlign:'center',margin:'0 0 6px'}}>{ex.ref}</p>
      <div style={{textAlign:'center',margin:'0 0 20px'}}><ExLevelTag en={ex.lemma}/></div>
      <div style={{display:'flex',flexDirection:'column',gap:10,maxWidth:300,margin:'0 auto'}}>
        {opts.map((opt,i)=>{
          let bg='var(--t-card-solid)',border='1.5px solid var(--t-border)',color='var(--t-text)';
          if(selected!==null){
            if(opt===ex.de){bg='var(--t-green-bg)';border='1.5px solid var(--t-green)';color='var(--t-green)'}

// ─── Load all data ──────────────────────────────────────
const isPWA=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone;
const CB=isPWA?'':'?v='+Date.now(); // cache-buster (disabled in PWA for offline support)
// Zusätzliche Beispielverse pro Lemma — lazy geladen (nur bei "Weitere Beispiele")
let EXAMPLES=null;
async function loadExamples(){
  if(EXAMPLES)return EXAMPLES;
  try{if(INSTANCE.examplesPath){const r=await fetch(INSTANCE.examplesPath+CB);if(r.ok)EXAMPLES=await r.json();}}catch(e){}
  if(!EXAMPLES)EXAMPLES={};
  return EXAMPLES;
}

const _bookCache={};
const _annoCache={};

// Einheitliches Quell-dict-Format ({chapters:{"1":{"1":"text"}}}) → internes
// array-Format ({chapters:[{number,verses:[{n,text}]}]}), das der Reader-Render
// erwartet. Alle Editionen liegen als dict vor; dies ist der einzige Adapter.
function normalizeDictBook(d,nr){
  const chapters=Object.keys(d.chapters).sort((a,b)=>(+a)-(+b)).map(cNum=>({
    number:+cNum,
    verses:Object.keys(d.chapters[cNum]).sort((a,b)=>(+a)-(+b)).map(vNum=>({n:+vNum,text:d.chapters[cNum][vNum]}))
  }));
  return {nr,name:d.name,chapters};
}
async function fetchBook(nr){
  if(_bookCache[nr])return _bookCache[nr];
  const r=await fetch(INSTANCE.bibleDir+nr+INSTANCE.bibleSuffix+CB);
  if(!r.ok)throw new Error('book not found');
  const d=await r.json();
  const book=normalizeDictBook(d,nr);
  _bookCache[nr]=book;
  return book;
}

// Annotationen werden ROH gecacht (native Gloss-Felder erhalten). Die
// anzeigbare Gloss wird erst in deriveAnnoChapters nach der Hilfsbibel-Sprache
// abgeleitet — so schaltet ein Hilfsbibel-Wechsel die Glossen korrekt um.
async function fetchAnno(nr){
  if(!INSTANCE.annoDir)return null;
  if(_annoCache[nr])return _annoCache[nr];
  try{
    const r=await fetch(INSTANCE.annoDir+nr+INSTANCE.annoSuffix+CB);
    if(r.ok){const d=await r.json();_annoCache[nr]=d;return d;}
  }catch(e){}
  return null;
}
// Rohe Annotations-Kapitel → Anzeige-Glossen: pro Wort wird das Feld
// [glossField] (= langCode der Hilfsbibel) als interne `.de`-Rolle übernommen.
// Wörter ohne Gloss in dieser Sprache entfallen (→ unannotiert, reines Lesen).
function deriveAnnoChapters(chapters, glossField){
  const out={};
  for(const ch in chapters){
    const vo={};
    for(const v in chapters[ch]){
      const arr=[];
      for(const w of chapters[ch][v]){
        const g=w[glossField];
        if(g==null)continue;
        const nw={...w,de:g}; // alle Felder erhalten, nur Gloss-Rolle (.de) setzen
        const gf=w[glossField+'Form']; if(gf!=null)nw.deForm=gf;
        arr.push(nw);
      }
      if(arr.length)vo[v]=arr;
    }
    if(Object.keys(vo).length)out[ch]=vo;
  }
  return out;
}

// Hilfsbibel (parallele Verstexte). hilfsId ist eine BIBLES-Registry-ID; das
// Ergebnis ist einheitlich {name, chapters:{ch:{v:text}}}.
const _deCache={};
async function fetchDe(nr,hilfsId){
  const b=BIBLES[hilfsId];
  if(!b)return null;
  const key=nr+'_'+hilfsId;
  if(_deCache[key])return _deCache[key];
  try{
    const r=await fetch(b.bibleDir+nr+b.bibleSuffix+CB);
    if(r.ok){
      const d=await r.json();
      const result={name:d.name,chapters:d.chapters};
      _deCache[key]=result;
      return result;
    }
  }catch(e){}
  return null;
}

async function loadData(){
  const en={};
  try{
    const r=await fetch('bibles/index.json'+CB);
    if(!r.ok)throw new Error('not found');
    const idx=await r.json();
    const otBooks=idx.books.filter(b=>b.testament==='ot');
    const ntBooks=idx.books.filter(b=>b.testament==='nt');
    const books=[...otBooks,...ntBooks];
    // Buchnamen der aktiven Hauptbibel (null = englische Namen aus index.json).
    if(INSTANCE.names)books.forEach((b,i)=>{if(INSTANCE.names[i])b.name=INSTANCE.names[i]});
    en.bible={books};
    en.ntStartIndex=otBooks.length;
    en.stats=idx.stats;
    en.vocab={};
    en.annotations={};
    en.available=true;
  }catch(e){en.available=false;}
  try{
    // Single Source of Truth: words.json (1 Eintrag/Wort) → Vokabel-Pool + Lückentext-Views ableiten.
    // Nur Hauptbibeln mit Wortpool (hasTraining); words.json ist EN-nativ (Felder en/de/deForm).
    try{if(INSTANCE.keepNamesPath){const kr=await fetch(INSTANCE.keepNamesPath+CB);if(kr.ok)KEEP_NAMES=new Set(await kr.json());}}catch(e){}
    const wr=INSTANCE.wordsPath?await fetch(INSTANCE.wordsPath+CB):null;
    if(wr&&wr.ok){
      const words=await wr.json();
      if(TEST_ACCEL){
        // Beschleunigter Test: ¼ bzw. ⅛ des Pools, pro Level+Sublevel jedes n-te Wort —
        // die Level-Verhältnisse bleiben dadurch exakt erhalten
        for(const lvl in words){
          const bySub={};
          words[lvl].forEach(w=>{(bySub[w.sub]||(bySub[w.sub]=[])).push(w);});
          words[lvl]=Object.keys(bySub).sort().flatMap(s=>bySub[s].filter((_,i)=>i%TEST_POOL_DIV===0));
        }
      }
      VOCAB_POOL=words;buildFreqPool();
      CLOZE_EXERCISES={};CLOZE_BY_PF={};
      for(const lvl in words)CLOZE_EXERCISES[lvl]=words[lvl].filter(w=>w.text).map(w=>{
        const deForm=w.deForm||w.de;const form=w.form||'base';
        const key=(w.pos||'')+'|'+form;(CLOZE_BY_PF[key]||(CLOZE_BY_PF[key]=[])).push(deForm);
        // Lückentext zeigt/prüft die flektierte Form (deForm)
        return {text:w.text,answer:w.answer,de:deForm,pos:w.pos,form,ref:w.ref,book:w.book,sub:w.sub,level:lvl,lemma:w.en};
      });
      for(const k in CLOZE_BY_PF)CLOZE_BY_PF[k]=[...new Set(CLOZE_BY_PF[k])];
      // Lemma → Cloze-Übung (für den Kontext-Modus des einheitlichen Trainings)
      CLOZE_MAP=new Map(Object.values(CLOZE_EXERCISES).flat().map(e=>[e.lemma,e]));
      WORD_BY_EN=new Map(Object.values(words).flat().map(w=>[w.en,w]));
      WORD_STEP=new Map();
      for(const lvl in words){const base=LEVELS.indexOf(lvl)*3;words[lvl].forEach(w=>WORD_STEP.set(w.en,base+(w.sub-1)));}
    }
  }catch(e){}
  return{en};
}

// Split trailing punctuation from a word token: "diffamer," → ["diffamer", ","]
function splitPunct(token){
  const m=token.match(/^(.+?)([,;:.!?…»"'\-)]+)$/);
  return m?[m[1],m[2]]:[token,''];
}

function normalize(w){
  return w.toLowerCase().replace(/^[''"\-(]/,'').replace(/[''"\-),;:.!?…]$/,'');
}

// Get annotation for a specific word position in a verse
// Returns {anno, role} where role is 'single', 'start', 'middle', or 'end'
function getAnnotation(annotations, bookName, chapNum, verseNum, wordPos) {
  const book = annotations[bookName];
  if (!book) return null;
  const chap = book[String(chapNum)];
  if (!chap) return null;
  const verse = chap[String(verseNum)];
  if (!verse) return null;
  const exact = verse.find(a => a.pos === wordPos && !a.pos_end);
  const multi = verse.find(a => a.pos_end != null && wordPos >= a.pos && wordPos <= a.pos_end);
  if (multi) {
    const role = wordPos === multi.pos ? 'start' : wordPos === multi.pos_end ? 'end' : 'middle';
    return {anno: multi, single: exact || null, role};
  }
  if (exact) return {anno: exact, single: null, role: 'single'};
  return null;
}

// Get all annotations for a chapter, filtered by level (+ tapped words)
// Sublevel-Stufe (0–17) eines annotierten Wortes: exaktes Sublevel aus dem Pool
// (words.json level+sub), sonst Fallback auf das obere Ende des groben CEFR-Bands,
// damit Wörter ohne Sublevel-Info nicht vorzeitig aus den „schwierigen Wörtern"
// verschwinden. „Schwierig" = annoStep > userStep (feineres 18-Stufen-Raster).
function annoStep(level,lemma){
  const s=WORD_STEP.get(lemma);
  if(s!=null)return s;
  const li=LEVELS.indexOf(level);
  return li<0?0:li*3+2;
}
// Eigennamen-Erkennung: großgeschriebenes Lemma (Grundformen gewöhnlicher Wörter
// sind kleingeschrieben; Eigennamen wie „David", „Jerusalén" beginnen groß).
function isProperNounLemma(lemma){
  const c = lemma && lemma[0];
  return !!c && c === c.toUpperCase() && c !== c.toLowerCase();
}
function getChapterAnnotations(annotations, bookName, chapNum, userStep, tappedWords) {
  const book = annotations[bookName];
  if (!book) return [];
  const chap = book[String(chapNum)];
  if (!chap) return [];

  const seen = new Set();
  const result = [];
  Object.values(chap).forEach(verseAnns => {
    (verseAnns||[]).forEach(a => {
      const isPhrase = a.pos_end != null;
      // Eigennamen (großgeschriebenes Lemma) aus den Übungen nehmen, außer sie
      // stehen in KEEP_NAMES (wichtige Personen/Orte). KEEP_NAMES leer → kein Filter.
      if (KEEP_NAMES.size && isProperNounLemma(a.lemma) && !KEEP_NAMES.has(a.lemma)) return;
      if ((annoStep(a.level,a.lemma) > userStep || (tappedWords && tappedWords.has(a.lemma))) && !seen.has(a.lemma)) {
        seen.add(a.lemma);
        result.push(a);
      }
    });
  });
  result.sort((a,b) => a.lemma.localeCompare(b.lemma));
  return result;
}

// Fallback: old vocab.json based lookup
function getChapterWordsOld(verses,vocab,userStep){
  const seen=new Set(),result=[];
  verses.forEach(v=>v.text.split(/\s+/).forEach(w=>{
    const c=normalize(w),e=vocab[c];
    if(e&&annoStep(e.level,c)>userStep&&!seen.has(c)){seen.add(c);result.push({word:c,...e})}
  }));
  result.sort((a,b)=>a.word.localeCompare(b.word));
  return result;
}

// ─── TTS ────────────────────────────────────────────────
function useTTS(){
  const [speaking,setSpeaking]=useState(false);
  const [activeVerse,setActiveVerse]=useState(null);
  const [activeWordIdx,setActiveWordIdx]=useState(-1);
  const [speed,setSpeedState]=useState(parseFloat(LS.get('tts-speed'))||0.65);
  const [voices,setVoices]=useState({[INSTANCE.ttsLangPrefix]:[]});
  const langRef=useRef(INSTANCE.ttsLangPrefix);
  const setLang=useCallback(l=>{langRef.current=l},[]);
  const queueRef=useRef([]);const stoppedRef=useRef(false);const speedRef=useRef(speed);
  const lastSentenceRef=useRef({text:'',lang:INSTANCE.ttsLangPrefix});
  const currentVerseRef=useRef(null);const currentCallbackRef=useRef(null);const currentCharIdx=useRef(0);const currentWordIdx=useRef(0);const speedChangeRef=useRef(false);
  const setSpeed=useCallback(v=>{
    speedRef.current=v;setSpeedState(v);LS.set('tts-speed',v);
    if(currentVerseRef.current){
      const {vN,text}=currentVerseRef.current;const cb=currentCallbackRef.current;
      const ci=currentCharIdx.current;const wi=currentWordIdx.current;
      const remaining=text.slice(ci);
      speedChangeRef.current=true;
      speechSynthesis.cancel();
      if(remaining.trim())setTimeout(()=>{speedChangeRef.current=false;speakVerseRef.current(vN,remaining,cb,wi)},50);
      else speedChangeRef.current=false;
    }
  },[]);
  useEffect(()=>{
    const lv=()=>{
      const all=speechSynthesis.getVoices();
      const en=all.filter(v=>v.lang.startsWith(INSTANCE.ttsLangPrefix));
      if(en.length)setVoices({[INSTANCE.ttsLangPrefix]:en});
    };
    lv();speechSynthesis.onvoiceschanged=lv;setTimeout(lv,100);setTimeout(lv,500);
    return()=>{speechSynthesis.cancel()};
  },[]);
  const getVoice=useCallback((langOverride)=>{
    const ev=voices[INSTANCE.ttsLangPrefix]||[];
    for(const n of INSTANCE.ttsVoiceNames){const v=ev.find(v=>v.name.includes(n));if(v)return v}
    return ev[0]||null;
  },[voices]);
  const speakText=useCallback((text,langOverride,rate)=>{
    return new Promise(resolve=>{
      speechSynthesis.cancel(); // iOS fix: prevent repeat bug
      const u=new SpeechSynthesisUtterance(text);
      u.lang=INSTANCE.ttsLang;
      u.rate=rate??speedRef.current;
      const v=getVoice(langOverride);if(v)u.voice=v;
      let done=false;
      const finish=()=>{if(!done){done=true;resolve()}};
      u.onend=finish;u.onerror=finish;
      // Safety timeout: resolve even if onend/onerror never fires
      const maxMs=Math.max(Math.ceil(text.split(/\s+/).length/((rate??speedRef.current)||0.5))*1500,3000);
      setTimeout(finish,maxMs);
      speechSynthesis.speak(u);
    });
  },[getVoice]);
  const speakVerseRef=useRef(null);
  const speakVerse=useCallback((vN,text,onDone,wordOffset=0)=>{
    const words=text.split(/\s+/),ws=[];let p=0;words.forEach(w=>{ws.push(p);p+=w.length+1});
    const u=new SpeechSynthesisUtterance(text);u.lang=INSTANCE.ttsLang;u.rate=speedRef.current;
    const v=getVoice();if(v)u.voice=v;
    currentVerseRef.current={vN,text};currentCallbackRef.current=onDone;currentCharIdx.current=0;currentWordIdx.current=wordOffset;
    setActiveVerse(vN);setActiveWordIdx(wordOffset);setSpeaking(true);
    u.onboundary=e=>{if(e.name==='word'){currentCharIdx.current=e.charIndex;let i=0;for(let j=ws.length-1;j>=0;j--){if(e.charIndex>=ws[j]){i=j;break}}currentWordIdx.current=i+wordOffset;setActiveWordIdx(i+wordOffset)}};
    u.onend=()=>{if(speedChangeRef.current)return;currentVerseRef.current=null;setActiveWordIdx(-1);if(onDone)onDone()};
    u.onerror=()=>{if(speedChangeRef.current)return;currentVerseRef.current=null;setActiveWordIdx(-1);if(onDone)onDone()};
    speechSynthesis.speak(u);
  },[getVoice]);
  speakVerseRef.current=speakVerse;
  const speakSingleVerse=useCallback((vN,text)=>{speechSynthesis.cancel();stoppedRef.current=false;queueRef.current=[];speakVerse(vN,text,()=>{setSpeaking(false);setActiveVerse(null);setActiveWordIdx(-1)})},[speakVerse]);
  const allVersesRef=useRef([]);
  const nextCbRef=useRef(null);
  const speakChapter=useCallback(verses=>{
    allVersesRef.current=verses;
    stoppedRef.current=true;speechSynthesis.cancel();
    stoppedRef.current=false;queueRef.current=verses.slice(1);setSpeaking(true);
    const next=()=>{if(stoppedRef.current||!queueRef.current.length){setSpeaking(false);setActiveVerse(null);setActiveWordIdx(-1);return}
      setTimeout(()=>{if(stoppedRef.current)return;const n=queueRef.current.shift();const el=document.getElementById(`verse-${n.n}`);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});speakVerse(n.n,n.text,next,n.wordOffset||0)},300)};
    nextCbRef.current=next;
    const f=verses[0];const el=document.getElementById(`verse-${f.n}`);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});speakVerse(f.n,f.text,next,f.wordOffset||0);
  },[speakVerse]);
  const skipVerse=useCallback((dir)=>{
    const all=allVersesRef.current;if(!all.length)return;
    const curIdx=all.findIndex(v=>v.n===activeVerse);
    const newIdx=curIdx+dir;
    if(newIdx<0||newIdx>=all.length)return;
    stoppedRef.current=true;speechSynthesis.cancel();stoppedRef.current=false;
    queueRef.current=all.slice(newIdx+1);
    const next=()=>{if(stoppedRef.current||!queueRef.current.length){setSpeaking(false);setActiveVerse(null);setActiveWordIdx(-1);return}
      setTimeout(()=>{if(stoppedRef.current)return;const n=queueRef.current.shift();const el=document.getElementById(`verse-${n.n}`);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});speakVerse(n.n,n.text,next,n.wordOffset||0)},300)};
    nextCbRef.current=next;
    const v=all[newIdx];const el=document.getElementById(`verse-${v.n}`);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});speakVerse(v.n,v.text,next,0);
  },[speakVerse,activeVerse]);
  const lastStoppedVerse=useRef(null);
  const stop=useCallback(()=>{lastStoppedVerse.current=activeVerse;stoppedRef.current=true;queueRef.current=[];speechSynthesis.cancel();setSpeaking(false);setActiveVerse(null);setActiveWordIdx(-1)},[activeVerse]);
  const hasVoices=(voices[INSTANCE.ttsLangPrefix]||[]).length>0;
  return{speaking,activeVerse,activeWordIdx,speed,setSpeed,speakSingleVerse,speakChapter,speakText,lastSentenceRef,stop,hasVoices,setLang,lastStoppedVerse,skipVerse};
}

  const buildChapClozeMap=useCallback((targetLemmas,ctx)=>{
    const map=new Map();
    const chap=annotations[bookName]?.[String(chapNum)];
    if(!chap)return map;
    for(const v of verses){
      const va=chap[String(v.n)];if(!va)continue;

      for(const a of va){

        if(sp>=wds.length)continue;

        if(ctx==='verse'){
          tSent=v.text;lsp=sp;lep=ep;
        }else{
          const sents=v.text.split(/(?<=[.!?…;:])\s+/);
          let wOff=0;tSent=null;lsp=-1;lep=-1;

      }
    }
    return map;
  },[annotations,bookName,chapNum,verses]);

  const startChapExercise=useCallback((mode,ctxOverride)=>{

  },[quizWords,hasAnno,clozeCtx,reviewDone,unknownWords,wordData,buildChapClozeMap,genOpts]);

  const switchChapExercise=useCallback(target=>{

  const startNextUnit=useCallback(()=>{

  const chapTrainPick=useCallback((ans)=>{

  },[chapTrain,chapTrainRetry,trainWord,wordData]);

  const chapTrainAdvance=useCallback(()=>{

  const doSearch=useCallback(async(q)=>{

  // Build practice fragments (short text pieces around unknown words)
  const buildFragments=useCallback(()=>{
    const useAnno=hasAnno;
    const MAX_SHORT=10,WINDOW=4;
    const fragments=[];
    verses.forEach(v=>{
      const allWords=v.text.split(/\s+/);
      const unknownPositions=[];
      if(useAnno){
        const chap=annotations[bookName]?.[String(chapNum)];
        const va=chap?.[String(v.n)];
        if(va){
          for(let p=0;p<allWords.length;p++){
            if(va.some(a=>a.pos!=null&&p>=a.pos&&p<=(a.pos_end??a.pos)&&(a.pos_end!=null||annoStep(a.level,a.lemma)>userStep||tappedWords.has(a.lemma))&&(unknownWords.has(a.lemma)||a.pos_end!=null)&&!learnedWords.has(a.lemma)))unknownPositions.push(p);
          }
        }
      } else {
        allWords.forEach((w,p)=>{const c=normalize(w);if(unknownWords.has(c)&&!learnedWords.has(c))unknownPositions.push(p)});
      }
      if(!unknownPositions.length)return;
      const parts=v.text.split(/(?<=[.!?…»;:])\s+/);
      let wordPos=0;
      parts.forEach(sent=>{
        const sentWords=sent.split(/\s+/);
        const startPos=wordPos;
        const endPos=startPos+sentWords.length-1;
        const inSent=unknownPositions.filter(p=>p>=startPos&&p<=endPos);
        if(!inSent.length){wordPos+=sentWords.length;return}
        // Find word info for unknown words in this fragment
        const findWordInfos=(positions)=>{
          if(useAnno){
            const chap=annotations[bookName]?.[String(chapNum)];
            const va=chap?.[String(v.n)];
            if(!va)return[];
            return positions.map(p=>{const a=va.find(a=>a.pos!=null&&p>=a.pos&&p<=(a.pos_end??a.pos));return a?{form:a.form,lemma:a.lemma,de:a.de}:null}).filter(Boolean);
          }
          return positions.map(p=>{const c=normalize(allWords[p]);const e=vocab[c];return e?{form:allWords[p],lemma:c,de:e.de}:{form:allWords[p],lemma:c,de:''}}).filter(w=>w.de);
        };
        if(sentWords.length<=MAX_SHORT){
          fragments.push({n:v.n,text:sent,wordOffset:startPos,words:findWordInfos(inSent)});
        } else {
          const clauses=sent.split(/,\s*/);
          let clauseStart=startPos;
          let used=new Set();
          clauses.forEach(clause=>{
            const cWords=clause.split(/\s+/);
            const cEnd=clauseStart+cWords.length-1;
            const inClause=inSent.filter(p=>p>=clauseStart&&p<=cEnd);
            if(inClause.length&&!used.has(clause)){
              used.add(clause);
              if(cWords.length<=MAX_SHORT+4){
                fragments.push({n:v.n,text:clause,wordOffset:clauseStart,words:findWordInfos(inClause)});
              } else {
                inClause.forEach(p=>{
                  const lo=Math.max(startPos,p-WINDOW);
                  const hi=Math.min(startPos+allWords.length-1,p+WINDOW);
                  const slice=allWords.slice(lo,hi+1).join(' ');
                  fragments.push({n:v.n,text:slice,wordOffset:lo,words:findWordInfos([p])});
                });
              }
            }
            clauseStart+=cWords.length;
          });
        }
        wordPos+=sentWords.length;
      });
    });
    return fragments;

  const readBackups=()=>{const l=LS.get('bible-word-data-backups');const arr=Array.isArray(l)?l:[];const old=LS.get('bible-word-data-backup');return old?[{ts:null,data:old},...arr]:arr;};
  // Quota-sicher speichern (LS.set schluckt Fehler): direkt setItem, bei Überlauf ältestes (am Ende) fallenlassen
  const persistBackups=list=>{let arr=list.slice(0,12);for(;;){try{localStorage.setItem(INSTANCE.lsPrefix+'bible-word-data-backups',JSON.stringify(arr));break;}catch(e){if(!arr.length)break;arr=arr.slice(0,-1);}}LS.remove('bible-word-data-backup');return arr;};
  // Rohe localStorage-Keys sind bereits präfixiert (INSTANCE.lsPrefix); für den
  // LS-Wrapper (der selbst präfixiert) muss der Präfix vor der Weitergabe entfernt werden.
  const CHAP_KEY_RE=new RegExp('^'+INSTANCE.lsPrefix.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')+'(unk|rev)-');
  const stripLsPrefix=k=>k.slice(INSTANCE.lsPrefix.length);
  // Vollständiger Lernstand-Snapshot (zusätzlich zu den Wortdaten): Lese-Level,
  // Trainingsstufen, Lernfokus, Übungsart, Trainingshistorie und Kapitel-Markierungen
  // (unk-*/rev-*). Einstellungen (Schrift, Theme, TTS) und Leseposition bewusst nicht —
  // die verändert das Testen nicht.
  const SNAP_LS_KEYS=['bible-train-step','bible-freq-step','bible-train-focus','bible-ex-mode','bible-training-history'];
  const makeSnapshot=()=>{
    const chap={};
    try{for(let i=0;i<localStorage.length;i++){const rawK=localStorage.key(i);if(CHAP_KEY_RE.test(rawK)){const k=stripLsPrefix(rawK);chap[k]=LS.get(k);}}}catch(e){}
    const ls={};SNAP_LS_KEYS.forEach(k=>{ls[k]=LS.get(k);});
    return {userStep,unknownWords:[...unknownWords],learnedWords:[...learnedWords],tappedWords:[...tappedWords],ls,chap};
  };
  const restoreBackup=b=>{
    if(!b||!b.data)return;
    setWordData(b.data);LS.set('bible-word-data',b.data);
    const s=b.snap;
    if(s){
      if(s.userStep!=null)setUserStep(s.userStep);
      setUnknownWords(new Set(s.unknownWords||[]));
      setLearnedWords(new Set(s.learnedWords||[]));
      setTappedWords(new Set(s.tappedWords||[]));
      SNAP_LS_KEYS.forEach(k=>{const v=(s.ls||{})[k];v==null?LS.remove(k):LS.set(k,v);});
      if(s.ls&&s.ls['bible-ex-mode'])setExMode(s.ls['bible-ex-mode']);
      // Kapitel-Markierungen: im Test entstandene Keys entfernen, dann Snapshot zurückschreiben
      try{const del=[];for(let i=0;i<localStorage.length;i++){const rawK=localStorage.key(i);if(CHAP_KEY_RE.test(rawK))del.push(stripLsPrefix(rawK));}del.forEach(k=>LS.remove(k));}catch(e){}

    setPhase('nav');
  };
  const deleteBackup=idx=>{setDevBackups(persistBackups(devBackups.filter((_,i)=>i!==idx)));};

      if(unk>0)ws.slice(-(unex+unk),unex>0?-unex:undefined).forEach(w=>{newData[w.en]={familiarity:0,lasttrained:yesterday,numberoftrainings:1,learned:0,forgotten:0};});
      if(unex>0)ws.slice(-unex).forEach(w=>delete newData[w.en]);
    }
    LS.set('bible-word-data',newData);
    LS.set('bible-freq-step',devStartStep);LS.set('bible-train-step',devStartStep);LS.set('bible-train-focus','freq');

            </label>

            <span style={{fontSize:14,fontWeight:600,color:'var(--t-title)',fontFamily:sans}}>{t('clozeContext')}</span>
            <div style={{...S.levelBtns,marginTop:6}}>{[{k:'sentence',i:'clozeCtxSentence'},{k:'verse',i:'clozeCtxVerse'}].map(o=>(<button key={o.k} onClick={()=>changeClozeCtx(o.k)} style={{...S.lvlBtn,...(clozeCtx===o.k?S.lvlActive:{})}}>{t(o.i)}</button>))}</div>
            <p style={S.settingsHint}>{t('clozeContextHint')}</p>

                  <span style={{fontSize:10}}>Startstufe = {SUBSTEPS[simStartStep]}</span>
                  <input type="range" min="0" max="17" value={simStartStep} onChange={e=>setSimStartStep(parseInt(e.target.value))} style={{width:'100%'}}/>

  // ── READING ──
  const isPhoneSim=document.body.classList.contains('mode-phone');
