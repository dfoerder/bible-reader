<script>
function toggleViewMode(){
  var b=document.body, btn=document.querySelector('.view-toggle');
  if(b.classList.contains('mode-phone')){
    b.classList.replace('mode-phone','mode-desktop');
    btn.textContent='Phone';
    localStorage.setItem('bible-view-mode','desktop');
  } else {
    b.classList.replace('mode-desktop','mode-phone');
    btn.textContent='Desktop';
    localStorage.setItem('bible-view-mode','phone');
  }
}
(function(){
  var isPWA=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone;
  var isMobile=/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)||('ontouchstart' in window&&window.innerWidth<600);
  if(isPWA||isMobile){
    document.body.classList.replace('mode-phone','mode-desktop');
    document.querySelector('.view-toggle').style.display='none';
  } else {
    var m=localStorage.getItem('bible-view-mode');
    if(m==='desktop'){
      document.body.classList.replace('mode-phone','mode-desktop');
      document.querySelector('.view-toggle').textContent='Phone';
    }
  }
})();
</script>
<script type="text/babel">
const {useState,useEffect,useCallback,useMemo,useRef} = React;
const APP_VERSION = '1.2.0';
const sans = "system-ui,-apple-system,'Segoe UI',sans-serif";

const LS = {
  get(k){try{const v=localStorage.getItem(k);return v?JSON.parse(v):null}catch(e){return null}},
  set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}

// ─── Level Test ─────────────────────────────────────────
const LEVEL_TEST=[
  {en:'water',de:'Wasser',wrong:['Feuer','Stein'],level:'A1'},
  {en:'bread',de:'Brot',wrong:['Milch','Fleisch'],level:'A1'},
  {en:'house',de:'Haus',wrong:['Stadt','Straße'],level:'A1'},

  {en:'voice',de:'Stimme',wrong:['Klang','Schrei'],level:'A2'},
  {en:'sheep',de:'Schaf',wrong:['Ziege','Esel'],level:'A2'},
  {en:'wrong',de:'Unrecht',wrong:['Recht','Gericht'],level:'A2'},
  {en:'clothes',de:'Kleider',wrong:['Schuhe','Stoffe'],level:'A2'},
  {en:'field',de:'Feld',wrong:['Garten','Hügel'],level:'A2'},

  {en:'anguish',de:'Qual',wrong:['Trost','Ruhe'],level:'C1'},
];

function scoreLevelTest(answers){
  const byLevel={A1:0,A2:0,B1:0,B2:0,C1:0};
  const maxByLevel={A1:0,A2:0,B1:0,B2:0,C1:0};
  LEVEL_TEST.forEach((q,i)=>{
    maxByLevel[q.level]++;
    if(answers[i]===q.de)byLevel[q.level]++;
  });
  const pct=lvl=>maxByLevel[lvl]?byLevel[lvl]/maxByLevel[lvl]:0;
  if(pct('A1')<0.5)return 'A1';
  if(pct('A2')<0.5)return 'A1';
  if(pct('B1')<0.5)return 'A2';
  if(pct('B2')<0.5)return 'B1';
  if(pct('C1')<0.5)return 'B2';
  return 'C1';
}

function LevelTest({onComplete}){
  const [current,setCurrent]=useState(0);
  const [answers,setAnswers]=useState([]);
  const [shuffled]=useState(()=>LEVEL_TEST.map(q=>{
    const opts=[q.de,...q.wrong];
    for(let i=opts.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]]}
    return opts;
  }));
  const [selected,setSelected]=useState(null);
  const [correct,setCorrect]=useState(null);
  const [done,setDone]=useState(false);
  const [result,setResult]=useState(null);

  const q=LEVEL_TEST[current];
  const opts=shuffled[current];

  const pick=useCallback(ans=>{
    if(selected!==null)return;
    setSelected(ans);
    setCorrect(ans===q.de);
    const newAnswers=[...answers,ans];
    setAnswers(newAnswers);
    setTimeout(()=>{
      if(current<LEVEL_TEST.length-1){
        setCurrent(current+1);setSelected(null);setCorrect(null);
      } else {
        const level=scoreLevelTest(newAnswers);
        setResult(level);setDone(true);
      }
    },800);
  },[current,answers,q,selected]);

  if(done){
    const total=answers.filter((a,i)=>a===LEVEL_TEST[i].de).length;
    return(<div>
      <header style={S.header}>
        <h1 style={S.title}>Ergebnis</h1>
      </header>
      <div style={{textAlign:'center',padding:'20px 0'}}>
        <div style={{fontSize:48,fontWeight:700,color:'var(--t-primary)',fontFamily:sans,margin:'16px 0'}}>{result}</div>
        <p style={{fontSize:16,color:'var(--t-text2)',fontFamily:sans,margin:'8px 0'}}>{total} von {LEVEL_TEST.length} richtig</p>
        <p style={{fontSize:14,color:'var(--t-muted)',fontFamily:sans,margin:'16px 0 24px',lineHeight:1.6}}>
          Dein Sprachniveau wurde auf <strong>{result}</strong> gesetzt.<br/>
          Du kannst es jederzeit in den Einstellungen ändern.
        </p>
        <button onClick={()=>onComplete(result)} style={S.startBtn}>Weiter</button>
      </div>
    </div>);
  }

  return(<div>
    <header style={S.header}>
      <h1 style={S.title}>Sprachtest</h1>
      <p style={{fontSize:14,color:'var(--t-muted)',fontFamily:sans,margin:'4px 0'}}>Frage {current+1} von {LEVEL_TEST.length}</p>
    </header>
    <div style={{background:'var(--t-border)',borderRadius:4,height:6,margin:'0 0 24px',overflow:'hidden'}}>
      <div style={{height:'100%',background:'var(--t-primary)',borderRadius:4,transition:'width 0.3s',width:`${((current)/LEVEL_TEST.length)*100}%`}}/>
    </div>
    <div style={{textAlign:'center',margin:'20px 0 32px'}}>
      <p style={{fontSize:13,color:'var(--t-muted)',fontFamily:sans,margin:'0 0 8px'}}>Was bedeutet:</p>
      <p style={{fontSize:28,fontWeight:700,color:'var(--t-title)',fontFamily:'var(--t-serif)',margin:0}}>{q.en}</p>
    </div>
    <div style={{display:'flex',flexDirection:'column',gap:10,maxWidth:320,margin:'0 auto'}}>
      {opts.map((opt,i)=>{
        const isSelected=selected===opt;
        const isCorrectOpt=opt===q.de;
        let bg='var(--t-card-solid)',border='1.5px solid var(--t-border)',color='var(--t-text)';
        if(selected!==null){
          if(isCorrectOpt){bg='var(--t-green-bg)';border='1.5px solid var(--t-green)';color='var(--t-green)'}
          else if(isSelected){bg='var(--t-accent-bg)';border='1.5px solid var(--t-accent)';color='var(--t-accent)'}
        }
        return(<button key={i} onClick={()=>pick(opt)} style={{padding:'14px 20px',border,borderRadius:10,background:bg,color,fontSize:17,fontWeight:600,cursor:selected===null?'pointer':'default',fontFamily:sans,textAlign:'center',transition:'all 0.2s'}}>{opt}</button>);
      })}
    </div>
  </div>);
}

let VOCAB_POOL={A1:[],A2:[],B1:[],B2:[],C1:[]};

function Training({userLevel,onBack,books,openChapter}){
  const [mode,setMode]=useState(null);
  const [exType,setExType]=useState(null);
  const [selectedLevel,setSelectedLevel]=useState(userLevel);
  const [exercises,setExercises]=useState([]);
  const [current,setCurrent]=useState(0);
  const [selected,setSelected]=useState(null);
  const [score,setScore]=useState(0);
  const [done,setDone]=useState(false);
  const [shuffledOpts,setShuffledOpts]=useState([]);
  const [lastStart,setLastStart]=useState(null);
  const wrongRef=useRef([]);
  const totalRef=useRef(0);

  const shuffle=arr=>{const a=[...arr];for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

  const startCloze=useCallback(lvl=>{
    const pool=CLOZE_EXERCISES[lvl]||[];
    const picked=shuffle(pool).slice(0,10);
    setExercises(picked);
    setShuffledOpts(picked.map(ex=>shuffle([ex.answer,...ex.wrong])));
    setCurrent(0);setScore(0);setDone(false);setSelected(null);setExType('cloze');setMode('exercise');
    wrongRef.current=[];totalRef.current=picked.length;
    setSelectedLevel(lvl);setLastStart(()=>()=>startCloze(lvl));
  },[]);

  const COOLDOWN=7*24*3600*1000;
  const getVocabLog=()=>LS.get('bible-vocab-log')||{};
  const saveVocabLog=log=>LS.set('bible-vocab-log',log);

  const startVocab=useCallback(lvl=>{
    const pool=VOCAB_POOL[lvl]||[];
    const log=getVocabLog();
    const now=Date.now();
    const fresh=pool.filter(w=>!log[lvl+':'+w.en]||now-log[lvl+':'+w.en]>=COOLDOWN);
    const src=fresh.length>=15?fresh:pool;
    const picked=shuffle(src).slice(0,15);
    const allDe=pool.map(w=>w.de);
    setExercises(picked);
    setShuffledOpts(picked.map(q=>{
      const wrong=shuffle(allDe.filter(d=>d!==q.de)).slice(0,2);
      return shuffle([q.de,...wrong]);
    }));
    setCurrent(0);setScore(0);setDone(false);setSelected(null);setExType('vocab');setMode('exercise');
    wrongRef.current=[];totalRef.current=picked.length;
    setSelectedLevel(lvl);setLastStart(()=>()=>startVocab(lvl));
  },[]);

  const startBookCloze=useCallback(bi=>{
    const bookNr=books[bi].nr;
    const allEx=Object.values(CLOZE_EXERCISES).flat().filter(e=>e.book===bookNr);
    if(allEx.length===0){setMode('noexercises');return}
    const picked=shuffle(allEx).slice(0,10);
    setExercises(picked);
    setShuffledOpts(picked.map(ex=>shuffle([ex.answer,...ex.wrong])));
    setCurrent(0);setScore(0);setDone(false);setSelected(null);setExType('cloze');setMode('exercise');
    wrongRef.current=[];totalRef.current=picked.length;
    setLastStart(()=>()=>startBookCloze(bi));
  },[books]);

  const pick=useCallback(ans=>{
    if(selected!==null)return;
    const ex=exercises[current];
    const correct=exType==='vocab'?ans===ex.de:ans===ex.answer;
    setSelected(ans);
    if(correct){
      setScore(s=>s+1);
      if(exType==='vocab'){
        const log=getVocabLog();
        log[selectedLevel+':'+ex.en]=Date.now();
        saveVocabLog(log);
      }
      setTimeout(()=>{
        if(current<exercises.length-1){setCurrent(c=>c+1);setSelected(null)}
        else if(wrongRef.current.length>0) startRetry();
        else setDone(true);
      },900);
    } else {
      wrongRef.current=[...wrongRef.current,{ex,optsIdx:current}];
    }
  },[current,exercises,selected,exType,selectedLevel,startRetry]);

  const startRetry=useCallback(()=>{
    const wrong=wrongRef.current;
    wrongRef.current=[];
    const retryEx=wrong.map(w=>w.ex);
    setExercises(retryEx);
    if(exType==='vocab'){
      const pool=VOCAB_POOL[selectedLevel]||[];
      const allDe=pool.map(w=>w.de);
      setShuffledOpts(retryEx.map(q=>{
        const wr=shuffle(allDe.filter(d=>d!==q.de)).slice(0,2);
        return shuffle([q.de,...wr]);
      }));
    } else {
      setShuffledOpts(retryEx.map(ex=>shuffle([ex.answer,...ex.wrong])));
    }
    setCurrent(0);setSelected(null);
  },[exType,selectedLevel]);

  const advance=useCallback(()=>{
    if(current<exercises.length-1){setCurrent(c=>c+1);setSelected(null)}
    else if(wrongRef.current.length>0) startRetry();
    else setDone(true);
  },[current,exercises,startRetry]);

  if(done){
    return(<div>
      <header style={S.header}><h1 style={S.title}>Ergebnis</h1></header>
      <div style={{textAlign:'center',padding:'20px 0'}}>
        <div style={{fontSize:48,fontWeight:700,color:score>=totalRef.current*0.7?'var(--t-green)':'var(--t-accent)',fontFamily:sans}}>{score}/{totalRef.current}</div>
        <p style={{fontSize:16,color:'var(--t-text2)',fontFamily:sans,margin:'12px 0 24px'}}>{score>=totalRef.current*0.7?'Gut gemacht!':'Weiter üben!'}</p>
        <div style={{display:'flex',gap:12,justifyContent:'center'}}>
          <button onClick={()=>setMode(null)} style={S.navBtn}>Beenden</button>
          {lastStart&&<button onClick={()=>{setDone(false);lastStart()}} style={S.startBtn}>Weiter</button>}
        </div>
      </div>
    </div>);
  }

  if(mode==='exercise'&&exType==='cloze'){
    const ex=exercises[current];const opts=shuffledOpts[current];const parts=ex.text.split('___');
    return(<div>
      <header style={S.header}>
        <h1 style={S.title}>Lückentext</h1>
        <p style={{fontSize:14,color:'var(--t-muted)',fontFamily:sans}}>{current+1} / {exercises.length}</p>
      </header>
      <div style={{background:'var(--t-border)',borderRadius:4,height:6,margin:'0 0 20px',overflow:'hidden'}}>
        <div style={{height:'100%',background:'var(--t-primary)',borderRadius:4,transition:'width 0.3s',width:`${(current/exercises.length)*100}%`}}/>
      </div>
      <div style={{fontFamily:'var(--t-serif)',fontSize:18,lineHeight:2,color:'var(--t-title)',textAlign:'center',margin:'16px 0 8px'}}>
        {parts[0]}<span style={{display:'inline-block',minWidth:80,borderBottom:'2px dashed var(--t-accent)',padding:'0 4px',color:selected!==null?(selected===ex.answer?'var(--t-green)':'var(--t-accent)'):'var(--t-muted)',fontWeight:600}}>{selected||'...'}</span>{parts[1]}
      </div>
      <p style={{fontSize:12,color:'var(--t-muted)',fontFamily:sans,textAlign:'center',margin:'0 0 20px'}}>{ex.ref}</p>
      <div style={{display:'flex',flexDirection:'column',gap:10,maxWidth:300,margin:'0 auto'}}>
        {opts.map((opt,i)=>{
          let bg='var(--t-card-solid)',border='1.5px solid var(--t-border)',color='var(--t-text)';
          if(selected!==null){
            if(opt===ex.answer){bg='var(--t-green-bg)';border='1.5px solid var(--t-green)';color='var(--t-green)'}
            else if(opt===selected){bg='var(--t-accent-bg)';border='1.5px solid var(--t-accent)';color='var(--t-accent)'}
          }
          return(<button key={i} onClick={()=>pick(opt)} style={{padding:'12px 20px',border,borderRadius:10,background:bg,color,fontSize:16,fontWeight:600,cursor:selected===null?'pointer':'default',fontFamily:sans,textAlign:'center',transition:'all 0.2s',textDecoration:selected!==null&&opt===selected&&opt!==ex.answer?'line-through':'none'}}>{opt}</button>);
        })}
      </div>
      {selected!==null&&selected===ex.answer&&<p style={{textAlign:'center',fontSize:14,color:'var(--t-muted)',fontFamily:sans,margin:'16px 0 0'}}>{ex.answer} = {ex.de}</p>}
      {selected!==null&&selected!==ex.answer&&<div style={{textAlign:'center',margin:'16px 0 0'}}>
        <p style={{fontSize:14,color:'var(--t-muted)',fontFamily:sans,margin:'0 0 4px'}}>{ex.answer} = {ex.de}</p>
        <p style={{fontSize:16,fontWeight:600,color:'var(--t-accent)',fontFamily:sans,margin:'0 0 12px'}}>Falsch!</p>
        <button onClick={advance} style={S.startBtn}>Weiter</button>
      </div>}
    </div>);
  }

  if(mode==='exercise'&&exType==='vocab'){
    const ex=exercises[current];const opts=shuffledOpts[current];
    return(<div>
      <header style={S.header}>
        <h1 style={S.title}>Vokabeln</h1>
        <p style={{fontSize:14,color:'var(--t-muted)',fontFamily:sans}}>{current+1} / {exercises.length}</p>
      </header>
      <div style={{background:'var(--t-border)',borderRadius:4,height:6,margin:'0 0 20px',overflow:'hidden'}}>
        <div style={{height:'100%',background:'var(--t-primary)',borderRadius:4,transition:'width 0.3s',width:`${(current/exercises.length)*100}%`}}/>
      </div>
      <div style={{textAlign:'center',margin:'24px 0 32px'}}>
        <p style={{fontSize:13,color:'var(--t-muted)',fontFamily:sans,margin:'0 0 8px'}}>Was bedeutet:</p>
        <p style={{fontSize:28,fontWeight:700,color:'var(--t-title)',fontFamily:'var(--t-serif)',margin:0}}>{ex.en}</p>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:10,maxWidth:300,margin:'0 auto'}}>
        {opts.map((opt,i)=>{
          let bg='var(--t-card-solid)',border='1.5px solid var(--t-border)',color='var(--t-text)',textDeco='none';
          if(selected!==null){
            if(opt===ex.de){bg='var(--t-green-bg)';border='1.5px solid var(--t-green)';color='var(--t-green)'}
            else if(opt===selected){bg='var(--t-accent-bg)';border='1.5px solid var(--t-accent)';color='var(--t-accent)';textDeco='line-through'}
          }
          return(<button key={i} onClick={()=>pick(opt)} style={{padding:'14px 20px',border,borderRadius:10,background:bg,color,fontSize:17,fontWeight:600,cursor:selected===null?'pointer':'default',fontFamily:sans,textAlign:'center',transition:'all 0.2s',textDecoration:textDeco}}>{opt}</button>);
        })}
      </div>
      {selected!==null&&selected!==ex.de&&<div style={{textAlign:'center',margin:'16px 0 0'}}>
        <p style={{fontSize:16,fontWeight:600,color:'var(--t-accent)',fontFamily:sans,margin:'0 0 12px'}}>Falsch!</p>
        <button onClick={advance} style={S.startBtn}>Weiter</button>
      </div>}
    </div>);
  }

  if(mode==='noexercises'){
    return(<div>
      <header style={S.header}><h1 style={S.title}>Training</h1></header>
      <div style={S.navRow}><button onClick={()=>setMode(null)} style={S.navBtn}>← Zurück</button></div>
      <p style={{textAlign:'center',color:'var(--t-muted)',fontFamily:sans,margin:'40px 0'}}>Für dieses Buch gibt es noch keine Übungen.</p>
    </div>);
  }

  if(mode==='book'){
    const ntStart=books.findIndex(b=>b.nr>=40);
    const otBooks=books.slice(0,ntStart>0?ntStart:books.length);
    const ntBooks=ntStart>0?books.slice(ntStart):[];
    const bookHasEx=bi=>{const nr=books[bi].nr;return Object.values(CLOZE_EXERCISES).flat().some(e=>e.book===nr)};
    return(<div>
      <header style={S.header}><h1 style={S.title}>Lückentext nach Buch</h1></header>
      <div style={S.navRow}><button onClick={()=>setMode(null)} style={S.navBtn}>← Zurück</button></div>
      <div style={S.settingsSection}>
        {otBooks.length>0&&<div style={S.settingsGroup}>
          <span style={S.settingsLabel}>Altes Testament</span>
          <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
            {otBooks.map((b,i)=>{const has=bookHasEx(i);return(
              <button key={i} onClick={()=>has&&startBookCloze(i)} style={{padding:'6px 12px',border:'1px solid var(--t-border)',borderRadius:6,background:has?'var(--t-card-solid)':'var(--t-bg2)',color:has?'var(--t-text2)':'var(--t-muted2)',fontSize:13,fontFamily:sans,cursor:has?'pointer':'default',opacity:has?1:0.5}}>{b.name}</button>
            )})}
          </div>
        </div>}
        {ntBooks.length>0&&<div style={S.settingsGroup}>
          <span style={S.settingsLabel}>Neues Testament</span>
          <div style={{display:'flex',flexWrap:'wrap',gap:6}}>
            {ntBooks.map((b,i)=>{const bi=ntStart+i;const has=bookHasEx(bi);return(
              <button key={bi} onClick={()=>has&&startBookCloze(bi)} style={{padding:'6px 12px',border:'1px solid var(--t-border)',borderRadius:6,background:has?'var(--t-card-solid)':'var(--t-bg2)',color:has?'var(--t-text2)':'var(--t-muted2)',fontSize:13,fontFamily:sans,cursor:has?'pointer':'default',opacity:has?1:0.5}}>{b.name}</button>
            )})}
          </div>
        </div>}
      </div>
    </div>);
  }

  return(<div>
    <header style={S.header}><h1 style={S.title}>Training</h1></header>
    <div style={S.navRow}><button onClick={onBack} style={S.navBtn}>← Zurück</button></div>
    <div style={S.settingsSection}>
      <div style={S.settingsGroup}>
        <span style={S.settingsLabel}>Vokabeln</span>
        <p style={{fontSize:14,color:'var(--t-muted)',fontFamily:sans,margin:'4px 0 12px'}}>Englisches Wort — welche deutsche Übersetzung ist richtig? 15 Fragen pro Runde.</p>
        <div style={{display:'flex',flexWrap:'wrap',gap:8}}>
          {['A1','A2','B1','B2','C1'].map(lvl=>{const pool=VOCAB_POOL[lvl]||[];const log=getVocabLog();const now=Date.now();const fresh=pool.filter(w=>!log[lvl+':'+w.en]||now-log[lvl+':'+w.en]>=COOLDOWN).length;return(
            <button key={lvl} onClick={()=>startVocab(lvl)} style={{...S.lvlBtn,padding:'10px 20px',fontSize:16,...(lvl===userLevel?{borderColor:'var(--t-accent)',color:'var(--t-accent)'}:{})}}>
              <span>{lvl}{lvl===userLevel?' ★':''}</span>
              <span style={{display:'block',fontSize:11,color:'var(--t-muted)',marginTop:2}}>{fresh}/{pool.length}</span>
            </button>);})}
        </div>
      </div>
      <div style={S.settingsGroup}>
        <span style={S.settingsLabel}>Lückentext</span>
        <p style={{fontSize:14,color:'var(--t-muted)',fontFamily:sans,margin:'4px 0 12px'}}>Finde das fehlende Wort im Bibelvers.</p>
        <div style={{display:'flex',flexWrap:'wrap',gap:8,marginBottom:12}}>
          {['A1','A2','B1','B2','C1'].map(lvl=>(<button key={lvl} onClick={()=>startCloze(lvl)} style={{...S.lvlBtn,padding:'10px 20px',fontSize:16,...(lvl===userLevel?{borderColor:'var(--t-accent)',color:'var(--t-accent)'}:{})}}>{lvl}</button>))}
        </div>
        <button onClick={()=>setMode('book')} style={{...S.navBtn,fontSize:13}}>Nach Buch wählen</button>
      </div>
    </div>
  </div>);
}

// ─── Load all data ──────────────────────────────────────
const isPWA=window.matchMedia('(display-mode: standalone)').matches||window.navigator.standalone;
const CB=isPWA?'':'?v='+Date.now(); // cache-buster (disabled in PWA for offline support)

const _bookCache={};
const _annoCache={};

async function fetchBook(nr){
  if(_bookCache[nr])return _bookCache[nr];
  const r=await fetch('bibles/eng/web/'+nr+'_web.json'+CB);
  if(!r.ok)throw new Error('book not found');
  const d=await r.json();
  _bookCache[nr]=d;
  return d;
}

async function fetchAnno(nr){
  if(_annoCache[nr])return _annoCache[nr];
  try{
    const r=await fetch('bibles/eng/web/anno/'+nr+'_web_deu.json'+CB);
    if(r.ok){const d=await r.json();_annoCache[nr]=d;return d;}
  }catch(e){}
  return null;
}

const _deCache={};
async function fetchDe(nr){
  if(_deCache[nr])return _deCache[nr];
  try{
    const r=await fetch('bibles/deu/sch1951/'+nr+'_sch1951.json'+CB);
    if(r.ok){const d=await r.json();_deCache[nr]=d;return d;}
  }catch(e){}
  return null;
}

async function loadData(){
  const en={};
  try{
    const r=await fetch('bibles/index.json'+CB);
    if(!r.ok)throw new Error('not found');
    const idx=await r.json();
    const otBooks=idx.books.filter(b=>b.testament==='ot');
    const ntBooks=idx.books.filter(b=>b.testament==='nt');
    en.bible={books:[...otBooks,...ntBooks]};
    en.ntStartIndex=otBooks.length;
    en.stats=idx.stats;
    en.vocab={};
    en.annotations={};
    en.available=true;
  }catch(e){en.available=false;}
  try{
    const vr=await fetch('data/vocab_pool.json'+CB);
    if(vr.ok) VOCAB_POOL=await vr.json();
  }catch(e){}
  return{en};
}

// Split trailing punctuation from a word token: "diffamer," → ["diffamer", ","]
function splitPunct(token){
  const m=token.match(/^(.+?)([,;:.!?…»"'\-)]+)$/);
  return m?[m[1],m[2]]:[token,''];
}

const LEVELS=["A1","A2","B1","B2","C1","C2"];
const lvlIdx=l=>LEVELS.indexOf(l);

function normalize(w){
  return w.toLowerCase().replace(/^[''"\-(]/,'').replace(/[''"\-),;:.!?…]$/,'');
}

// Get annotation for a specific word position in a verse
// Returns {anno, role} where role is 'single', 'start', 'middle', or 'end'
function getAnnotation(annotations, bookName, chapNum, verseNum, wordPos) {
  const book = annotations[bookName];
  if (!book) return null;
  const chap = book[String(chapNum)];
  if (!chap) return null;
  const verse = chap[String(verseNum)];
  if (!verse) return null;
  // Check for exact single-word match
  const exact = verse.find(a => a.pos === wordPos && !a.pos_end);
  if (exact) return {anno: exact, role: 'single'};
  // Check for multi-word annotation
  const multi = verse.find(a => a.pos_end != null && wordPos >= a.pos && wordPos <= a.pos_end);
  if (multi) {
    if (wordPos === multi.pos) return {anno: multi, role: 'start'};
    if (wordPos === multi.pos_end) return {anno: multi, role: 'end'};
    return {anno: multi, role: 'middle'};
  }
  return null;
}

// Get all annotations for a chapter, filtered by level (+ tapped words)
function getChapterAnnotations(annotations, bookName, chapNum, userLevel, tappedWords) {
  const book = annotations[bookName];
  if (!book) return [];
  const chap = book[String(chapNum)];
  if (!chap) return [];

  const seen = new Set();
  const result = [];
  Object.values(chap).forEach(verseAnns => {
    (verseAnns||[]).forEach(a => {
      if ((lvlIdx(a.level) > lvlIdx(userLevel) || (tappedWords && tappedWords.has(a.lemma))) && !seen.has(a.lemma)) {
        seen.add(a.lemma);
        result.push(a);
      }
    });
  });
  result.sort((a,b) => a.lemma.localeCompare(b.lemma));
  return result;
}

// Fallback: old vocab.json based lookup
function getChapterWordsOld(verses,vocab,userLevel){
  const seen=new Set(),result=[];
  verses.forEach(v=>v.text.split(/\s+/).forEach(w=>{
    const c=normalize(w),e=vocab[c];
    if(e&&lvlIdx(e.level)>lvlIdx(userLevel)&&!seen.has(c)){seen.add(c);result.push({word:c,...e})}
  }));
  result.sort((a,b)=>a.word.localeCompare(b.word));
  return result;
}

// ─── TTS ────────────────────────────────────────────────
function useTTS(){
  const [speaking,setSpeaking]=useState(false);
  const [activeVerse,setActiveVerse]=useState(null);
  const [activeWordIdx,setActiveWordIdx]=useState(-1);
  const [speed,setSpeedState]=useState(parseFloat(LS.get('tts-speed'))||0.85);
  const [voices,setVoices]=useState({en:[]});
  const langRef=useRef('en');
  const setLang=useCallback(l=>{langRef.current=l},[]);
  const queueRef=useRef([]);const stoppedRef=useRef(false);const speedRef=useRef(speed);
  const lastSentenceRef=useRef({text:'',lang:'en'});
  const setSpeed=useCallback(v=>{speedRef.current=v;setSpeedState(v);LS.set('tts-speed',v)},[]);
  useEffect(()=>{
    const lv=()=>{
      const all=speechSynthesis.getVoices();
      const en=all.filter(v=>v.lang.startsWith('en'));
      if(en.length)setVoices({en});
    };
    lv();speechSynthesis.onvoiceschanged=lv;setTimeout(lv,100);setTimeout(lv,500);
    return()=>{speechSynthesis.cancel()};
  },[]);
  const getVoice=useCallback((langOverride)=>{
    const ev=voices.en;
    for(const n of['Samantha','Alex','Daniel','Karen','Moira']){const v=ev.find(v=>v.name.includes(n));if(v)return v}
    return ev[0]||null;
  },[voices]);
  const speakText=useCallback((text,langOverride,rate)=>{
    return new Promise(resolve=>{
      speechSynthesis.cancel(); // iOS fix: prevent repeat bug
      const u=new SpeechSynthesisUtterance(text);
      u.lang='en-US';
      u.rate=rate??speedRef.current;
      const v=getVoice(langOverride);if(v)u.voice=v;
      let done=false;
      const finish=()=>{if(!done){done=true;resolve()}};
      u.onend=finish;u.onerror=finish;
      // Safety timeout: resolve even if onend/onerror never fires
      const maxMs=Math.max(Math.ceil(text.split(/\s+/).length/((rate??speedRef.current)||0.5))*1500,3000);
      setTimeout(finish,maxMs);
      speechSynthesis.speak(u);
    });
  },[getVoice]);
  const speakVerse=useCallback((vN,text,onDone,wordOffset=0)=>{
    const words=text.split(/\s+/),ws=[];let p=0;words.forEach(w=>{ws.push(p);p+=w.length+1});
    const u=new SpeechSynthesisUtterance(text);u.lang='en-US';u.rate=speedRef.current;
    const v=getVoice();if(v)u.voice=v;
    setActiveVerse(vN);setActiveWordIdx(wordOffset);setSpeaking(true);
    u.onboundary=e=>{if(e.name==='word'){let i=0;for(let j=ws.length-1;j>=0;j--){if(e.charIndex>=ws[j]){i=j;break}}setActiveWordIdx(i+wordOffset)}};
    u.onend=()=>{setActiveWordIdx(-1);if(onDone)onDone()};u.onerror=()=>{setActiveWordIdx(-1);if(onDone)onDone()};
    speechSynthesis.speak(u);
  },[getVoice]);
  const speakSingleVerse=useCallback((vN,text)=>{speechSynthesis.cancel();stoppedRef.current=false;queueRef.current=[];speakVerse(vN,text,()=>{setSpeaking(false);setActiveVerse(null);setActiveWordIdx(-1)})},[speakVerse]);
  const speakChapter=useCallback(verses=>{
    speechSynthesis.cancel();stoppedRef.current=false;queueRef.current=verses.slice(1);setSpeaking(true);
    const next=()=>{if(stoppedRef.current||!queueRef.current.length){setSpeaking(false);setActiveVerse(null);setActiveWordIdx(-1);return}
      setTimeout(()=>{if(stoppedRef.current)return;const n=queueRef.current.shift();const el=document.getElementById(`verse-${n.n}`);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});speakVerse(n.n,n.text,next,n.wordOffset||0)},2000)};
    const f=verses[0];const el=document.getElementById(`verse-${f.n}`);if(el)el.scrollIntoView({behavior:'smooth',block:'center'});speakVerse(f.n,f.text,next,f.wordOffset||0);
  },[speakVerse]);
  const stop=useCallback(()=>{stoppedRef.current=true;queueRef.current=[];speechSynthesis.cancel();setSpeaking(false);setActiveVerse(null);setActiveWordIdx(-1)},[]);
  const hasVoices=voices.en.length>0;
  return{speaking,activeVerse,activeWordIdx,speed,setSpeed,speakSingleVerse,speakChapter,speakText,lastSentenceRef,stop,hasVoices,setLang};
}

  const scrollTop=useCallback(()=>{

  useEffect(scrollTop,[bookIdx,chapIdx,phase,loading]);

  const hasAnnotations=hasAnno;

  const currentChapter=loadedBook?.chapters?.[chapIdx]||null;
  const chapNum=currentChapter?.number;
  const verses=currentChapter?.verses||[];

  const quizWords=useMemo(()=>{
    if(!currentChapter)return[];
    if(hasAnno){
      return getChapterAnnotations(annotations,bookName,chapNum,userLevel,tappedWords);
    }
    return getChapterWordsOld(verses,vocab,userLevel);
  },[currentChapter,hasAnno,annotations,bookName,chapNum,userLevel,tappedWords,verses,vocab]);

  const chapterKey=useCallback((bi,ci)=>`unk-${lang}-${bi}-${ci}`,[lang]);
  const saveChapterWords=useCallback((bi,ci,words)=>{LS.set(chapterKey(bi,ci),[...words])},[chapterKey]);

    const nr=books[bi].nr;
    setLoading(true);
    try{
      const[bk,an,de]=await Promise.all([fetchBook(nr),fetchAnno(nr),fetchDe(nr)]);
      setLoadedBook(bk);
      setBookAnnotations(an);
      setDeBook(de);
    }catch(e){setLoadedBook(null);setBookAnnotations(null);setDeBook(null);}
    setLoading(false);
    setPhase('quiz');
  },[tts,loadChapterWords,books]);
  const startReading=useCallback(()=>{setLearnedWords(new Set());setRevealedWords(new Set());setPhase('reading');(document.body.classList.contains('mode-phone')?document.querySelector('.phone-screen'):window).scrollTo(0,0)},[]);
  const goToNav=useCallback(()=>{tts.stop();setLoadedBook(null);setBookAnnotations(null);setPhase('nav');(document.body.classList.contains('mode-phone')?document.querySelector('.phone-screen'):window).scrollTo(0,0)},[tts]);
  const nextChapter=useCallback(()=>{if(chapIdx<(currentBook.numChapters||0)-1)openChapter(bookIdx,chapIdx+1);else if(bookIdx<books.length-1)openChapter(bookIdx+1,0)},[bookIdx,chapIdx,currentBook,books,openChapter]);
  const prevChapter=useCallback(()=>{if(chapIdx>0)openChapter(bookIdx,chapIdx-1);else if(bookIdx>0)openChapter(bookIdx-1,books[bookIdx-1].numChapters-1)},[bookIdx,chapIdx,books,openChapter]);

  const toggleUnknown=useCallback(w=>{setUnknownWords(p=>{const n=new Set(p);n.has(w)?n.delete(w):n.add(w);return n})},[]);
  const markLearned=useCallback(key=>{setLearnedWords(p=>new Set([...p,key]));setGlobalLearned(p=>new Set([...p,key]));setRevealedWords(p=>{const n=new Set(p);n.delete(key);return n})},[]);
  const unlearn=useCallback(key=>{setLearnedWords(p=>{const n=new Set(p);n.delete(key);return n});setGlobalLearned(p=>{const n=new Set(p);n.delete(key);return n})},[]);

  // Build practice fragments (short text pieces around unknown words)
  const buildFragments=useCallback(()=>{
    const useAnno=hasAnno;
    const MAX_SHORT=10,WINDOW=4;
    const fragments=[];
    verses.forEach(v=>{
      const allWords=v.text.split(/\s+/);
      const unknownPositions=[];
      if(useAnno){
        const chap=annotations[bookName]?.[String(chapNum)];
        const va=chap?.[String(v.n)];
        if(va){
          for(let p=0;p<allWords.length;p++){
            if(va.some(a=>a.pos!=null&&p>=a.pos&&p<=(a.pos_end??a.pos)&&(lvlIdx(a.level)>lvlIdx(userLevel)||tappedWords.has(a.lemma))&&unknownWords.has(a.lemma)&&!learnedWords.has(a.lemma)))unknownPositions.push(p);
          }
        }
      } else {
        allWords.forEach((w,p)=>{const c=normalize(w);if(unknownWords.has(c)&&!learnedWords.has(c))unknownPositions.push(p)});
      }
      if(!unknownPositions.length)return;
      const parts=v.text.split(/(?<=[.!?…»;:])\s+/);
      let wordPos=0;
      parts.forEach(sent=>{
        const sentWords=sent.split(/\s+/);
        const startPos=wordPos;
        const endPos=startPos+sentWords.length-1;
        const inSent=unknownPositions.filter(p=>p>=startPos&&p<=endPos);
        if(!inSent.length){wordPos+=sentWords.length;return}
        // Find word info for unknown words in this fragment
        const findWordInfos=(positions)=>{
          if(useAnno){
            const chap=annotations[bookName]?.[String(chapNum)];
            const va=chap?.[String(v.n)];
            if(!va)return[];
            return positions.map(p=>{const a=va.find(a=>a.pos!=null&&p>=a.pos&&p<=(a.pos_end??a.pos));return a?{form:a.form,lemma:a.lemma,de:a.de}:null}).filter(Boolean);
          }
          return positions.map(p=>{const c=normalize(allWords[p]);const e=vocab[c];return e?{form:allWords[p],lemma:c,de:e.de}:{form:allWords[p],lemma:c,de:''}}).filter(w=>w.de);
        };
        if(sentWords.length<=MAX_SHORT){
          fragments.push({n:v.n,text:sent,wordOffset:startPos,words:findWordInfos(inSent)});
        } else {
          const clauses=sent.split(/,\s*/);
          let clauseStart=startPos;
          let used=new Set();
          clauses.forEach(clause=>{
            const cWords=clause.split(/\s+/);
            const cEnd=clauseStart+cWords.length-1;
            const inClause=inSent.filter(p=>p>=clauseStart&&p<=cEnd);
            if(inClause.length&&!used.has(clause)){
              used.add(clause);
              if(cWords.length<=MAX_SHORT+4){
                fragments.push({n:v.n,text:clause,wordOffset:clauseStart,words:findWordInfos(inClause)});
              } else {
                inClause.forEach(p=>{
                  const lo=Math.max(startPos,p-WINDOW);
                  const hi=Math.min(startPos+allWords.length-1,p+WINDOW);
                  const slice=allWords.slice(lo,hi+1).join(' ');
                  fragments.push({n:v.n,text:slice,wordOffset:lo,words:findWordInfos([p])});
                });
              }
            }
            clauseStart+=cWords.length;
          });
        }
        wordPos+=sentWords.length;
      });
    });
    return fragments;
  },[hasAnno,verses,annotations,bookName,chapNum,userLevel,unknownWords,learnedWords,tappedWords]);

  // Practice mode state
  const [practiceFragments,setPracticeFragments]=useState([]);
  const [practiceIdx,setPracticeIdx]=useState(0);

  const practiceLearned=useCallback(()=>{

  const reveal=useCallback(key=>setRevealedWords(p=>new Set([...p,key])),[]);
  const hideReveal=useCallback(key=>setRevealedWords(p=>{const n=new Set(p);n.delete(key);return n}),[]);
  const tapWord=useCallback(lemma=>{
    setTappedWords(p=>{const n=new Set(p);if(n.has(lemma)){n.delete(lemma);setUnknownWords(u=>{const nu=new Set(u);nu.delete(lemma);return nu})}else{n.add(lemma);setUnknownWords(u=>new Set([...u,lemma]))}return n});
  },[]);

  const changeFontSize=useCallback(v=>{setFontSize(v);LS.set('bible-font-size',v)},[]);

  const langTitle='Bible';
  const langSubtitle='Reading Aid EN\u2009→\u2009DE';
  const langFooter='World English Bible · Public Domain';
  const otBooks=books.slice(0,ntStartIndex);
  const ntBooks=books.slice(ntStartIndex);

  const stats=preStats||{totalChapters:0,totalVerses:0,totalWords:0,annotatedBooks:0,allLemmas:0,lemmasByLevel:{},perBook:[]};

  // ── LEVEL TEST ──
  if(phase==='leveltest'){
    return <LevelTest onComplete={onLevelTestComplete}/>;
  }

  // ── TRAINING ──
  if(phase==='training'){
    return <Training userLevel={userLevel} onBack={()=>setPhase('nav')} books={books} openChapter={openChapter}/>;
  }

  // ── STATISTICS ──
  if(phase==='stats'){
    const levelOrder=["A1","A2","B1","B2","C1","C2"];
    return(<div>
      <header style={S.header}>
        <h1 style={S.title}>Statistics</h1>
      </header>
      <div style={S.navRow}><button onClick={()=>setPhase('nav')} style={S.navBtn}>← Back</button></div>
      <div style={S.settingsSection}>
        {statsVisible.text&&<div style={S.settingsGroup}>
          <div style={S.statSectionRow} onClick={()=>setExpandedStatSection(expandedStatSection==='text'?null:'text')}>
            <span style={S.bookArrow}>{expandedStatSection==='text'?'▾':'▸'}</span>
            <span style={{...S.settingsLabel,marginBottom:0}}>Text</span>
            <span style={S.statBookWords}>{books.length} books · {stats.totalWords.toLocaleString()} words</span>
          </div>
          {expandedStatSection==='text'&&<div style={S.statBookDetail}>
            <div style={S.statGrid}>
              <div style={S.statCell}><span style={S.statCellN}>{books.length}</span><span style={S.statCellL}>Books</span></div>
              <div style={S.statCell}><span style={S.statCellN}>{stats.totalChapters}</span><span style={S.statCellL}>Chapters</span></div>
              <div style={S.statCell}><span style={S.statCellN}>{stats.totalVerses.toLocaleString()}</span><span style={S.statCellL}>Verses</span></div>
              <div style={S.statCell}><span style={S.statCellN}>{stats.totalWords.toLocaleString()}</span><span style={S.statCellL}>Words</span></div>
            </div>
            <p style={S.settingsHint}>{stats.annotatedBooks} of {books.length} books have word-by-word annotations.</p>
          </div>}
        </div>}
        {statsVisible.vocabulary&&<>
          <div style={S.settingsGroup}>
            <div style={S.statSectionRow} onClick={()=>setExpandedStatSection(expandedStatSection==='vocab'?null:'vocab')}>

              <span style={{...S.settingsLabel,marginBottom:0}}>Vocabulary — Total</span>
              <span style={S.statBookWords}>{stats.allLemmas.toLocaleString()} unique words</span>
            </div>
            {expandedStatSection==='vocab'&&<div style={S.statBookDetail}>
              <div style={S.statCell}><span style={S.statCellN}>{stats.allLemmas.toLocaleString()}</span><span style={S.statCellL}>Unique words</span></div>
              <div style={{...S.statGrid,marginTop:12}}>
                {levelOrder.map(lvl=>stats.lemmasByLevel[lvl]?(<div key={lvl} style={S.statCell}><span style={S.statCellN}>{stats.lemmasByLevel[lvl]}</span><span style={S.statCellL}>{lvl}</span></div>):null)}
              </div>

          </div>

                    <div style={S.statCell}><span style={{...S.statCellN,color:'var(--t-blue)'}}>{bk.score}</span><span style={S.statCellL}>Difficulty ({bk.diffLabel})</span></div>
                  </div>
                  <div style={{...S.statGrid,marginTop:8}}>
                    {levelOrder.map(lvl=>bk.byLevel[lvl]?(<div key={lvl} style={S.statCell}><span style={S.statCellN}>{bk.byLevel[lvl]}</span><span style={S.statCellL}>{lvl}</span></div>):null)}

        </>}
        {statsVisible.progress&&<div style={S.settingsGroup}>
          <span style={S.settingsLabel}>Your progress</span>
          <div style={S.statGrid}>
            <div style={S.statCell}><span style={{...S.statCellN,color:'var(--t-green)'}}>{globalLearned.size}</span><span style={S.statCellL}>Words learned</span></div>
            <div style={S.statCell}><span style={S.statCellN}>{stats.allLemmas>0?Math.round((globalLearned.size/stats.allLemmas)*100):0}%</span><span style={S.statCellL}>of all lemmas</span></div>
          </div>
        </div>}
      </div>
    </div>);
  }

  // ── SETTINGS ──
  if(phase==='settings'){
    return(<div>
      <header style={S.header}>
        <h1 style={S.title}>Settings</h1>
      </header>
      <div style={S.navRow}><button onClick={()=>setPhase('nav')} style={S.navBtn}>← Back</button></div>
      <div style={S.settingsSection}>
        <div style={S.settingsGroup}>
          <span style={S.settingsLabel}>Vocabulary level</span>
          <div style={S.levelBtns}>{["A1","A2","B1","B2","C1"].map(l=>(<button key={l} onClick={()=>setUserLevel(l)} style={{...S.lvlBtn,...(userLevel===l?S.lvlActive:{})}}>{l}</button>))}</div>
          <p style={S.settingsHint}>Words above this level are shown in the vocabulary check.</p>
          <button onClick={()=>setPhase('leveltest')} style={{...S.navBtn,marginTop:8}}>Sprachtest wiederholen</button>
        </div>
        <div style={S.settingsGroup}>
          <span style={S.settingsLabel}>Reading speed (TTS)</span>
          <div style={S.speedPresets}>{[{l:'🐌',v:0.25},{l:'Slow',v:0.5},{l:'Normal',v:0.85},{l:'Fast',v:1.1}].map(p=>(
            <button key={p.v} onClick={()=>tts.setSpeed(p.v)} style={{...S.speedPresetBtn,...(Math.abs(tts.speed-p.v)<0.06?S.speedPresetActive:{})}}>{p.l}</button>
          ))}</div>
          <div style={S.speedSliderRow}>
            <input type="range" min="0.2" max="1.5" step="0.05" value={tts.speed} onChange={e=>tts.setSpeed(parseFloat(e.target.value))} style={S.speedSlider}/>
            <span style={S.speedValue}>{tts.speed.toFixed(2)}×</span>
          </div>
        </div>
        <div style={S.settingsGroup}>
          <span style={S.settingsLabel}>Font size</span>
          <div style={S.fontSizeRow}>
            <button onClick={()=>changeFontSize(Math.max(12,fontSize-2))} style={S.fontSizeBtn}>A−</button>
            <span style={S.fontSizePreview}>{fontSize}px</span>
            <button onClick={()=>changeFontSize(Math.min(30,fontSize+2))} style={S.fontSizeBtn}>A+</button>
          </div>
          <p style={{fontFamily:'var(--t-serif)',fontSize,lineHeight:1.8,color:'var(--t-title)',marginTop:8}}>In the beginning was the Word, and the Word was with God.</p>
        </div>
        <div style={S.settingsGroup}>
          <span style={S.settingsLabel}>Layout</span>
          <div style={S.levelBtns}>{[{k:'classic',l:'Klassisch'},{k:'icf-light',l:'Modern Hell'},{k:'icf',l:'Modern Dunkel'}].map(o=>(<button key={o.k} onClick={()=>changeLayout(o.k)} style={{...S.lvlBtn,...(layout===o.k?S.lvlActive:{})}}>{o.l}</button>))}</div>
        </div>
        <div style={S.settingsGroup}>
          <span style={S.settingsLabel}>Progress</span>
          <p style={{fontSize:14,color:'var(--t-text2)',fontFamily:sans,margin:'4px 0'}}>Total words learned: <strong style={{color:'var(--t-green)'}}>{globalLearned.size}</strong></p>
          <button onClick={()=>{if(confirm('Reset all learned words and progress?')){setGlobalLearned(new Set());setTappedWords(new Set());setUnknownWords(new Set());setLearnedWords(new Set())}}} style={S.resetBtn}>Reset all progress</button>
        </div>
        <div style={S.settingsGroup}>
          <span style={S.settingsLabel}>Statistics page</span>
          {[{key:'text',label:'Text (books, chapters, verses, words)'},{key:'vocabulary',label:'Vocabulary (lemmas by level)'},{key:'progress',label:'Your progress'}].map(s=>(
            <label key={s.key} style={S.toggleRow}>
              <input type="checkbox" checked={statsVisible[s.key]} onChange={()=>toggleStatSection(s.key)}/>
              <span style={S.toggleLabel}>{s.label}</span>
            </label>
          ))}
        </div>
        <p style={{fontSize:11,color:'var(--t-muted2)',fontFamily:sans,textAlign:'center',marginTop:24}}>v{APP_VERSION}</p>
      </div>
    </div>);
  }

  // ── NAV ──
  if(phase==='nav'){
    return(<div>
      <header style={S.header}>
        <h1 style={S.title}>{langTitle}</h1>
        <p style={S.subtitle}>{langSubtitle}</p>
        <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:12,margin:'8px 0'}}>
          <div style={S.levelBox}>
            <span style={S.levelLabel}>My level:</span>
            <div style={S.levelBtns}>{["A1","A2","B1","B2","C1"].map(l=>(<button key={l} onClick={()=>setUserLevel(l)} style={{...S.lvlBtn,...(userLevel===l?S.lvlActive:{})}}>{l}</button>))}</div>
          </div>
        </div>
        <div style={{display:'flex',justifyContent:'center',gap:12,marginTop:8}}>
          <button onClick={()=>setPhase('stats')} style={S.gearBtn} title="Statistics">📊</button>
          <button onClick={()=>setPhase('training')} style={S.gearBtn} title="Training">🎓</button>
          <button onClick={()=>setPhase('settings')} style={S.gearBtn} title="Settings">⚙</button>
        </div>
      </header>
      {otBooks.length>0&&<div style={S.bookList}>
        <h2 style={{...S.testamentHeader,cursor:'pointer',display:'flex',alignItems:'center',gap:8}} onClick={()=>{setExpandedTestament(expandedTestament==='ot'?null:'ot');setExpandedBook(null)}}>
          <span style={S.bookArrow}>{expandedTestament==='ot'?'▾':'▸'}</span>
          Old Testament
          <span style={{fontSize:13,fontWeight:400,color:'var(--t-muted)',marginLeft:'auto'}}>{otBooks.length} books</span>
        </h2>
        {expandedTestament==='ot'&&otBooks.map((book,i)=>{
          const bi=i;
          const isOpen=expandedBook===bi;
          return(<div key={bi} style={S.bookItem}>
            <div style={S.bookRow} onClick={()=>setExpandedBook(isOpen?null:bi)}>
              <span style={S.bookArrow}>{isOpen?'▾':'▸'}</span>
              <h3 style={S.bookName}>{book.name}</h3>
              <span style={S.bookChapCount}>{book.numChapters} ch.</span>
            </div>
            {isOpen&&<div style={S.chapGrid}>{Array.from({length:book.numChapters},(_,ci)=>(<button key={ci} onClick={()=>openChapter(bi,ci)} style={S.chapBtn}>{ci+1}</button>))}</div>}
          </div>);
        })}
      </div>}
      <div style={S.bookList}>
        <h2 style={{...S.testamentHeader,cursor:'pointer',display:'flex',alignItems:'center',gap:8}} onClick={()=>{setExpandedTestament(expandedTestament==='nt'?null:'nt');setExpandedBook(null)}}>
          <span style={S.bookArrow}>{expandedTestament==='nt'?'▾':'▸'}</span>
          New Testament
          <span style={{fontSize:13,fontWeight:400,color:'var(--t-muted)',marginLeft:'auto'}}>{ntBooks.length} books</span>
        </h2>
        {expandedTestament==='nt'&&ntBooks.map((book,i)=>{
          const bi=ntStartIndex+i;
          const isOpen=expandedBook===bi;
          return(<div key={bi} style={S.bookItem}>
            <div style={S.bookRow} onClick={()=>setExpandedBook(isOpen?null:bi)}>
              <span style={S.bookArrow}>{isOpen?'▾':'▸'}</span>
              <h3 style={S.bookName}>{book.name}</h3>
              <span style={S.bookChapCount}>{book.numChapters} ch.</span>
            </div>
            {isOpen&&<div style={S.chapGrid}>{Array.from({length:book.numChapters},(_,ci)=>(<button key={ci} onClick={()=>openChapter(bi,ci)} style={S.chapBtn}>{ci+1}</button>))}</div>}
          </div>);
        })}
      </div>
    </div>);
  }

  // ── LOADING ──
  if(loading){
    return(<div>
      <header style={S.header}>
        <h1 style={S.title}>{currentBook?.name||''}</h1>
        <p style={S.subtitle}>Loading…</p>
      </header>
      <div style={S.navRow}><button onClick={goToNav} style={S.navBtn}>← Books</button></div>
    </div>);
  }

  // ── QUIZ ──
  if(phase==='quiz'){
    return(<div>
      <header style={S.header}>
        <h1 style={S.title}>{currentBook.name}</h1>
      </header>
      <div style={S.navRow}><button onClick={goToNav} style={S.navBtn}>← Books</button></div>
      <p style={S.subtitle}>Chapter {chapNum} — Vocabulary Check</p>


      {quizWords.length===0?(
        <div style={S.quizInstr}><p style={S.quizInstrTitle}>No new vocabulary above {userLevel}</p><p style={S.quizInstrSub}>You can start reading directly.</p></div>
      ):(
        <div>
          <div style={S.quizInstr}>
            <p style={S.quizInstrTitle}>Which words don't you know?</p>
            <p style={S.quizInstrSub}>{quizWords.length} words above {userLevel}. Tap the unknown ones.</p>
            <div style={S.quizActions}>
              <button onClick={()=>setUnknownWords(new Set(quizWords.map(w=>w.lemma||w.word)))} style={S.quizActBtn}>Mark all</button>
              <button onClick={()=>setUnknownWords(new Set())} style={S.quizActBtn}>Mark none</button>
            </div>
          </div>
          <div style={S.wordGrid}>{quizWords.map(item=>{
            const key=item.lemma||item.word;
            const sel=unknownWords.has(key);
            return(<button key={key} onClick={()=>toggleUnknown(key)} style={{...S.wordCard,...(sel?S.wordCardSel:{})}}>
              <span style={S.wcFr}>{item.form&&item.form!==item.lemma?item.form:(item.lemma||item.word)}</span>
              {sel&&<span style={S.wcDe}>{item.de}</span>}
              {item.form&&item.form!==item.lemma&&<span style={S.wcForm}>({item.lemma||item.word})</span>}
              {sel&&item.level&&<span style={S.wcLevel}>{item.level}</span>}
            </button>);
          })}</div>
        </div>
      )}
      <div style={S.quizFooter}>
        <p style={S.quizSummary}>{unknownWords.size===0?'No words marked — pure reading flow!':`${unknownWords.size} words will be translated while reading.`}</p>
        <div style={{display:'flex',gap:12,justifyContent:'center',flexWrap:'wrap'}}>
          <button onClick={startReading} style={S.startBtn}>Read →</button>
        </div>
      </div>
    </div>);
  }

  // ── READING ──
  return(<div>
    <header style={S.header}>
      <h1 style={{...S.title,fontSize:22}}>{currentBook.name} {chapNum}</h1>
      <div style={S.readingTopBar}>
        <div style={S.readingNavBtns}>
          <button onClick={()=>{tts.stop();goToNav()}} style={S.navBtn}>≡ Books</button>
          <button onClick={()=>{tts.stop();setPhase('quiz')}} style={S.navBtn}>← Word list</button>
        </div>
      </div>
    </header>

    {/* TTS */}
    <div style={S.ttsBar}>
      {tts.speaking?(<button onClick={tts.stop} style={S.ttsStopBtn}>⏹ Stop</button>
      ):(<><button onClick={()=>tts.speakChapter(verses)} style={S.ttsPlayAllBtn} disabled={!tts.hasVoices}>▶ Read chapter aloud</button>
      {unknownWords.size>0&&(<button onClick={startPractice} style={{...S.ttsPlayAllBtn,background:'var(--t-accent)'}} disabled={!tts.hasVoices}>▶ Practice unknown words</button>)}
      </>)}
      <div style={S.speedControl}>
        <span style={S.speedLabel}>Speed:</span>
        <div style={S.speedPresets}>{[{l:'🐌',v:0.25},{l:'Langsam',v:0.5},{l:'Normal',v:0.85},{l:'Schnell',v:1.1}].map(p=>(
          <button key={p.v} onClick={()=>tts.setSpeed(p.v)} style={{...S.speedPresetBtn,...(Math.abs(tts.speed-p.v)<0.06?S.speedPresetActive:{})}}>{p.l}</button>
        ))}</div>
        <div style={S.speedSliderRow}>
          <input type="range" min="0.2" max="1.5" step="0.05" value={tts.speed} onChange={e=>tts.setSpeed(parseFloat(e.target.value))} style={S.speedSlider}/>
          <span style={S.speedValue}>{tts.speed.toFixed(2)}×</span>
        </div>
      </div>
    </div>

    {unknownWords.size>0&&(<div style={S.legend}>
      <span style={S.legItem}><span style={{...S.dot,background:'var(--t-accent)'}}/> tap = learned</span>
      <span style={S.legItem}><span style={{...S.dot,background:'var(--t-green)'}}/> tap = show again</span>
    </div>)}

    <div style={{...S.text,fontSize}}>{verses.map(verse=>{
      const isVA=tts.activeVerse===verse.n;
      let wordIdx=0;
      const useAnno=hasAnno;
      const deText=deBook?.chapters?.[String(chapNum)]?.[String(verse.n)];
      const showDe=showAllDe||expandedVerses.has(verse.n);

      return(<div key={verse.n} style={{display:'inline'}}>
        <span id={`verse-${verse.n}`} className={isVA?'verse-playing':''}>
        <sup style={{...S.vNum,...(deText?{cursor:'pointer',textDecoration:'underline'}:{})}} onClick={deText?()=>setExpandedVerses(p=>{const n=new Set(p);n.has(verse.n)?n.delete(verse.n):n.add(verse.n);return n}):undefined}>{verse.n}</sup>

        {verse.text.split(/(\s+)/).map((token,i)=>{
          if(/^\s+$/.test(token))return <span key={i}> </span>;
          const pos=wordIdx++;
          const hl=isVA&&pos===tts.activeWordIdx?'tts-highlight':'';

          if(useAnno){
            // Position-based annotation lookup (supports multi-word)
            const result=getAnnotation(annotations,bookName,chapNum,verse.n,pos);
            if(result){
              const anno=result.anno;
              const role=result.role; // 'single','start','middle','end'
              const key=anno.lemma;
              const isAboveLevel=lvlIdx(anno.level)>lvlIdx(userLevel);
              const isTapped=tappedWords.has(key);
              if(isAboveLevel||isTapped){
                const isUnknown=unknownWords.has(key);
                if(!isUnknown)return <span key={i} className={hl}>{token}</span>;
                const isL=learnedWords.has(key);
                const isR=revealedWords.has(key);
                const showTr=(role==='single'||role==='end'); // translation after last word
                const [word,punct]=splitPunct(token);
                if(!isL){
                  if(showTr)return(<span key={i}><span style={S.wg}><span className={hl}>{word}</span><span style={S.tr} onClick={()=>markLearned(key)} title={`${anno.lemma} (${anno.level})`}>{anno.de}</span></span>{punct}</span>);
                  return <span key={i} className={hl}>{token}</span>;
                }
                if(!isR)return <span key={i} className={hl} style={S.known} onClick={()=>unlearn(key)}>{token}</span>;
              }
              // Below-level word with annotation: clickable to add as unknown
              return <span key={i} className={hl} style={{cursor:'pointer'}} onClick={()=>tapWord(key)}>{token}</span>;
            }
            return <span key={i} className={hl}>{token}</span>;
          } else {
            // Fallback: vocab.json lookup
            const clean=normalize(token),entry=vocab[clean];
            if(!entry||!unknownWords.has(clean))return <span key={i} className={hl}>{token}</span>;
            const isL=learnedWords.has(clean),isR=revealedWords.has(clean);
            const [vw,vp]=splitPunct(token);
            if(!isL)return(<span key={i}><span style={S.wg}><span className={hl}>{vw}</span><span style={S.tr} onClick={()=>markLearned(clean)}>{entry.de}</span></span>{vp}</span>);
            if(!isR)return <span key={i} className={hl} style={S.known} onClick={()=>unlearn(clean)}>{token}</span>;
          }
        })}{' '}
      </span>
      {showDe&&deText&&<div style={{...S.deVerse,cursor:'pointer'}} onClick={()=>setDePrompt(showAllDe?'hide':'show')}>{deText}</div>}
      </div>);
    })}</div>

    <div style={S.chapNav}>
      <button onClick={prevChapter} style={{...S.chapNavBtn,...(bookIdx===0&&chapIdx===0?{opacity:0.3}:{})}} disabled={bookIdx===0&&chapIdx===0}>← Previous</button>
      <button onClick={nextChapter} style={{...S.chapNavBtn,...(bookIdx===books.length-1&&chapIdx===(currentBook.numChapters||0)-1?{opacity:0.3}:{})}} disabled={bookIdx===books.length-1&&chapIdx===(currentBook.numChapters||0)-1}>Next →</button>
    </div>
    <footer style={S.footer}>{langFooter} · Public Domain</footer>

    {dePrompt&&<div style={S.deOverlay} onClick={()=>setDePrompt(null)}>
      <div style={S.deDialog} onClick={e=>e.stopPropagation()}>
        <p style={S.deDialogText}>{dePrompt==='show'?'Alle Verse zweisprachig anzeigen?':'Alle deutschen Verse ausblenden?'}</p>
        <div style={S.deDialogBtns}>
          <button style={S.deDialogBtn} onClick={()=>{if(dePrompt==='show')setShowAllDe(true);else{setShowAllDe(false);setExpandedVerses(new Set())}setDePrompt(null)}}>Ja</button>
          <button style={{...S.deDialogBtn,...S.deDialogBtnCancel}} onClick={()=>setDePrompt(null)}>Nein</button>
        </div>
      </div>
    </div>}

    {/* Practice overlay */}
    {practiceActive&&(<div style={S.practiceOverlay}>
      <div style={S.practiceCard}>
        {practiceDone?(
          <div style={S.practiceContent}>
            <p style={S.practiceDoneText}>All words practiced!</p>
            <div style={S.practiceBtns}>
              <button onClick={startPractice} style={S.practiceRepeatBtn}>Practice again</button>
              <button onClick={closePractice} style={S.practiceCloseBtn}>Back to text</button>
            </div>
          </div>
        ):(
          <div style={S.practiceContent}>
            <p style={S.practiceCounter}>{practiceIdx+1} / {practiceFragments.length}</p>
            <p style={S.practiceText}>{(()=>{
              const f=practiceFragments[practiceIdx];if(!f)return'';
              const forms=new Set((f.words||[]).map(w=>w.form.toLowerCase()));
              return f.text.split(/(\s+)/).map((t,i)=>{
                if(/^\s+$/.test(t))return <span key={i}> </span>;
                const clean=t.replace(/[.,;:!?…»"')\]]+$/,'').replace(/^[«"'(\[]+/,'');
                if(forms.has(clean.toLowerCase()))return <span key={i} style={S.practiceHighlight}>{t}</span>;
                return <span key={i}>{t}</span>;
              });
            })()}</p>
            <div style={S.practiceWordInfo}>
              {(practiceFragments[practiceIdx]?.words||[]).map((w,i)=>(
                <div key={i} style={S.practiceWord}>
                  <span style={S.practiceWordDe}>{w.de}</span>
                  <span style={S.practiceWordLemma}>({w.lemma})</span>
                </div>
              ))}
            </div>
            <p style={S.practiceVerse}>Vers {practiceFragments[practiceIdx]?.n}</p>
            <div style={S.practiceBtns}>
              <button onClick={practiceRepeat} style={S.practiceRepeatBtn}>Repeat</button>
              <button onClick={practiceNext} style={S.practiceNextBtn}>Next</button>
              <button onClick={practiceLearned} style={S.practiceLearnedBtn}>Learned</button>
            </div>
            <button onClick={closePractice} style={S.practiceCancelBtn}>Cancel</button>
          </div>
        )}
        <button onClick={closePractice} style={S.practiceX}>✕</button>
      </div>
    </div>)}
  </div>);
}

  annoNote:{textAlign:'center',fontSize:13,color:'var(--t-blue)',fontFamily:sans,margin:'0 0 16px',padding:'8px 16px',background:'var(--t-blue-bg)',borderRadius:8,border:'1px solid var(--t-blue-border)'},

  lvlActive:{background:'var(--t-primary)',color:'var(--t-primary-text)',borderColor:'var(--t-primary)'},
  testamentHeader:{fontSize:18,fontWeight:600,color:'var(--t-text2)',fontFamily:sans,letterSpacing:'0.04em',textTransform:'uppercase',padding:'8px 0 4px',borderBottom:'2px solid var(--t-border)',marginBottom:4},
  bookList:{display:'flex',flexDirection:'column',gap:16},
  bookItem:{padding:'10px 16px',background:'var(--t-card)',borderRadius:10,border:'1px solid var(--t-border3)'},

  bookArrow:{fontSize:14,color:'var(--t-muted)',width:16,textAlign:'center',flexShrink:0},

  chapBtn:{width:36,height:32,border:'1px solid var(--t-border)',borderRadius:4,background:'var(--t-card-solid)',color:'var(--t-text2)',fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:sans,transition:'all 0.15s'},
  navRow:{display:'flex',justifyContent:'center',marginBottom:16},
  navBtn:{background:'none',border:'1px solid var(--t-border2)',borderRadius:5,padding:'4px 14px',fontSize:13,color:'var(--t-med)',cursor:'pointer',fontFamily:sans},
  readingTopBar:{display:'flex',flexDirection:'column',alignItems:'center',gap:10,marginTop:10},
  readingNavBtns:{display:'flex',gap:8},
  ttsBar:{display:'flex',flexWrap:'wrap',alignItems:'center',justifyContent:'center',gap:14,margin:'0 0 16px',padding:'14px 16px',background:'var(--t-tts-bg)',borderRadius:10,border:'1px solid var(--t-tts-border)'},
  ttsPlayAllBtn:{padding:'8px 20px',border:'none',borderRadius:6,background:'var(--t-primary)',color:'var(--t-primary-text)',fontSize:14,fontWeight:600,cursor:'pointer',fontFamily:sans,boxShadow:'0 1px 4px var(--t-card-shadow)'},
  ttsStopBtn:{padding:'8px 20px',border:'none',borderRadius:6,background:'var(--t-accent)',color:'var(--t-primary-text)',fontSize:14,fontWeight:600,cursor:'pointer',fontFamily:sans},
  speedControl:{display:'flex',flexDirection:'column',alignItems:'center',gap:6},
  speedLabel:{fontSize:12,color:'var(--t-med)',fontFamily:sans,fontWeight:600},
  speedPresets:{display:'flex',gap:4},
  speedPresetBtn:{padding:'4px 10px',border:'1.5px solid var(--t-border2)',borderRadius:5,background:'transparent',color:'var(--t-text2)',fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:sans,transition:'all 0.15s'},
  speedPresetActive:{background:'var(--t-primary)',color:'var(--t-primary-text)',borderColor:'var(--t-primary)'},

  if(!data.en.available)throw new Error('No bible data found');
  ReactDOM.createRoot(document.getElementById('root')).render(
    <App data={data}/>
  );
}).catch(err=>{
  document.getElementById('root').innerHTML=`<div style="text-align:center;margin-top:60px;color:#b34a28;font-family:sans-serif"><h2>Error loading data</h2><p>Did you run <code>start.command</code>?</p><p style="font-size:13px;color:#8a7e6b;margin-top:12px">${err.message}</p></div>`;
});
