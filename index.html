                <div style={{paddingLeft:16}}><span style={{color:'var(--t-green)',fontWeight:600}}>{bws.known}</span> {t('statKnown')}<span style={{marginLeft:12,color:'var(--t-muted)',fontSize:13}}>— {t('statOfWhichLearned')}: <span style={{color:'var(--t-green)'}}>{bws.learned}</span></span></div>
                <div style={{paddingLeft:16}}><span style={{color:'var(--t-accent)',fontWeight:600}}>{bws.unknown}</span> {t('statUnknown')}<span style={{marginLeft:12,color:'var(--t-muted)',fontSize:13}}>— {t('statOfWhichForgotten')}: <span style={{color:'var(--t-accent)'}}>{bws.forgotten}</span></span></div>
                <div><span style={{color:'var(--t-muted)',fontWeight:600}}>{bws.notSeen}</span> {t('statUnpracticed')}</div>
              </>:<p style={{fontSize:12,color:'var(--t-muted)',margin:0}}>{t('loadingStats')}</p>}
            </div>}
            {isOpen&&<div style={S.chapGrid}>{Array.from({length:book.numChapters},(_,ci)=>(<button key={ci} onClick={()=>openChapter(bi,ci)} style={{...S.chapBtn,...(ci===(typeof bm==='number'?bm:bm?.ch)?{border:'2px solid var(--t-accent)'}:{})}}>{ci+1}</button>))}</div>}
          </div>);
        })}
      </div>
    </div>);
  }

  // ── LOADING ──
  if(loading){
    return(<div>
      <header style={S.header}>
        <h1 style={S.title}>{currentBook?.name||''}</h1>
        <p style={S.subtitle}>{t('loading')}</p>
      </header>
      <div style={S.navRow}><button onClick={goToNav} style={S.navBtn}>{t('back')}</button></div>
    </div>);
  }

  // ── QUIZ (training only) ──
  if(phase==='quiz'){
    if(chapTrain&&chapTrain.retryPending){
      const wrongCount=chapTrain.retryPending.length;
      const correctCount=chapTrain.total-wrongCount;
      return(<div>
        <header style={S.header}><h1 style={S.title}>{t('result')}</h1></header>
        <div style={{textAlign:'center',padding:'20px 0'}}>
          <div style={{fontSize:48,fontWeight:700,color:correctCount>=chapTrain.total*0.85?'var(--t-green)':'var(--t-accent)',fontFamily:sans}}>{correctCount}/{chapTrain.total}</div>
          {chapTrain.units&&chapTrain.units.length>1&&<p style={{fontSize:14,color:'var(--t-muted)',fontFamily:sans,margin:'8px 0 4px'}}>{t('unitProgress').replace('{c}',chapTrain.unitIdx+1).replace('{t}',chapTrain.units.length)}</p>}
          <p style={{fontSize:16,color:'var(--t-text2)',fontFamily:sans,margin:'12px 0 24px'}}>{t('retryIntro')}</p>
          <button onClick={()=>chapTrainRetry(chapTrain.retryPending)} style={S.startBtn}>{t('next')}</button>
        </div>
      </div>);
    }
    if(chapTrain&&chapTrain.unitDone){
      const displayScore=chapTrain.firstPassScore!=null?chapTrain.firstPassScore:chapTrain.score;
      const hadRetry=chapTrain.firstPassScore!=null;
      return(<div>
        <header style={S.header}><h1 style={S.title}>{t('result')}</h1></header>
        <div style={{textAlign:'center',padding:'20px 0'}}>
          <div style={{fontSize:48,fontWeight:700,color:displayScore>=chapTrain.total*0.85?'var(--t-green)':'var(--t-accent)',fontFamily:sans}}>{displayScore}/{chapTrain.total}</div>
          <p style={{fontSize:14,color:'var(--t-muted)',fontFamily:sans,margin:'8px 0 2px'}}>{t('unitProgress').replace('{c}',chapTrain.unitIdx+1).replace('{t}',chapTrain.units.length)}</p>
          <p style={{fontSize:13,color:'var(--t-muted)',fontFamily:sans,margin:'0 0 4px'}}>{t('totalScore')}: {chapTrain.globalScore+displayScore}/{chapTrain.units.slice(0,chapTrain.unitIdx+1).reduce((s,u)=>s+u.length,0)}</p>
          {hadRetry
            ?<p style={{fontSize:16,color:'var(--t-green)',fontFamily:sans,margin:'12px 0 24px'}}>{t('allErrorsCorrected')}</p>
            :<p style={{fontSize:16,color:'var(--t-text2)',fontFamily:sans,margin:'12px 0 24px'}}>{displayScore>=chapTrain.total*0.85?t('wellDone'):t('keepPracticing')}</p>}

            <button onClick={repeatUnit} style={S.navBtn}>{t('repeat')}</button>
            <button onClick={startNextUnit} style={S.startBtn}>{t('next')}</button>
          </div>
        </div>
      </div>);
    }
    if(chapTrain&&chapTrain.done){
      const displayScore=chapTrain.firstPassScore!=null?chapTrain.firstPassScore:chapTrain.score;
      const hadRetry=chapTrain.firstPassScore!=null;
      const finalGlobalScore=chapTrain.globalScore+displayScore;
      const isMultiUnit=chapTrain.units&&chapTrain.units.length>1;
      const chapPreFam=chapTrain.preFam||{};
      const chapLearned=Object.entries(chapPreFam).filter(([k,pf])=>pf===0&&(wordData[k]?.familiarity||0)>0).length;
      const chapPracticed=Object.entries(chapPreFam).filter(([k,pf])=>pf===-1&&(wordData[k]?.familiarity||0)>0).length;
      return(<div>
        <header style={S.header}><h1 style={S.title}>{t('result')}</h1></header>
        <div style={{textAlign:'center',padding:'20px 0'}}>
          {isMultiUnit
            ?<div style={{fontSize:48,fontWeight:700,color:finalGlobalScore>=chapTrain.globalTotal*0.85?'var(--t-green)':'var(--t-accent)',fontFamily:sans}}>{finalGlobalScore}/{chapTrain.globalTotal}</div>
            :<div style={{fontSize:48,fontWeight:700,color:displayScore>=chapTrain.total*0.85?'var(--t-green)':'var(--t-accent)',fontFamily:sans}}>{displayScore}/{chapTrain.total}</div>}
          {isMultiUnit&&<p style={{fontSize:14,color:'var(--t-muted)',fontFamily:sans,margin:'8px 0 4px'}}>{t('unitProgress').replace('{c}',chapTrain.unitIdx+1).replace('{t}',chapTrain.units.length)}: {displayScore}/{chapTrain.total}</p>}
          {hadRetry
            ?<p style={{fontSize:16,color:'var(--t-green)',fontFamily:sans,margin:'12px 0 24px'}}>{t('allErrorsCorrected')}</p>
            :<p style={{fontSize:16,color:'var(--t-text2)',fontFamily:sans,margin:'12px 0 24px'}}>{(isMultiUnit?finalGlobalScore>=chapTrain.globalTotal*0.85:displayScore>=chapTrain.total*0.85)?t('wellDone'):t('keepPracticing')}</p>}
          {(chapLearned>0||chapPracticed>0)&&<p style={{fontSize:14,color:'var(--t-muted)',fontFamily:sans,margin:'-12px 0 16px'}}>
            {chapLearned>0&&<span style={{color:'var(--t-green)',marginRight:12}}>✓ {t('learnedN').replace('{n}',chapLearned)}</span>}
            {chapPracticed>0&&<span>{t('practicedN').replace('{n}',chapPracticed)}</span>}
          </p>}
          <div style={{display:'flex',gap:12,justifyContent:'center'}}>
            <button onClick={()=>{if(chapTrain.everWrong&&chapTrain.everWrong.length>0)setUnknownWords(u=>{const n=new Set(u);chapTrain.everWrong.forEach(k=>n.add(k));return n});setChapTrain(null);setPhase('reading');if(chapTrainFromBottom.current)setTimeout(()=>{const el=document.querySelector('.phone-screen');const target=el||window;target.scrollTo({top:el?el.scrollHeight:document.body.scrollHeight,behavior:'smooth'})},100)}} style={S.startBtn}>{t('finish')}</button>
            <button onClick={chapTrain.units&&chapTrain.units.length>1?repeatUnit:()=>startChapExercise(chapTrain.mode)} style={S.navBtn}>{t('repeat')}</button>
          </div>
        </div>
      </div>);
    }
    if(chapTrain){
      const ex=chapTrain.words[chapTrain.current];const opts=chapTrain.opts[chapTrain.current];
      const isCloze=!!ex.text;
      return(<div>
        <header style={S.header}>
          <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:8,margin:'0 0 4px'}}>
            <h1 style={{...S.title,margin:0}}>{t('chapPractice')}</h1>
            {isCloze&&<button onClick={()=>setClozeSettingsOpen(s=>!s)} style={{fontSize:22,lineHeight:1,background:'none',border:'none',cursor:'pointer',color:clozeSettingsOpen?'var(--t-accent)':'var(--t-muted)',padding:0}} title={t('clozeContext')}>⚙</button>}
          </div>
          {hasAnno&&<div style={{...S.levelBtns,justifyContent:'center',marginTop:6,marginBottom:2}}>
            <button onClick={()=>switchChapExercise('quiz')} style={{...S.lvlBtn,...(chapTrain.mode==='quiz'?S.lvlActive:{})}}>{t('exModeQuiz')}</button>
            <button onClick={()=>switchChapExercise('cloze')} style={{...S.lvlBtn,...(chapTrain.mode==='cloze'?S.lvlActive:{})}}>{t('exModeContext')}</button>
          </div>}
          {chapTrain.units&&chapTrain.units.length>1&&<p style={{fontSize:12,color:'var(--t-muted)',fontFamily:sans,margin:'0 0 2px'}}>{t('unitProgress').replace('{c}',chapTrain.unitIdx+1).replace('{t}',chapTrain.units.length)}</p>}
          <p style={{fontSize:14,color:'var(--t-muted)',fontFamily:sans}}>{chapTrain.current+1} / {chapTrain.words.length}</p>
        </header>
        {isCloze&&clozeSettingsOpen&&<div style={{maxWidth:400,margin:'0 auto 12px',padding:'8px 10px',border:'1px solid var(--t-border)',borderRadius:6,background:'var(--t-bg)'}}>
          <span style={{fontSize:12,fontWeight:600,color:'var(--t-title)',fontFamily:sans,display:'block',marginBottom:6}}>{t('clozeContext')}</span>

          <p style={S.settingsHint}>{t('clozeContextHint')}</p>
        </div>}
        <div style={{background:'var(--t-border)',borderRadius:4,height:6,margin:'0 0 20px',overflow:'hidden'}}>
          <div style={{height:'100%',background:'var(--t-primary)',borderRadius:4,transition:'width 0.3s',width:`${(chapTrain.current/chapTrain.words.length)*100}%`}}/>
        </div>
        {isCloze?(()=>{const parts=ex.text.split('___');return(<div>
          <div style={{fontFamily:'var(--t-serif)',fontSize:exFontSize(),lineHeight:2,color:'var(--t-title)',textAlign:'center',margin:'16px 0 8px'}}>
            {parts[0]}<span style={{display:'inline-block',padding:'0 4px',background:'var(--t-accent-bg)',borderRadius:4,fontWeight:700,color:'var(--t-accent)'}}>{ex.answer}</span>{parts[1]}
          </div>
          <p style={{fontSize:12,color:'var(--t-muted)',fontFamily:sans,textAlign:'center',margin:'0 0 6px'}}>{ex.ref}</p>
      <div style={{textAlign:'center',margin:'0 0 20px'}}><ExLevelTag en={ex.lemma}/></div>
        </div>)})()
        :<div style={{textAlign:'center',margin:'24px 0 32px'}}>
          <p style={{fontSize:13,color:'var(--t-muted)',fontFamily:sans,margin:'0 0 8px'}}>{t('whatMeans')}</p>
          <p style={{fontSize:28,fontWeight:700,color:'var(--t-title)',fontFamily:'var(--t-serif)',margin:0}}>{ex.form&&ex.form!==ex.lemma?ex.form:(ex.lemma||ex.word)}</p>
          {ex.form&&ex.form!==ex.lemma&&<p style={{fontSize:14,color:'var(--t-muted)',fontFamily:sans,margin:'4px 0 0'}}>({ex.lemma||ex.word})</p>}
          <ExLevelTag en={ex.lemma||ex.word}/>
        </div>}
        <div style={{display:'flex',flexDirection:'column',gap:10,maxWidth:400,margin:'0 auto'}}>
          {opts.map((opt,i)=>{
            let bg='var(--t-card-solid)',border='1.5px solid var(--t-border)',color='var(--t-text)',textDeco='none';
            if(chapTrain.selected!==null){
              if(opt===ex.de){bg='var(--t-green-bg)';border='1.5px solid var(--t-green)';color='var(--t-green)'}
              else if(opt===chapTrain.selected){bg='var(--t-accent-bg)';border='1.5px solid var(--t-accent)';color='var(--t-accent)';textDeco='line-through'}
            }
            return(<button key={i} onClick={()=>chapTrainPick(opt)} style={{padding:'14px 12px',border,borderRadius:10,background:bg,color,fontSize:17,fontWeight:600,cursor:chapTrain.selected===null?'pointer':'default',fontFamily:sans,textAlign:'center',transition:'all 0.2s',textDecoration:textDeco}}>{opt}</button>);
          })}
        </div>
        {isCloze&&chapTrain.selected!==null&&chapTrain.selected===ex.de&&<p style={{textAlign:'center',fontSize:14,color:'var(--t-muted)',fontFamily:sans,margin:'16px 0 0'}}>{ex.answer} = {ex.de}</p>}
        {chapTrain.selected!==null&&chapTrain.selected!==ex.de&&<div style={{textAlign:'center',margin:'16px 0 0'}}>
          {isCloze&&<p style={{fontSize:14,color:'var(--t-muted)',fontFamily:sans,margin:'0 0 4px'}}>{ex.answer} = {ex.de}</p>}
          <p style={{fontSize:16,fontWeight:600,color:'var(--t-accent)',fontFamily:sans,margin:'0 0 12px'}}>{t('wrong')}</p>
          {isCloze&&<MoreExamples lemma={ex.lemma} word={ex.answer}/>}
          <div style={{marginTop:12}}><button onClick={chapTrainAdvance} style={S.startBtn}>{t('next')}</button></div>
        </div>}
        <div style={{textAlign:'center',marginTop:24}}><button onClick={()=>{if(chapTrain.everWrong&&chapTrain.everWrong.length>0)setUnknownWords(u=>{const n=new Set(u);chapTrain.everWrong.forEach(k=>n.add(k));return n});setChapTrain(null);setPhase('reading');if(chapTrainFromBottom.current)setTimeout(()=>{const el=document.querySelector('.phone-screen');const target=el||window;target.scrollTo({top:el?el.scrollHeight:document.body.scrollHeight,behavior:'smooth'})},100)}} style={S.navBtn}>{t('cancel')}</button></div>
      </div>);
    }
    setPhase('reading');
    return null;
  }

  // ── READING ──
  const isPhoneSim=document.body.classList.contains('mode-phone');
  const barBase={position:'sticky',top:0,zIndex:100,background:'var(--t-card-solid)',borderBottom:'1px solid var(--t-border)',
    margin:isPhoneSim?'-36px -16px 0':'calc(-20px - env(safe-area-inset-top, 0px)) -24px 0',
    padding:isPhoneSim?'28px 16px 0':'env(safe-area-inset-top, 0px) 24px 0'};
  const barBtn={background:'none',border:'none',cursor:'pointer',padding:0,fontSize:24,color:'var(--t-muted)',display:'inline-flex',alignItems:'center',justifyContent:'center',width:35,height:35,boxSizing:'border-box'};
  return(<div style={{position:'relative'}}>
    <div style={barBase}>
      <div style={{display:'flex',alignItems:'center',justifyContent:'space-between',height:40,padding:'0 2px'}}>
        {chapPickerOpen
          ?<button onClick={()=>setChapPickerOpen(false)} style={{flex:1,fontSize:18,color:'var(--t-title)',fontFamily:sans,fontWeight:600,textAlign:'center',background:'none',border:'none',cursor:'pointer',padding:0,display:'inline-flex',alignItems:'center',justifyContent:'center',height:35}}>{currentBook.name} {chapNum} <span style={{fontSize:18,color:'var(--t-muted)',marginLeft:2}}>▴</span></button>
          :<>
        <button onClick={()=>{tts.stop();goToNav()}} style={{...barBtn,marginLeft:-8}} title={t('home')}><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style={{display:'block'}}><path d="M3 12L12 3l9 9"/><path d="M5 10v9a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1v-9"/></svg></button>
        <button onClick={()=>{setSearchOpen(s=>!s);setReadingMenu(false);setChapPickerOpen(false)}} style={barBtn} title={t('search')}><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" style={{display:'block'}}><circle cx="11" cy="11" r="6"/><line x1="16" y1="16" x2="21" y2="21"/></svg></button>
        <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',gap:0,overflow:'hidden'}}>
          <button onClick={prevChapter} style={{...barBtn,...(bookIdx===0&&chapIdx===0?{opacity:0.25}:{})}} disabled={bookIdx===0&&chapIdx===0} title={t('prevChapter')}><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{display:'block'}}><polyline points="15 18 9 12 15 6"/></svg></button>
          <button onClick={()=>{setChapPickerOpen(true);setSearchOpen(false);setReadingMenu(false)}} style={{fontSize:18,color:'var(--t-title)',fontFamily:sans,fontWeight:600,textAlign:'center',overflow:'hidden',whiteSpace:'nowrap',textOverflow:'ellipsis',background:'none',border:'none',cursor:'pointer',padding:0,display:'inline-flex',alignItems:'center',justifyContent:'center',height:35}}>{bookAbbr(currentBook.name)} {chapNum} <span style={{fontSize:18,color:'var(--t-muted)',marginLeft:2}}>▾</span></button>
          <button onClick={nextChapter} style={{...barBtn,...(bookIdx===books.length-1&&chapIdx===(currentBook.numChapters||0)-1?{opacity:0.25}:{})}} disabled={bookIdx===books.length-1&&chapIdx===(currentBook.numChapters||0)-1} title={t('nextChapter')}><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{display:'block'}}><polyline points="9 18 15 12 9 6"/></svg></button>
        </div>
        {tts.speaking
          ?<button onClick={tts.stop} style={{...barBtn,color:'var(--t-accent)'}} title={t('stopTTS')}><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style={{display:'block'}}><rect x="4" y="4" width="16" height="16" rx="2"/></svg></button>
          :<button onClick={()=>{const lv=tts.lastStoppedVerse.current;const startIdx=lv?verses.findIndex(v=>v.n===lv):0;tts.speakChapter(verses.slice(startIdx>=0?startIdx:0))}} style={barBtn} title={t('readAloud')} disabled={!tts.hasVoices}><svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor" style={{display:'block'}}><polygon points="6 4 20 12 6 20"/></svg></button>}
        <button onClick={()=>{setReadingMenu(m=>!m);setSearchOpen(false);setChapPickerOpen(false)}} style={{...barBtn,marginRight:-8}} title={t('menu')}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" style={{display:'block'}}><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg></button>
          </>}
      </div>
      {searchOpen&&<div style={{padding:'6px 0 8px'}} onClick={e=>e.stopPropagation()}>
        <form onSubmit={e=>{e.preventDefault();doSearch(searchQuery)}} style={{display:'flex',gap:6}}>
          <input value={searchQuery} onChange={e=>setSearchQuery(e.target.value)} placeholder={t('searchPlaceholder')} style={{flex:1,padding:'6px 10px',border:'1px solid var(--t-border)',borderRadius:6,fontSize:14,fontFamily:sans,background:'var(--t-bg)',color:'var(--t-text)'}} autoFocus/>
          <button type="submit" style={{...S.navBtn,padding:'6px 12px',margin:0}}>{t('search')}</button>
        </form>
        {searchLoading&&<p style={{fontSize:13,color:'var(--t-muted)',textAlign:'center',margin:'8px 0 0'}}>{t('searching')}</p>}
        {searchResults&&!searchLoading&&<div style={{maxHeight:300,overflowY:'auto',marginTop:8}}>
          {searchResults.length===0&&<p style={{fontSize:13,color:'var(--t-muted)',textAlign:'center',margin:0}}>{t('noResults')}</p>}
          {searchResults.length>0&&<p style={{fontSize:11,color:'var(--t-muted)',margin:'0 0 6px'}}>{t('nResults').replace('{n}',searchResults.length)}{searchResults.length>=100?' (max)':''}</p>}
          {searchResults.map((r,i)=>{
            const ql=searchQuery.toLowerCase();const idx=r.text.toLowerCase().indexOf(ql);
            const before=r.text.slice(Math.max(0,idx-30),idx);const match=r.text.slice(idx,idx+searchQuery.length);const after=r.text.slice(idx+searchQuery.length,idx+searchQuery.length+30);
            return(<div key={i} onClick={()=>{openChapter(r.bookIdx,r.chapIdx);setSearchOpen(false);setSearchResults(null);setTimeout(()=>{const el=document.getElementById('verse-'+r.verse);if(el)el.scrollIntoView({behavior:'smooth',block:'center'})},500)}} style={{padding:'6px 0',borderBottom:'1px solid var(--t-border)',cursor:'pointer',fontSize:13}}>

          })}
        </div>}

      {chapPickerOpen&&<div style={{padding:'8px 0 10px',maxHeight:'60vh',overflowY:'auto'}} onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',flexWrap:'wrap',gap:4,marginBottom:10}}>{Array.from({length:currentBook.numChapters},(_,ci)=>(<button key={ci} onClick={()=>{setChapPickerOpen(false);if(ci!==chapIdx)openChapter(bookIdx,ci)}} style={{...S.chapBtn,minWidth:36,...(ci===chapIdx?{border:'2px solid var(--t-accent)',fontWeight:700}:{})}}>{ci+1}</button>))}</div>

          <button onClick={()=>{const el=document.querySelector('.phone-screen');savedScrollRef.current=el?el.scrollTop:window.scrollY;setReadingMenu(false);prevPhaseRef.current=phase;setPhase('settings')}} style={{...S.gearBtn,fontSize:28}} title={t('settings')}>⚙</button>

          <button onClick={()=>{const el=document.querySelector('.phone-screen');savedScrollRef.current=el?el.scrollTop:window.scrollY;setReadingMenu(false);prevPhaseRef.current=phase;setPhase('training')}} style={S.gearBtn} title={t('training')}><img src="files/kopf2.jpg" style={{width:28,height:28,objectFit:'cover',borderRadius:'50%',verticalAlign:'middle'}}/></button>
        </div>
      </div>}
      {tts.speaking&&<div style={{padding:'6px 0 8px',borderTop:'1px solid var(--t-border)'}} onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:12,marginBottom:6}}>
          <button onClick={()=>{const now=Date.now();if(now-skipBackTapRef.current<400){skipBackTapRef.current=0;autoPlayRef.current=true;prevChapter()}else{skipBackTapRef.current=now;tts.speakChapter(verses)}}} style={barBtn} title="Restart chapter"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{display:'block'}}><line x1="5" y1="6" x2="5" y2="18"/><polyline points="17 18 9 12 17 6"/></svg></button>
          <button onClick={()=>tts.skipVerse(-1)} style={barBtn} title="Previous verse"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{display:'block'}}><polyline points="15 18 9 12 15 6"/></svg></button>
          <span style={{fontSize:13,color:'var(--t-muted)',fontFamily:sans,minWidth:24,textAlign:'center'}}>{tts.activeVerse||''}</span>
          <button onClick={()=>tts.skipVerse(1)} style={barBtn} title="Next verse"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{display:'block'}}><polyline points="9 18 15 12 9 6"/></svg></button>
          <button onClick={()=>{autoPlayRef.current=true;nextChapter()}} style={{...barBtn,...(bookIdx===books.length-1&&chapIdx===(currentBook.numChapters||0)-1?{opacity:0.25}:{})}} disabled={bookIdx===books.length-1&&chapIdx===(currentBook.numChapters||0)-1} title="Next chapter"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{display:'block'}}><polyline points="7 6 15 12 7 18"/><line x1="19" y1="6" x2="19" y2="18"/></svg></button>
        </div>
        <div style={S.speedControl}>
          <span style={S.speedLabel}>{t('speed')}</span>
          <div style={S.speedPresets}>{[{l:'🐌',v:0.2},{k:'slow',v:0.4},{k:'normal',v:0.65},{k:'fast',v:0.85},{k:'veryFast',v:1.0}].map(p=>(
            <button key={p.v} onClick={()=>tts.setSpeed(p.v)} style={{...S.speedPresetBtn,...(Math.abs(tts.speed-p.v)<0.06?S.speedPresetActive:{})}}>{p.l||t(p.k)}</button>
          ))}</div>
          <div style={S.speedSliderRow}>
            <input type="range" min="0.2" max="1.0" step="0.05" value={tts.speed} onChange={e=>tts.setSpeed(parseFloat(e.target.value))} style={S.speedSlider}/>
            <span style={S.speedValue}>{tts.speed.toFixed(2)}×</span>
          </div>
        </div>
      </div>}
    </div>


    {quizWords.length>0&&!tts.speaking&&<div style={{margin:'0 0 12px',border:'1px solid var(--t-border)',borderRadius:8,background:'var(--t-card-solid)',overflow:'hidden'}}>
      <div onClick={()=>setVocabPanelOpen(p=>!p)} style={{display:'flex',alignItems:'center',justifyContent:'space-between',padding:'10px 12px',cursor:'pointer'}}>
        <span style={{fontSize:14,fontWeight:600,color:'var(--t-title)',fontFamily:sans}}><span style={{fontSize:18}}>{vocabPanelOpen?'▾':'▸'}</span> {t('difficultWords')}</span>
        <span style={{fontSize:12,color:'var(--t-muted)',fontFamily:sans}}>{unknownWords.size}/{quizWords.length}</span>
      </div>
      {vocabPanelOpen&&<div style={{padding:'0 12px 12px'}}>
        <div style={{border:'1px solid var(--t-border)',borderRadius:6,marginBottom:8,overflow:'hidden'}}>
          <div onClick={()=>{setQuizExpanded(e=>!e);setVocabReviewIdx(0);setVocabSettingsOpen(false)}} style={{padding:'8px 10px',cursor:'pointer',background:'var(--t-bg)',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <span style={{fontSize:13,fontWeight:600,color:'var(--t-title)',fontFamily:sans}}><span style={{fontSize:18}}>{quizExpanded?'▾':'▸'}</span> {t('whichWords')}</span>
            <button onClick={e=>{e.stopPropagation();setVocabSettingsOpen(s=>!s)}} style={{background:'none',border:'none',cursor:'pointer',fontSize:16,color:vocabSettingsOpen?'var(--t-accent)':'var(--t-muted)',padding:0,lineHeight:1}} title={t('settings')}>⚙</button>
          </div>
          {vocabSettingsOpen&&<div style={{padding:'8px 10px',borderBottom:'1px solid var(--t-border)',background:'var(--t-bg)'}}>
            <label style={{...S.toggleRow,margin:0}}>
              <input type="checkbox" checked={showLemma} onChange={()=>{const v=!showLemma;setShowLemma(v);LS.set('bible-show-lemma',v)}}/>
              <span style={S.toggleLabel}>{t('showLemma')}</span>
            </label>
            <label style={{...S.toggleRow,margin:0}}>
              <input type="checkbox" checked={showCefrLevel} onChange={()=>{const v=!showCefrLevel;setShowCefrLevel(v);LS.set('bible-show-cefr',v)}}/>
              <span style={S.toggleLabel}>{t('showCefrLevel')}</span>
            </label>
          </div>}
          {quizExpanded&&<div style={{padding:'8px 10px'}}>
            {vocabReviewIdx<quizWords.length?(()=>{
              const item=quizWords[vocabReviewIdx];
              const key=item.lemma||item.word;
              return(<div>
                {vocabReviewIdx===0&&<p style={{fontSize:11,color:'var(--t-muted)',fontFamily:sans,margin:'0 0 10px',textAlign:'center'}}>{t('nWordsAbove').replace('{n}',quizWords.length).replace('{l}',stepLabel(userStep))} &#x2713;={t('vocabKnown')}, ?={t('vocabUnknown')}</p>}
                <div style={{background:'var(--t-border)',borderRadius:4,height:6,margin:'0 0 12px',overflow:'hidden'}}>
                  <div style={{height:'100%',background:'var(--t-primary)',borderRadius:4,transition:'width 0.3s',width:`${((vocabReviewIdx+1)/quizWords.length)*100}%`}}/>
                </div>
                <div style={{textAlign:'center',margin:'0 0 16px'}}>
                  <p style={{fontSize:24,fontWeight:700,color:'var(--t-title)',fontFamily:'var(--t-serif)',margin:'0 0 4px'}}>{item.form&&item.form!==item.lemma?item.form:(item.lemma||item.word)}</p>
                  {showLemma&&item.form&&item.form!==item.lemma&&<p style={{fontSize:13,color:'var(--t-muted)',fontFamily:sans,margin:'0 0 4px'}}>({item.lemma||item.word})</p>}
                  <p style={{fontSize:17,color:'var(--t-text)',fontFamily:sans,margin:0}}>{item.de}</p>
                  {showCefrLevel&&item.level&&<span style={{fontSize:11,color:'var(--t-muted)',fontFamily:sans}}>{item.level}</span>}
                </div>
                <div style={{display:'flex',gap:10,justifyContent:'center'}}>
                  <button onClick={()=>{trainWord(key,1);const nk=reviewKnownCount+1;setReviewKnownCount(nk);const next=vocabReviewIdx+1;const sinceBase=next-reviewCheckBase;if(sinceBase>=20&&!levelSuggestion&&nk/sinceBase>=0.85){if(userStep<SUBSTEPS.length-1)setLevelSuggestion(userStep+1)}setUnknownWords(u=>{const n=new Set(u);n.delete(key);return n});setVocabReviewIdx(next);setVocabSettingsOpen(false)}} style={{padding:'10px 20px',border:'1.5px solid var(--t-green)',borderRadius:8,background:'var(--t-green-bg)',color:'var(--t-green)',fontSize:24,cursor:'pointer',lineHeight:1}}>&#x2713;</button>
                  <button onClick={()=>{trainWord(key,0);const next=vocabReviewIdx+1;const sinceBase=next-reviewCheckBase;if(sinceBase>=20&&!levelSuggestion&&reviewKnownCount/sinceBase>=0.85){if(userStep<SUBSTEPS.length-1)setLevelSuggestion(userStep+1)}setUnknownWords(u=>new Set([...u,key]));setVocabReviewIdx(next);setVocabSettingsOpen(false)}} style={{padding:'10px 20px',border:'1.5px solid var(--t-accent)',borderRadius:8,background:'var(--t-accent-bg)',color:'var(--t-accent)',fontSize:24,cursor:'pointer',lineHeight:1}}>?</button>
                </div>
                {levelSuggestion&&<div style={{margin:'12px 0',padding:'12px',background:'var(--t-green-bg)',border:'1.5px solid var(--t-green)',borderRadius:8,textAlign:'center'}}>
                  <p style={{fontSize:13,color:'var(--t-text)',fontFamily:sans,margin:'0 0 10px'}}>{t('levelUpSuggest').replace('{l}',stepLabel(levelSuggestion))}</p>
                  <div style={{display:'flex',gap:8,justifyContent:'center'}}>
                    <button onClick={()=>{const reviewed=new Set(quizWords.slice(0,vocabReviewIdx).map(w=>w.lemma||w.word));const nl=hasAnno?getChapterAnnotations(annotations,bookName,chapNum,levelSuggestion,tappedWords):getChapterWordsOld(verses,vocab,levelSuggestion);const ni=nl.filter(w=>reviewed.has(w.lemma||w.word)).length;setUserStep(levelSuggestion);setLevelSuggestion(null);setReviewKnownCount(0);setReviewCheckBase(ni);setVocabReviewIdx(ni)}} style={{padding:'8px 14px',border:'none',borderRadius:6,background:'var(--t-green)',color:'#fff',fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:sans}}>{t('levelUpYes').replace('{l}',stepLabel(levelSuggestion))}</button>
                    <button onClick={()=>setLevelSuggestion(null)} style={{padding:'8px 14px',border:'1px solid var(--t-border)',borderRadius:6,background:'var(--t-card-solid)',color:'var(--t-text2)',fontSize:13,cursor:'pointer',fontFamily:sans}}>{t('levelUpNo').replace('{l}',stepLabel(userStep))}</button>
                  </div>
                </div>}
                <div style={{textAlign:'center',marginTop:12}}>
                  <button onClick={()=>setQuizExpanded(false)} style={{background:'none',border:'none',cursor:'pointer',fontSize:13,color:'var(--t-muted)',fontFamily:sans}}>{t('cancel')}</button>
                </div>
              </div>);
            })():<p style={{fontSize:13,color:'var(--t-muted)',fontFamily:sans,textAlign:'center',margin:0}}>{t('vocabDone').replace('{n}',quizWords.length)}</p>}
          </div>}
        </div>
        <div style={{border:'1px solid var(--t-border)',borderRadius:6,overflow:'hidden'}}>
          <div onClick={()=>setTrainExpanded(e=>!e)} style={{display:'flex',alignItems:'center',padding:'8px 10px',cursor:'pointer',background:'var(--t-bg)'}}>
            <span style={{fontSize:13,fontWeight:600,color:'var(--t-title)',fontFamily:sans}}><span style={{fontSize:18}}>{trainExpanded?'▾':'▸'}</span> {t('chapPractice')}</span>
          </div>
          {trainExpanded&&<div style={{padding:'8px 10px'}}>
            <p style={{fontSize:12,color:'var(--t-muted)',fontFamily:sans,margin:'0 0 8px'}}>{t('chapPracticeHint')}</p>
            <button onClick={()=>{prevPhaseRef.current='reading';chapTrainFromBottom.current=false;startChapExercise(exMode);setPhase('quiz')}} style={S.navBtn}>{t('startTraining')}</button>
          </div>}
        </div>
      </div>}
    </div>}

    <div style={{...S.text,fontSize}}>{(()=>{const trSize=fontSizeTr;return verses.map(verse=>{
      const isVA=tts.activeVerse===verse.n;
      let wordIdx=0;
      const useAnno=hasAnno;
      const deText=deBook?.chapters?.[String(chapNum)]?.[String(verse.n)];
      const showDe=showAllDe||expandedVerses.has(verse.n);

      return(<div key={verse.n} style={{display:'inline'}}>
        <span id={`verse-${verse.n}`} className={isVA?'verse-playing':''}>
        <sup style={{...S.vNum,...(deText?{cursor:'pointer',textDecoration:'underline'}:{})}} onClick={deText?()=>setExpandedVerses(p=>{const n=new Set(p);n.has(verse.n)?n.delete(verse.n):n.add(verse.n);return n}):undefined}>{verse.n}</sup>

        {verse.text.split(/(\s+)/).map((token,i)=>{
          if(/^\s+$/.test(token))return <span key={i}> </span>;
          const pos=wordIdx++;
          const hl=isVA&&pos===tts.activeWordIdx?'tts-highlight':'';

          if(useAnno){
            // Position-based annotation lookup (supports multi-word)
            const result=getAnnotation(annotations,bookName,chapNum,verse.n,pos);
            if(result){
              const anno=result.anno;
              const role=result.role; // 'single','start','middle','end'
              const key=anno.lemma;
              const isPhrase=anno.pos_end!=null;
              const isAboveLevel=annoStep(anno.level,anno.lemma)>userStep;
              const isTapped=tappedWords.has(key);
              if(isAboveLevel||isTapped){
                const isUnknown=unknownWords.has(key)||(!reviewDone&&isAboveLevel);
                if(!isUnknown)return <span key={i} className={hl} style={{cursor:'pointer'}} onClick={()=>setUnknownWords(u=>new Set([...u,key]))}>{token}</span>;
                const isL=learnedWords.has(key);
                const isR=revealedWords.has(key);
                const showTr=(role==='single'||role==='end'); // translation after last word
                const [word,punct]=splitPunct(token);
                if(!isL){
                  const phr=isPhrase&&!showTr?S.phraseWord:null;
                  const sgl=isPhrase?result.single:null;
                  const pwExp=sgl&&expandedPhraseWords.has(`${verse.n}_${pos}`);
                  if(showTr){const phE=isPhrase?S.phraseWord:null;return(<span key={i}><span style={S.wg}><span className={hl} style={{...phE,...(sgl&&!pwExp?{cursor:'pointer'}:{})}} onClick={sgl&&!pwExp?()=>togglePhraseWord(verse.n,pos):undefined}>{word}</span>{pwExp?<span style={{...S.tr,fontSize:trSize,cursor:'pointer'}} onClick={()=>togglePhraseWord(verse.n,pos)} title={`${sgl.lemma} (${sgl.level})`}>{sgl.de}</span>:null}<span style={{...S.tr,fontSize:trSize}} onClick={()=>markLearned(key)} title={`${anno.lemma} (${anno.level})`}>{anno.de}</span></span>{punct}</span>)}
                  if(sgl){return(<span key={i}><span style={S.wg}><span className={hl} style={{...phr,...(!pwExp?{cursor:'pointer'}:{})}} onClick={!pwExp?()=>togglePhraseWord(verse.n,pos):undefined}>{word}</span>{pwExp?<span style={{...S.tr,fontSize:trSize,cursor:'pointer'}} onClick={()=>togglePhraseWord(verse.n,pos)} title={`${sgl.lemma} (${sgl.level})`}>{sgl.de}</span>:null}</span>{punct}</span>)}
                  return(<span key={i}><span style={S.wg}><span className={hl} style={phr}>{word}</span></span>{punct}</span>);
                }
                if(!isR)return <span key={i} className={hl} style={S.known} onClick={()=>unlearn(key)}>{token}</span>;
                return <span key={i} className={hl} style={{cursor:'pointer'}} onClick={()=>{setLearnedWords(p=>{const n=new Set(p);n.delete(key);return n});setRevealedWords(p=>{const n=new Set(p);n.delete(key);return n})}}>{token}</span>;
              }
              // Below-level word with annotation: clickable to add as unknown
              return <span key={i} className={hl} style={{cursor:'pointer'}} onClick={()=>tapWord(key)}>{token}</span>;
            }
            return <span key={i} className={hl}>{token}</span>;
          } else {
            // Fallback: vocab.json lookup
            const clean=normalize(token),entry=vocab[clean];
            if(!entry||!unknownWords.has(clean))return <span key={i} className={hl}>{token}</span>;
            const isL=learnedWords.has(clean),isR=revealedWords.has(clean);
            const [vw,vp]=splitPunct(token);
            if(!isL)return(<span key={i}><span style={S.wg}><span className={hl}>{vw}</span><span style={{...S.tr,fontSize:trSize}} onClick={()=>markLearned(clean)}>{entry.de}</span></span>{vp}</span>);
            if(!isR)return <span key={i} className={hl} style={S.known} onClick={()=>unlearn(clean)}>{token}</span>;
            return <span key={i} className={hl} style={{cursor:'pointer'}} onClick={()=>{setLearnedWords(p=>{const n=new Set(p);n.delete(clean);return n});setRevealedWords(p=>{const n=new Set(p);n.delete(clean);return n})}}>{token}</span>;
          }
        })}{' '}
      </span>
      {showDe&&deText&&<div style={{...S.deVerse,fontSize:trSize,cursor:'pointer'}} onClick={()=>setDePrompt(showAllDe?'hide':'show')}>{deText}</div>}
      </div>);
    })})()}</div>

    {quizWords.length>0&&<div style={{textAlign:'center',marginTop:24,paddingBottom:12,borderBottom:'1px solid var(--t-border)'}}>
      <button onClick={()=>{prevPhaseRef.current='reading';chapTrainFromBottom.current=true;startChapExercise(exMode);setPhase('quiz')}} style={{background:'none',border:'none',cursor:'pointer',fontSize:14,fontFamily:sans,color:'var(--t-accent)',fontWeight:600,padding:'8px 0'}}>{t('trainDifficultAgain')}</button>
    </div>}
    <div style={S.chapNav}>
      <button onClick={prevChapter} style={{...S.chapNavBtn,...(bookIdx===0&&chapIdx===0?{opacity:0.3}:{})}} disabled={bookIdx===0&&chapIdx===0}><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{display:'block'}}><polyline points="15 18 9 12 15 6"/></svg></button>
      <button onClick={nextChapter} style={{...S.chapNavBtn,...(bookIdx===books.length-1&&chapIdx===(currentBook.numChapters||0)-1?{opacity:0.3}:{})}} disabled={bookIdx===books.length-1&&chapIdx===(currentBook.numChapters||0)-1}><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{display:'block'}}><polyline points="9 18 15 12 9 6"/></svg></button>
    </div>
    <footer style={S.footer}>{langFooter} · {t('publicDomain')}</footer>

    {dePrompt&&<div style={S.deOverlay} onClick={()=>setDePrompt(null)}>
      <div style={S.deDialog} onClick={e=>e.stopPropagation()}>
        <p style={S.deDialogText}>{dePrompt==='show'?t('showAllBilingual'):t('hideAllGerman')}</p>
        <div style={S.deDialogBtns}>
          <button style={S.deDialogBtn} onClick={()=>{if(dePrompt==='show')setShowAllDe(true);else{setShowAllDe(false);setExpandedVerses(new Set())}setDePrompt(null)}}>{t('yes')}</button>
          <button style={{...S.deDialogBtn,...S.deDialogBtnCancel}} onClick={()=>setDePrompt(null)}>{t('no')}</button>
        </div>
      </div>
    </div>}

    {/* Practice overlay */}
    {practiceActive&&(<div style={S.practiceOverlay}>
      <div style={S.practiceCard}>
        {practiceDone?(
          <div style={S.practiceContent}>
            <p style={S.practiceDoneText}>{t('allPracticed')}</p>
            <div style={S.practiceBtns}>
              <button onClick={startPractice} style={S.practiceRepeatBtn}>{t('practiceAgain')}</button>
              <button onClick={closePractice} style={S.practiceCloseBtn}>{t('backToText')}</button>
            </div>
          </div>
        ):(
          <div style={S.practiceContent}>
            <p style={S.practiceCounter}>{practiceIdx+1} / {practiceFragments.length}</p>
            <p style={S.practiceText}>{(()=>{
              const f=practiceFragments[practiceIdx];if(!f)return'';
              const forms=new Set((f.words||[]).map(w=>w.form.toLowerCase()));
              return f.text.split(/(\s+)/).map((t,i)=>{
                if(/^\s+$/.test(t))return <span key={i}> </span>;
                const clean=t.replace(/[.,;:!?…»"')\]]+$/,'').replace(/^[«"'(\[]+/,'');
                if(forms.has(clean.toLowerCase()))return <span key={i} style={S.practiceHighlight}>{t}</span>;
                return <span key={i}>{t}</span>;
              });
            })()}</p>
            <div style={S.practiceWordInfo}>
              {(practiceFragments[practiceIdx]?.words||[]).map((w,i)=>(
                <div key={i} style={S.practiceWord}>
                  <span style={S.practiceWordDe}>{w.de}</span>
                  <span style={S.practiceWordLemma}>({w.lemma})</span>
                </div>
              ))}
            </div>
            <p style={S.practiceVerse}>{t('verseN').replace('{n}',practiceFragments[practiceIdx]?.n)}</p>
            <div style={S.practiceBtns}>
              <button onClick={practiceRepeat} style={S.practiceRepeatBtn}>{t('repeat')}</button>
              <button onClick={practiceNext} style={S.practiceNextBtn}>{t('next')}</button>
              <button onClick={practiceLearned} style={S.practiceLearnedBtn}>{t('learned')}</button>
            </div>
            <button onClick={closePractice} style={S.practiceCancelBtn}>{t('cancel')}</button>
          </div>
        )}
        <button onClick={closePractice} style={S.practiceX}>✕</button>
      </div>
    </div>)}
  </div>);
}

// ─── Styles ─────────────────────────────────────────────
const S={
  header:{textAlign:'center',marginBottom:20,paddingBottom:16,borderBottom:'1px solid var(--t-border)'},
  title:{fontSize:28,fontWeight:400,letterSpacing:'0.04em',margin:'0 0 4px',color:'var(--t-title)',fontVariant:'small-caps',fontFamily:sans},
  subtitle:{fontSize:18,fontWeight:600,color:'var(--t-title)',margin:'12px 0 4px',textAlign:'center',fontFamily:sans},
  annoBadge:{display:'inline-block',marginLeft:8,padding:'2px 8px',background:'var(--t-blue)',color:'#fff',borderRadius:10,fontSize:11,fontWeight:700,fontFamily:sans,verticalAlign:'middle'},
  annoNote:{textAlign:'center',fontSize:13,color:'var(--t-blue)',fontFamily:sans,margin:'0 0 16px',padding:'8px 16px',background:'var(--t-blue-bg)',borderRadius:8,border:'1px solid var(--t-blue-border)'},
  levelBox:{display:'flex',flexDirection:'column',alignItems:'center',gap:6,margin:'8px 0',padding:'10px 16px',background:'var(--t-level-bg)',borderRadius:8},
  levelLabel:{fontSize:13,fontWeight:600,color:'var(--t-text2)',letterSpacing:'0.04em',textTransform:'uppercase',fontFamily:sans},
  levelBtns:{display:'flex',gap:6},
  lvlBtn:{padding:'5px 14px',border:'1.5px solid var(--t-border2)',borderRadius:6,background:'transparent',color:'var(--t-text2)',fontSize:14,fontWeight:600,cursor:'pointer',fontFamily:sans,transition:'all 0.2s'},
  lvlActive:{background:'var(--t-primary)',color:'var(--t-primary-text)',borderColor:'var(--t-primary)'},
  testamentHeader:{fontSize:18,fontWeight:600,color:'var(--t-text2)',fontFamily:sans,letterSpacing:'0.04em',textTransform:'uppercase',padding:'8px 0 4px',borderBottom:'2px solid var(--t-border)',marginBottom:4},
  bookList:{display:'flex',flexDirection:'column',gap:16},
  bookItem:{padding:'10px 16px',background:'var(--t-card)',borderRadius:10,border:'1px solid var(--t-border3)'},
  bookRow:{display:'flex',alignItems:'center',gap:8,cursor:'pointer',userSelect:'none'},
  bookArrow:{fontSize:14,color:'var(--t-muted)',width:16,textAlign:'center',flexShrink:0},
  bookName:{fontSize:16,fontWeight:600,color:'var(--t-title)',margin:0,fontFamily:sans},
  bookChapCount:{fontSize:12,color:'var(--t-muted2)',fontFamily:sans,marginLeft:'auto',flexShrink:0},
  chapGrid:{display:'flex',flexWrap:'wrap',gap:4,marginTop:10},
  bmBtn:{fontSize:11,fontFamily:sans,color:'var(--t-accent)',background:'none',border:'1px solid var(--t-accent)',borderRadius:4,padding:'2px 8px',cursor:'pointer',marginLeft:8,flexShrink:0,whiteSpace:'nowrap'},
  chapBtn:{width:36,height:32,border:'1px solid var(--t-border)',borderRadius:4,background:'var(--t-card-solid)',color:'var(--t-text2)',fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:sans,transition:'all 0.15s'},
  navRow:{display:'flex',justifyContent:'center',marginBottom:16},
  navBtn:{background:'none',border:'1px solid var(--t-border2)',borderRadius:5,padding:'4px 14px',fontSize:13,color:'var(--t-med)',cursor:'pointer',fontFamily:sans},
  readingTopBar:{display:'flex',flexDirection:'column',alignItems:'center',gap:10,marginTop:10},

loadData().then(data=>{
  if(!data.en.available)throw new Error('No bible data found');
  ReactDOM.createRoot(document.getElementById('root')).render(
    <App data={data}/>
  );
}).catch(err=>{
  document.getElementById('root').innerHTML=`<div style="text-align:center;margin-top:60px;color:#b34a28;font-family:sans-serif"><h2>${t('errorLoading')}</h2><p>${t('errorHint')}</p><p style="font-size:13px;color:#8a7e6b;margin-top:12px">${err.message}</p></div>`;
});
