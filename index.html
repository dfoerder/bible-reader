        <button onClick={()=>{tts.stop();goToNav()}} style={{...barBtn,marginLeft:-8}} title={t('home')}><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" strokeLinejoin="round" style={{display:'block'}}><path d="M3 12L12 3l9 9"/><path d="M5 10v9a1 1 0 001 1h4v-5h4v5h4a1 1 0 001-1v-9"/></svg></button>

        <div style={{flex:1,display:'flex',alignItems:'center',justifyContent:'center',gap:0,overflow:'hidden'}}>
          <button onClick={prevChapter} style={{...barBtn,...(bookIdx===0&&chapIdx===0?{opacity:0.25}:{})}} disabled={bookIdx===0&&chapIdx===0} title={t('prevChapter')}><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{display:'block'}}><polyline points="15 18 9 12 15 6"/></svg></button>

          <button onClick={nextChapter} style={{...barBtn,...(bookIdx===books.length-1&&chapIdx===(currentBook.numChapters||0)-1?{opacity:0.25}:{})}} disabled={bookIdx===books.length-1&&chapIdx===(currentBook.numChapters||0)-1} title={t('nextChapter')}><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{display:'block'}}><polyline points="9 18 15 12 9 6"/></svg></button>
        </div>
        {tts.speaking

        <button onClick={()=>{setReadingMenu(m=>!m);setSearchOpen(false);setChapPickerOpen(false)}} style={{...barBtn,marginRight:-8}} title={t('menu')}><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.2" strokeLinecap="round" style={{display:'block'}}><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg></button>
          </>}
      </div>
      {searchOpen&&<div style={{padding:'6px 0 8px'}} onClick={e=>e.stopPropagation()}>

          {trainingActive&&<button onClick={()=>{const el=document.querySelector('.phone-screen');savedScrollRef.current=el?el.scrollTop:window.scrollY;setReadingMenu(false);prevPhaseRef.current=phase;setPhase('training')}} style={S.gearBtn} title={t('training')}><img src="files/kopf2.jpg" style={{width:28,height:28,objectFit:'cover',borderRadius:'50%',verticalAlign:'middle'}}/></button>}
        </div>
      </div>}
      {tts.speaking&&<div style={{padding:'6px 0 8px',borderTop:'1px solid var(--t-border)'}} onClick={e=>e.stopPropagation()}>
        <div style={{display:'flex',alignItems:'center',justifyContent:'center',gap:12,marginBottom:6}}>
          <button onClick={()=>{const now=Date.now();if(now-skipBackTapRef.current<400){skipBackTapRef.current=0;autoPlayRef.current=true;prevChapter()}else{skipBackTapRef.current=now;tts.speakChapter(verses)}}} style={barBtn} title="Restart chapter"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{display:'block'}}><line x1="5" y1="6" x2="5" y2="18"/><polyline points="17 18 9 12 17 6"/></svg></button>
          <button onClick={()=>tts.skipVerse(-1)} style={barBtn} title="Previous verse"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{display:'block'}}><polyline points="15 18 9 12 15 6"/></svg></button>
          <span style={{fontSize:13,color:'var(--t-muted)',fontFamily:sans,minWidth:24,textAlign:'center'}}>{tts.activeVerse||''}</span>
          <button onClick={()=>tts.skipVerse(1)} style={barBtn} title="Next verse"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{display:'block'}}><polyline points="9 18 15 12 9 6"/></svg></button>
          <button onClick={()=>{autoPlayRef.current=true;nextChapter()}} style={{...barBtn,...(bookIdx===books.length-1&&chapIdx===(currentBook.numChapters||0)-1?{opacity:0.25}:{})}} disabled={bookIdx===books.length-1&&chapIdx===(currentBook.numChapters||0)-1} title="Next chapter"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{display:'block'}}><polyline points="7 6 15 12 7 18"/><line x1="19" y1="6" x2="19" y2="18"/></svg></button>
        </div>
        <div style={S.speedControl}>

            <button key={p.v} onClick={()=>tts.setSpeed(p.v)} style={{...S.speedPresetBtn,...(Math.abs(tts.speed-p.v)<0.06?S.speedPresetActive:{})}}>{p.l||t(p.k)}</button>

          </div>
        </div>
      </div>}
    </div>


    {!tts.speaking&&<div style={{margin:'0 0 12px',border:'1px solid var(--t-border)',borderRadius:8,background:'var(--t-card-solid)',overflow:'hidden'}}>
      <div style={{display:'flex',alignItems:'stretch',borderBottom:chapTab?'1px solid var(--t-border)':'none'}}>
        {[{k:'stats',ic:'📊',lb:t('statistics')},...(trainingActive?[{k:'training',ic:null,lb:t('training')}]:[]),{k:'settings',ic:'⚙',lb:t('settings')}].map(tab=>{

      {chapTab==='stats'&&<div style={{padding:'12px'}}>

            <div style={S.statCell}><span style={{...S.statCellN,color:'var(--t-accent)'}}>{chapWordStats.forgotten}</span><span style={S.statCellL}>{t('statForgotten')}</span></div>

      {chapTab==='settings'&&<div style={{padding:'12px',display:'flex',flexDirection:'column',gap:18}}>
        <div>
          <span style={S.settingsLabel}>{t('fontSize')}</span>

            <span style={{fontSize:13,fontWeight:600,color:'var(--t-title)',fontFamily:sans}}>{t('fsBibleText')}</span>
            <div style={{...S.fontSizeRow,marginTop:6}}>
              <button onClick={()=>changeFontSize(Math.max(12,fontSize-2))} style={S.fontSizeBtn}>A−</button>
              <span style={S.fontSizePreview}>{fontSize}px</span>
              <button onClick={()=>changeFontSize(Math.min(30,fontSize+2))} style={S.fontSizeBtn}>A+</button>
            </div>
            <span style={{fontSize:13,fontWeight:600,color:'var(--t-title)',fontFamily:sans,display:'block',marginTop:10}}>{t('lineSpacing')}</span>
            <div style={{...S.fontSizeRow,marginTop:6}}>
              <button onClick={()=>changeLineHeight(Math.max(1.2,lineHeight-0.2))} style={S.fontSizeBtn}>−</button>

          <div style={{marginTop:12}}>
            <span style={{fontSize:13,fontWeight:600,color:'var(--t-title)',fontFamily:sans}}>{t('helperBible')}</span>
            <div style={{...S.fontSizeRow,marginTop:6}}>
              <button onClick={()=>changeFontSizeTr(Math.max(10,fontSizeTr-2))} style={S.fontSizeBtn}>A−</button>
              <span style={S.fontSizePreview}>{fontSizeTr}px</span>
              <button onClick={()=>changeFontSizeTr(Math.min(26,fontSizeTr+2))} style={S.fontSizeBtn}>A+</button>
            </div>
            <span style={{fontSize:13,fontWeight:600,color:'var(--t-title)',fontFamily:sans,display:'block',marginTop:10}}>{t('lineSpacing')}</span>
            <div style={{...S.fontSizeRow,marginTop:6}}>
              <button onClick={()=>changeLineHeightTr(Math.max(1.2,lineHeightTr-0.2))} style={S.fontSizeBtn}>−</button>
              <span style={S.fontSizePreview}>{lineHeightTr.toFixed(1)}</span>

        <div>
          <span style={S.settingsLabel}>{t('layout')}</span>
          <div style={S.levelBtns}>{[{k:'classic',i:'layoutClassic'},{k:'icf-light',i:'layoutModernLight'},{k:'icf',i:'layoutModernDark'}].map(o=>(<button key={o.k} onClick={()=>changeLayout(o.k)} style={{...S.lvlBtn,...(layout===o.k?S.lvlActive:{})}}>{t(o.i)}</button>))}</div>
        </div>
        <div>
          <span style={S.settingsLabel}>{t('germanTranslation')}</span>
          <div style={S.levelBtns}>{Object.values(BIBLES).filter(b=>b.id!==INSTANCE.id).map(b=>(<button key={b.id} onClick={()=>changeDeTrans(b.id)} style={{...S.lvlBtn,...(deTrans===b.id?S.lvlActive:{})}}>{b.label}</button>))}</div>
          <label style={{...S.toggleRow,marginTop:8}}>
            <input type="checkbox" checked={showAllDe} onChange={()=>changeShowAllDe(!showAllDe)}/>
            <span style={S.toggleLabel}>{t('showAllDeVerses')}</span>
          </label>
        </div>
        <div>
          <span style={S.settingsLabel}>{t('wordTranslations')}</span>
          <label style={{...S.toggleRow,marginTop:6}}>
            <input type="checkbox" checked={autoTranslate} onChange={()=>{const v=!autoTranslate;setAutoTranslate(v);LS.set('bible-auto-translate',v)}}/>
            <span style={S.toggleLabel}>{t('autoShowTranslations')}</span>
          </label>
          <p style={S.settingsHint}>{t('autoShowTranslationsHint')}</p>
        </div>
        <div>
          <span style={S.settingsLabel}>{t('readingSpeed')}</span>
          <div style={S.speedPresets}>{[{l:'🐌',v:0.2},{k:'slow',v:0.4},{k:'normal',v:0.65},{k:'fast',v:0.85},{k:'veryFast',v:1.0}].map(p=>(
            <button key={p.v} onClick={()=>tts.setSpeed(p.v)} style={{...S.speedPresetBtn,...(Math.abs(tts.speed-p.v)<0.06?S.speedPresetActive:{})}}>{p.l||t(p.k)}</button>
          ))}</div>
          <div style={S.speedSliderRow}>
            <input type="range" min="0.2" max="1.0" step="0.05" value={tts.speed} onChange={e=>tts.setSpeed(parseFloat(e.target.value))} style={S.speedSlider}/>
            <span style={S.speedValue}>{tts.speed.toFixed(2)}×</span>
          </div>
        </div>
      </div>}
      {chapTab==='training'&&(quizWords.length>0?<div style={{padding:'12px'}}>
        <div style={{border:'1px solid var(--t-border)',borderRadius:6,marginBottom:8,overflow:'hidden'}}>
          <div onClick={()=>{setQuizExpanded(e=>!e);setVocabReviewIdx(0);setVocabSettingsOpen(false)}} style={{padding:'8px 10px',cursor:'pointer',background:'var(--t-bg)',display:'flex',alignItems:'center',justifyContent:'space-between'}}>
            <span style={{fontSize:13,fontWeight:600,color:'var(--t-title)',fontFamily:sans}}><span style={{fontSize:18}}>{quizExpanded?'▾':'▸'}</span> {t('whichWords')}</span>
            <button onClick={e=>{e.stopPropagation();setVocabSettingsOpen(s=>!s)}} style={{background:'none',border:'none',cursor:'pointer',fontSize:16,color:vocabSettingsOpen?'var(--t-accent)':'var(--t-muted)',padding:0,lineHeight:1}} title={t('settings')}>⚙</button>
          </div>
          {vocabSettingsOpen&&<div style={{padding:'8px 10px',borderBottom:'1px solid var(--t-border)',background:'var(--t-bg)'}}>
            <label style={{...S.toggleRow,margin:0}}>
              <input type="checkbox" checked={showLemma} onChange={()=>{const v=!showLemma;setShowLemma(v);LS.set('bible-show-lemma',v)}}/>
              <span style={S.toggleLabel}>{t('showLemma')}</span>
            </label>
            <label style={{...S.toggleRow,margin:0}}>
              <input type="checkbox" checked={showCefrLevel} onChange={()=>{const v=!showCefrLevel;setShowCefrLevel(v);LS.set('bible-show-cefr',v)}}/>
              <span style={S.toggleLabel}>{t('showCefrLevel')}</span>
            </label>
          </div>}
          {quizExpanded&&<div style={{padding:'8px 10px'}}>
            {vocabReviewIdx<quizWords.length?(()=>{
              const item=quizWords[vocabReviewIdx];
              const key=item.lemma||item.word;
              return(<div>
                {vocabReviewIdx===0&&<p style={{fontSize:11,color:'var(--t-muted)',fontFamily:sans,margin:'0 0 10px',textAlign:'center'}}>{t('nWordsAbove').replace('{n}',quizWords.length).replace('{l}',stepLabel(userStep))} &#x2713;={t('vocabKnown')}, ?={t('vocabUnknown')}</p>}
                <div style={{background:'var(--t-border)',borderRadius:4,height:6,margin:'0 0 12px',overflow:'hidden'}}>
                  <div style={{height:'100%',background:'var(--t-primary)',borderRadius:4,transition:'width 0.3s',width:`${((vocabReviewIdx+1)/quizWords.length)*100}%`}}/>
                </div>
                <div style={{textAlign:'center',margin:'0 0 16px'}}>
                  <p style={{fontSize:24,fontWeight:700,color:'var(--t-title)',fontFamily:'var(--t-serif)',margin:'0 0 4px'}}>{item.form&&item.form!==item.lemma?item.form:(item.lemma||item.word)}</p>
                  {showLemma&&item.form&&item.form!==item.lemma&&<p style={{fontSize:13,color:'var(--t-muted)',fontFamily:sans,margin:'0 0 4px'}}>({item.lemma||item.word})</p>}
                  <p style={{fontSize:17,color:'var(--t-text)',fontFamily:sans,margin:0}}>{item.de}</p>
                  {showCefrLevel&&item.level&&<span style={{fontSize:11,color:'var(--t-muted)',fontFamily:sans}}>{item.level}</span>}
                </div>
                <div style={{display:'flex',gap:10,justifyContent:'center'}}>
                  <button onClick={()=>{trainWord(key,1);const nk=reviewKnownCount+1;setReviewKnownCount(nk);const next=vocabReviewIdx+1;const sinceBase=next-reviewCheckBase;if(sinceBase>=20&&!levelSuggestion&&nk/sinceBase>=0.85){if(userStep<SUBSTEPS.length-1)setLevelSuggestion(userStep+1)}setUnknownWords(u=>{const n=new Set(u);n.delete(key);return n});setVocabReviewIdx(next);setVocabSettingsOpen(false)}} style={{padding:'10px 20px',border:'1.5px solid var(--t-green)',borderRadius:8,background:'var(--t-green-bg)',color:'var(--t-green)',fontSize:24,cursor:'pointer',lineHeight:1}}>&#x2713;</button>
                  <button onClick={()=>{trainWord(key,0);const next=vocabReviewIdx+1;const sinceBase=next-reviewCheckBase;if(sinceBase>=20&&!levelSuggestion&&reviewKnownCount/sinceBase>=0.85){if(userStep<SUBSTEPS.length-1)setLevelSuggestion(userStep+1)}setUnknownWords(u=>new Set([...u,key]));setVocabReviewIdx(next);setVocabSettingsOpen(false)}} style={{padding:'10px 20px',border:'1.5px solid var(--t-accent)',borderRadius:8,background:'var(--t-accent-bg)',color:'var(--t-accent)',fontSize:24,cursor:'pointer',lineHeight:1}}>?</button>
                </div>
                {levelSuggestion&&<div style={{margin:'12px 0',padding:'12px',background:'var(--t-green-bg)',border:'1.5px solid var(--t-green)',borderRadius:8,textAlign:'center'}}>
                  <p style={{fontSize:13,color:'var(--t-text)',fontFamily:sans,margin:'0 0 10px'}}>{t('levelUpSuggest').replace('{l}',stepLabel(levelSuggestion))}</p>
                  <div style={{display:'flex',gap:8,justifyContent:'center'}}>
                    <button onClick={()=>{const reviewed=new Set(quizWords.slice(0,vocabReviewIdx).map(w=>w.lemma||w.word));const nl=hasAnno?getChapterAnnotations(annotations,bookName,chapNum,levelSuggestion,tappedWords):getChapterWordsOld(verses,vocab,levelSuggestion);const ni=nl.filter(w=>reviewed.has(w.lemma||w.word)).length;setUserStep(levelSuggestion);setLevelSuggestion(null);setReviewKnownCount(0);setReviewCheckBase(ni);setVocabReviewIdx(ni)}} style={{padding:'8px 14px',border:'none',borderRadius:6,background:'var(--t-green)',color:'#fff',fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:sans}}>{t('levelUpYes').replace('{l}',stepLabel(levelSuggestion))}</button>
                    <button onClick={()=>setLevelSuggestion(null)} style={{padding:'8px 14px',border:'1px solid var(--t-border)',borderRadius:6,background:'var(--t-card-solid)',color:'var(--t-text2)',fontSize:13,cursor:'pointer',fontFamily:sans}}>{t('levelUpNo').replace('{l}',stepLabel(userStep))}</button>
                  </div>
                </div>}
                <div style={{textAlign:'center',marginTop:12}}>
                  <button onClick={()=>setQuizExpanded(false)} style={{background:'none',border:'none',cursor:'pointer',fontSize:13,color:'var(--t-muted)',fontFamily:sans}}>{t('cancel')}</button>
                </div>
              </div>);
            })():<p style={{fontSize:13,color:'var(--t-muted)',fontFamily:sans,textAlign:'center',margin:0}}>{t('vocabDone').replace('{n}',quizWords.length)}</p>}
          </div>}
        </div>
        <div style={{border:'1px solid var(--t-border)',borderRadius:6,overflow:'hidden'}}>
          <div onClick={()=>setTrainExpanded(e=>!e)} style={{display:'flex',alignItems:'center',padding:'8px 10px',cursor:'pointer',background:'var(--t-bg)'}}>
            <span style={{fontSize:13,fontWeight:600,color:'var(--t-title)',fontFamily:sans}}><span style={{fontSize:18}}>{trainExpanded?'▾':'▸'}</span> {t('chapPractice')}</span>
          </div>
          {trainExpanded&&<div style={{padding:'8px 10px'}}>
            <p style={{fontSize:12,color:'var(--t-muted)',fontFamily:sans,margin:'0 0 8px'}}>{t('chapPracticeHint')}</p>
            <button onClick={()=>{prevPhaseRef.current='reading';chapTrainFromBottom.current=false;startChapExercise(exMode);setPhase('quiz')}} style={S.navBtn}>{t('startTraining')}</button>
          </div>}
        </div>
      </div>:<div style={{padding:'16px 12px',textAlign:'center'}}><p style={{fontSize:13,color:'var(--t-muted)',fontFamily:sans,margin:0}}>{t('chapNoDifficult')}</p></div>)}
    </div>}

    <div style={{...S.text,fontSize,lineHeight}}>{(()=>{const deSize=fontSizeTr,pillSize=fontSizePill;return verses.map(verse=>{
      const isVA=tts.activeVerse===verse.n;
      let wordIdx=0;
      const useAnno=hasAnno;
      const deText=deBook?.chapters?.[String(chapNum)]?.[String(verse.n)];
      const showDe=showAllDe||expandedVerses.has(verse.n);

      return(<div key={verse.n} style={{display:'inline'}}>
        <span id={`verse-${verse.n}`} className={isVA?'verse-playing':''}>
        <sup style={{...S.vNum,...(deText?{cursor:'pointer',textDecoration:'underline'}:{})}} onClick={deText?()=>setExpandedVerses(p=>{const n=new Set(p);n.has(verse.n)?n.delete(verse.n):n.add(verse.n);return n}):undefined}>{verse.n}</sup>

        {verse.text.split(/(\s+)/).map((token,i)=>{
          if(/^\s+$/.test(token))return <span key={i}> </span>;
          const pos=wordIdx++;
          const hl=isVA&&pos===tts.activeWordIdx?'tts-highlight':'';

          if(useAnno){
            // Position-based annotation lookup (supports multi-word)
            const result=getAnnotation(annotations,bookName,chapNum,verse.n,pos);
            if(result){
              const anno=result.anno;
              const role=result.role; // 'single','start','middle','end'
              const key=anno.lemma;
              const isPhrase=anno.pos_end!=null;
              const isAboveLevel=annoStep(anno.level,anno.lemma)>userStep;
              const isTapped=tappedWords.has(key);
              if(isAboveLevel||isTapped){
                const isUnknown=unknownWords.has(key)||(!reviewDone&&isAboveLevel&&autoTranslate);
                if(!isUnknown)return <span key={i} className={hl} style={{cursor:'pointer'}} onClick={()=>setUnknownWords(u=>new Set([...u,key]))}>{token}</span>;
                const isL=learnedWords.has(key);
                const isR=revealedWords.has(key);
                const showTr=(role==='single'||role==='end'); // translation after last word
                const [word,punct]=splitPunct(token);
                if(!isL){
                  const phr=isPhrase&&!showTr?S.phraseWord:null;
                  const sgl=isPhrase?result.single:null;
                  const pwExp=sgl&&expandedPhraseWords.has(`${verse.n}_${pos}`);
                  if(showTr){const phE=isPhrase?S.phraseWord:null;return(<span key={i}><span style={S.wg}><span className={hl} style={{...phE,...(sgl&&!pwExp?{cursor:'pointer'}:{})}} onClick={sgl&&!pwExp?()=>togglePhraseWord(verse.n,pos):undefined}>{word}</span>{pwExp?<span style={{...S.tr,fontSize:pillSize,cursor:'pointer'}} onClick={()=>togglePhraseWord(verse.n,pos)} title={`${sgl.lemma} (${sgl.level})`}>{sgl.de}</span>:null}<span style={{...S.tr,fontSize:pillSize}} onClick={()=>markLearned(key)} title={`${anno.lemma} (${anno.level})`}>{anno.de}</span></span>{punct}</span>)}
                  if(sgl){return(<span key={i}><span style={S.wg}><span className={hl} style={{...phr,...(!pwExp?{cursor:'pointer'}:{})}} onClick={!pwExp?()=>togglePhraseWord(verse.n,pos):undefined}>{word}</span>{pwExp?<span style={{...S.tr,fontSize:pillSize,cursor:'pointer'}} onClick={()=>togglePhraseWord(verse.n,pos)} title={`${sgl.lemma} (${sgl.level})`}>{sgl.de}</span>:null}</span>{punct}</span>)}
                  return(<span key={i}><span style={S.wg}><span className={hl} style={phr}>{word}</span></span>{punct}</span>);
                }
                if(!isR)return <span key={i} className={hl} style={S.known} onClick={()=>unlearn(key)}>{token}</span>;
                return <span key={i} className={hl} style={{cursor:'pointer'}} onClick={()=>{setLearnedWords(p=>{const n=new Set(p);n.delete(key);return n});setRevealedWords(p=>{const n=new Set(p);n.delete(key);return n})}}>{token}</span>;
              }
              // Below-level word with annotation: clickable to add as unknown
              return <span key={i} className={hl} style={{cursor:'pointer'}} onClick={()=>tapWord(key)}>{token}</span>;
            }
            return <span key={i} className={hl}>{token}</span>;
          } else {
            // Fallback: vocab.json lookup
            const clean=normalize(token),entry=vocab[clean];
            if(!entry||!unknownWords.has(clean))return <span key={i} className={hl}>{token}</span>;
            const isL=learnedWords.has(clean),isR=revealedWords.has(clean);
            const [vw,vp]=splitPunct(token);
            if(!isL)return(<span key={i}><span style={S.wg}><span className={hl}>{vw}</span><span style={{...S.tr,fontSize:pillSize}} onClick={()=>markLearned(clean)}>{entry.de}</span></span>{vp}</span>);
            if(!isR)return <span key={i} className={hl} style={S.known} onClick={()=>unlearn(clean)}>{token}</span>;
            return <span key={i} className={hl} style={{cursor:'pointer'}} onClick={()=>{setLearnedWords(p=>{const n=new Set(p);n.delete(clean);return n});setRevealedWords(p=>{const n=new Set(p);n.delete(clean);return n})}}>{token}</span>;
          }
        })}{' '}
      </span>
      {showDe&&deText&&<div style={{...S.deVerse,fontSize:deSize,lineHeight:lineHeightTr,cursor:'pointer'}} onClick={()=>setDePrompt(showAllDe?'hide':'show')}>{deText}</div>}
      </div>);
    })})()}</div>

    {quizWords.length>0&&<div style={{textAlign:'center',marginTop:24,paddingBottom:12,borderBottom:'1px solid var(--t-border)'}}>
      <button onClick={()=>{prevPhaseRef.current='reading';chapTrainFromBottom.current=true;startChapExercise(exMode);setPhase('quiz')}} style={{background:'none',border:'none',cursor:'pointer',fontSize:14,fontFamily:sans,color:'var(--t-accent)',fontWeight:600,padding:'8px 0'}}>{t('trainDifficultAgain')}</button>
    </div>}
    <div style={S.chapNav}>
      <button onClick={prevChapter} style={{...S.chapNavBtn,...(bookIdx===0&&chapIdx===0?{opacity:0.3}:{})}} disabled={bookIdx===0&&chapIdx===0}><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{display:'block'}}><polyline points="15 18 9 12 15 6"/></svg></button>
      <button onClick={nextChapter} style={{...S.chapNavBtn,...(bookIdx===books.length-1&&chapIdx===(currentBook.numChapters||0)-1?{opacity:0.3}:{})}} disabled={bookIdx===books.length-1&&chapIdx===(currentBook.numChapters||0)-1}><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" style={{display:'block'}}><polyline points="9 18 15 12 9 6"/></svg></button>
    </div>
    <footer style={S.footer}>{langFooter} · {t('publicDomain')}</footer>

    {dePrompt&&<div style={S.deOverlay} onClick={()=>setDePrompt(null)}>
      <div style={S.deDialog} onClick={e=>e.stopPropagation()}>
        <p style={S.deDialogText}>{dePrompt==='show'?t('showAllBilingual'):t('hideAllGerman')}</p>
        <div style={S.deDialogBtns}>
          <button style={S.deDialogBtn} onClick={()=>{changeShowAllDe(dePrompt==='show');setDePrompt(null)}}>{t('yes')}</button>
          <button style={{...S.deDialogBtn,...S.deDialogBtnCancel}} onClick={()=>setDePrompt(null)}>{t('no')}</button>
        </div>
      </div>
    </div>}

    {/* Practice overlay */}
    {practiceActive&&(<div style={S.practiceOverlay}>
      <div style={S.practiceCard}>
        {practiceDone?(
          <div style={S.practiceContent}>
            <p style={S.practiceDoneText}>{t('allPracticed')}</p>
            <div style={S.practiceBtns}>
              <button onClick={startPractice} style={S.practiceRepeatBtn}>{t('practiceAgain')}</button>
              <button onClick={closePractice} style={S.practiceCloseBtn}>{t('backToText')}</button>
            </div>
          </div>
        ):(
          <div style={S.practiceContent}>
            <p style={S.practiceCounter}>{practiceIdx+1} / {practiceFragments.length}</p>
            <p style={S.practiceText}>{(()=>{
              const f=practiceFragments[practiceIdx];if(!f)return'';
              const forms=new Set((f.words||[]).map(w=>w.form.toLowerCase()));
              return f.text.split(/(\s+)/).map((t,i)=>{
                if(/^\s+$/.test(t))return <span key={i}> </span>;
                const clean=t.replace(/[.,;:!?…»"')\]]+$/,'').replace(/^[«"'(\[]+/,'');
                if(forms.has(clean.toLowerCase()))return <span key={i} style={S.practiceHighlight}>{t}</span>;
                return <span key={i}>{t}</span>;
              });
            })()}</p>
            <div style={S.practiceWordInfo}>
              {(practiceFragments[practiceIdx]?.words||[]).map((w,i)=>(
                <div key={i} style={S.practiceWord}>
                  <span style={S.practiceWordDe}>{w.de}</span>
                  <span style={S.practiceWordLemma}>({w.lemma})</span>
                </div>
              ))}
            </div>
            <p style={S.practiceVerse}>{t('verseN').replace('{n}',practiceFragments[practiceIdx]?.n)}</p>
            <div style={S.practiceBtns}>
              <button onClick={practiceRepeat} style={S.practiceRepeatBtn}>{t('repeat')}</button>
              <button onClick={practiceNext} style={S.practiceNextBtn}>{t('next')}</button>
              <button onClick={practiceLearned} style={S.practiceLearnedBtn}>{t('learned')}</button>
            </div>
            <button onClick={closePractice} style={S.practiceCancelBtn}>{t('cancel')}</button>
          </div>
        )}
        <button onClick={closePractice} style={S.practiceX}>✕</button>
      </div>
    </div>)}
  </div>);
}

const S={
  header:{textAlign:'center',marginBottom:20,paddingBottom:16,borderBottom:'1px solid var(--t-border)'},

  annoNote:{textAlign:'center',fontSize:13,color:'var(--t-blue)',fontFamily:sans,margin:'0 0 16px',padding:'8px 16px',background:'var(--t-blue-bg)',borderRadius:8,border:'1px solid var(--t-blue-border)'},

  lvlActive:{background:'var(--t-primary)',color:'var(--t-primary-text)',borderColor:'var(--t-primary)'},
  testamentHeader:{fontSize:18,fontWeight:600,color:'var(--t-text2)',fontFamily:sans,letterSpacing:'0.04em',textTransform:'uppercase',padding:'8px 0 4px',borderBottom:'2px solid var(--t-border)',marginBottom:4},
  bookList:{display:'flex',flexDirection:'column',gap:16},
  bookItem:{padding:'10px 16px',background:'var(--t-card)',borderRadius:10,border:'1px solid var(--t-border3)'},
  bookRow:{display:'flex',alignItems:'center',gap:8,cursor:'pointer',userSelect:'none'},
  bookArrow:{fontSize:14,color:'var(--t-muted)',width:16,textAlign:'center',flexShrink:0},
  bookName:{fontSize:16,fontWeight:600,color:'var(--t-title)',margin:0,fontFamily:sans},
  bookChapCount:{fontSize:12,color:'var(--t-muted2)',fontFamily:sans,marginLeft:'auto',flexShrink:0},
  chapGrid:{display:'flex',flexWrap:'wrap',gap:4,marginTop:10},
  bmBtn:{fontSize:11,fontFamily:sans,color:'var(--t-accent)',background:'none',border:'1px solid var(--t-accent)',borderRadius:4,padding:'2px 8px',cursor:'pointer',marginLeft:8,flexShrink:0,whiteSpace:'nowrap'},
  chapBtn:{width:36,height:32,border:'1px solid var(--t-border)',borderRadius:4,background:'var(--t-card-solid)',color:'var(--t-text2)',fontSize:13,fontWeight:600,cursor:'pointer',fontFamily:sans,transition:'all 0.15s'},
  navRow:{display:'flex',justifyContent:'center',marginBottom:16},
  navBtn:{background:'none',border:'1px solid var(--t-border2)',borderRadius:5,padding:'4px 14px',fontSize:13,color:'var(--t-med)',cursor:'pointer',fontFamily:sans},
  readingTopBar:{display:'flex',flexDirection:'column',alignItems:'center',gap:10,marginTop:10},
  readingNavBtns:{display:'flex',gap:8},
  ttsBar:{display:'flex',flexWrap:'wrap',alignItems:'center',justifyContent:'center',gap:14,margin:'0 0 16px',padding:'14px 16px',background:'var(--t-tts-bg)',borderRadius:10,border:'1px solid var(--t-tts-border)'},
  ttsPlayAllBtn:{padding:'8px 20px',border:'none',borderRadius:6,background:'var(--t-primary)',color:'var(--t-primary-text)',fontSize:14,fontWeight:600,cursor:'pointer',fontFamily:sans,boxShadow:'0 1px 4px var(--t-card-shadow)'},
  ttsStopBtn:{padding:'8px 20px',border:'none',borderRadius:6,background:'var(--t-accent)',color:'var(--t-primary-text)',fontSize:14,fontWeight:600,cursor:'pointer',fontFamily:sans},
  speedControl:{display:'flex',flexDirection:'column',alignItems:'center',gap:6},
  speedLabel:{fontSize:12,color:'var(--t-med)',fontFamily:sans,fontWeight:600},
  speedPresets:{display:'flex',gap:4},
  speedPresetBtn:{padding:'4px 10px',border:'1.5px solid var(--t-border2)',borderRadius:5,background:'transparent',color:'var(--t-text2)',fontSize:12,fontWeight:600,cursor:'pointer',fontFamily:sans,transition:'all 0.15s'},

  if(!data.en.available)throw new Error('No bible data found');
  ReactDOM.createRoot(document.getElementById('root')).render(
    <App data={data}/>
  );
}).catch(err=>{
  document.getElementById('root').innerHTML=`<div style="text-align:center;margin-top:60px;color:#b34a28;font-family:sans-serif"><h2>${t('errorLoading')}</h2><p>${t('errorHint')}</p><p style="font-size:13px;color:#8a7e6b;margin-top:12px">${err.message}</p></div>`;
});
